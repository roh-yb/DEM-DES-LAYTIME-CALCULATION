    c1.number_input(_lbl(\"notice_hours\", \"Notice time (NOR + 시간) *\"), min_value=0.0, step=1.0, disabled=L, key=\"c_notice_hours\",\n                        format=_num_fmt(ss.get(\"c_notice_hours\"), 2),\n                        help=_help(\"notice_hours\"))\n        c2.selectbox(_lbl(\"berth_terms\", \"Berth 조건\"), list(BERTH_TERMS), disabled=L, key=\"c_berth_terms\", format_func=BERTH_TERMS.get,\n                     help=_help(\"berth_terms\"))\n        c3.selectbox(_lbl(\"laytime_end_event\", \"Laytime 종료 시점\"), list(LAYTIME_END_EVENTS), disabled=L, key=\"c_laytime_end_event\",\n                     format_func=LAYTIME_END_EVENTS.get, help=_help(\"laytime_end_event\"))\n        c4.text_input(_lbl(\"nor_condition\", \"NOR 유효 조건 (메모)\"), disabled=L, key=\"c_nor_condition\",\n                      help=_help(\"nor_condition\") or \"예: ATDNSHINC, WIBON, whether in free pratique or not\")\n        c1, c2, c3 = st.columns(3)\n        c1.checkbox(_lbl(\"commence_if_sooner\", \"Notice time 중 하역 개시 시 실제 시점부터 기산 (unless sooner commenced)\"),\n                    disabled=L, key=\"c_commence_if_sooner\", help=_help(\"commence_if_sooner\"))\n        c2.checkbox(_lbl(\"nor_before_laycan_counts\", \"Laycan 이전 NOR 시 Laycan 전부터 기산 허용\"),\n                    disabled=L, key=\"c_nor_before_laycan_counts\", help=_help(\"nor_before_laycan_counts\"))\n        c3.checkbox(_lbl(\"oodaod\", \"Once on demurrage, always on demurrage\"), disabled=L, key=\"c_oodaod\", help=_help(\"oodaod\"))\n        st.selectbox(_lbl(\"nor_early_mode\", \"Laycan 이전 NOR 제출 시 Laytime 개시\"), list(NOR_EARLY_MODES),\n                     key=\"c_nor_early_mode\", format_func=NOR_EARLY_MODES.get, disabled=L or ss[\"c_nor_before_laycan_counts\"],\n                     help=_help(\"nor_early_mode\") or \"'Laycan 전부터 기산 허용'을 체크하면 사용하지 않습니다.\")\n\n    with st.container(border=True):\n        section(\"예외 항목\", \"체크 = 해당 시간을 Laytime 에서 제외 · 반영률 = 제외 구간 중 여전히 Laytime 으로 계산할 비율 \"\n                         \"(0% = 전부 제외, 50% = 절반 반영)\")\n        widths = [3, 1.3, 1.0, 0.3, 3]\n        h = st.columns(widths)\n        for col, text in zip(h, (\"**항목**\", \"**제외 적용**\", \"**반영률**\", \"\", \"**근거 조항**\")):\n            col.markdown(text)\n        for ek, label in EXCEPTION_LABELS.items():\n            cols = st.columns(widths, vertical_alignment=\"center\")\n            cols[0].markdown(_lbl(f\"exc_{ek}\", label), help=_help(f\"exc_{ek}\"))\n            cols[1].checkbox(\"적용\", disabled=L, key=f\"x_{ek}_applies\", label_visibility=\"collapsed\")\n            cols[2].number_input(\"반영률 (%)\", min_value=0.0, max_value=100.0, step=10.0, key=f\"x_{ek}_pct\",\n                                 format=_num_fmt(ss.get(f\"x_{ek}_pct\"), 2),\n                                 label_visibility=\"collapsed\", disabled=L or not ss[f\"x_{ek}_applies\"])\n            cols[3].markdown(\"**%**\")\n            cols[4].text_input(\"조항\", disabled=L, key=f\"x_{ek}_clause\", label_visibility=\"collapsed\", placeholder=\"예: Cl.18\")\n        st.caption(\"주말·휴일은 Laytime 기준(SHEX 등)으로, OODAOD 는 위 체크박스로 처리합니다. \"\n                   \"기타 중단(STOPPAGE_OTHER)은 계약 근거가 없으므로 항상 '검토 필요'로 표시됩니다.\")\n\n    with st.container(border=True):\n        section(\"근거 조항 번호\", \"Time Sheet 의 '적용 조항' 칸에 표시됩니다.\")\n        c1, c2, c3 = st.columns(3)\n        c1.text_input(_lbl(\"clause_laytime\", \"Laytime 조항\"), disabled=L, key=\"c_clause_laytime\", placeholder=\"예: Cl.5\", help=_help(\"clause_laytime\"))\n        c2.text_input(_lbl(\"clause_nor\", \"NOR 조항\"), disabled=L, key=\"c_clause_nor\", placeholder=\"예: Cl.6\", help=_help(\"clause_nor\"))\n        c3.text_input(_lbl(\"clause_demurrage\", \"Demurrage 조항\"), disabled=L, key=\"c_clause_demurrage\", placeholder=\"예: Cl.7\",\n                      help=_help(\"clause_demurrage\"))\n\n    st.caption(\"* 표시 = 필수 항목\")\n    return state_to_contract()\n", "ui/tab_result.py": "\"\"\"기능 3. Laytime Calculation 결과 화면.\"\"\"\nfrom decimal import Decimal\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core.contract import missing_fields\nfrom core.engine import STATUS_REVIEW, STATUS_USER, calculate\nfrom core.timeutil import fmt_dt, fmt_hhmm, fmt_minutes, to_days\nfrom export.excel import build_excel\nfrom export.report import KIND_LABEL, TIMESHEET_COLUMNS, timesheet_rows\n\nfrom .download import download\nfrom .state import ADJ_LIMIT, ai_pending, current_adjustment, normalize_adjustment\nfrom .style import ROW_COLORS, legend, result_hero, section\n\n\ndef _style_rows(df: pd.DataFrame, rows: list[dict]):\n    def color(row):\n        r = rows[row.name]\n        if r[\"status\"] == STATUS_REVIEW:\n            css = f\"background-color: {ROW_COLORS['review']}\"\n        elif r[\"status\"] == STATUS_USER:\n            css = f\"background-color: {ROW_COLORS['user']}\"\n        elif r[\"on_demurrage\"]:\n            css = f\"background-color: {ROW_COLORS['dem']}\"\n        elif r[\"pct\"] == 0:\n            css = \"color: #8a8a8a\"\n        else:\n            css = \"\"\n        return [css] * len(row)\n\n    return df.style.apply(color, axis=1)\n\n\ndef _review_editor(result: dict) -> bool:\n    \"\"\"검토 필요/사용자 판단 행 편집. 변경 시 True.\"\"\"\n    rows = [r for r in result[\"rows\"] if r[\"status\"] in (STATUS_REVIEW, STATUS_USER)]\n    if not rows:\n        return False\n    overrides = st.session_state[\"overrides\"]\n    pending = sum(1 for r in rows if r[\"status\"] == STATUS_REVIEW)\n    section(f\"⚠️ 검토 필요 — 미확정 {pending}건 / 전체 {len(rows)}건\",\n            \"반영률(%)과 판단 근거를 입력하면 해당 구간에 적용해 바로 재계산합니다. 비워두면 엔진 기본값이 유지되고 '검토 필요'로 남습니다.\")\n    df = pd.DataFrame(\n        [\n            {\n                \"key\": r[\"key\"],\n                \"구간\": f\"{fmt_dt(r['from'])} ~ {fmt_dt(r['to'])}\",\n                \"경과\": fmt_hhmm(r[\"duration\"]),\n                \"사유\": r[\"remarks\"].split(\" — 사용자 판단\")[0],\n                \"엔진 반영률(%)\": float(r[\"auto_pct\"]),\n                \"사용자 반영률(%)\": overrides.get(r[\"key\"], {}).get(\"pct\"),\n                \"판단 근거\": overrides.get(r[\"key\"], {}).get(\"reason\", \"\"),\n            }\n            for r in rows\n        ]\n    )\n    df[\"사용자 반영률(%)\"] = df[\"사용자 반영률(%)\"].astype(\"float\")\n    edited = st.data_editor(\n        df,\n        key=\"review_editor_\" + str(abs(hash(tuple(df[\"key\"])))),\n        hide_index=True,\n        width=\"stretch\",\n        disabled=[\"구간\", \"경과\", \"사유\", \"엔진 반영률(%)\"],\n        column_config={\n            \"key\": None,\n            \"사용자 반영률(%)\": st.column_config.NumberColumn(min_value=0, max_value=100, step=10),\n            \"판단 근거\": st.column_config.TextColumn(width=\"large\"),\n        },\n    )\n    changed = False\n    for _, row in edited.iterrows():\n        k = row[\"key\"]\n        pct = row[\"사용자 반영률(%)\"]\n        reason = \"\" if pd.isna(row[\"판단 근거\"]) else str(row[\"판단 근거\"])\n        new = {\"pct\": round(float(pct), 4), \"reason\": reason} if not pd.isna(pct) else None\n        if new != overrides.get(k):\n            if new is None:\n                overrides.pop(k, None)\n            else:\n                overrides[k] = new\n            changed = True\n    return changed\n\n\ndef _adjustment_section(result: dict) -> dict:\n    \"\"\"최종 금액 수기 조정 — 상대측과의 초 단위 차이 등으로 1의 자리 이하를 맞출 때 (예: +0.02).\n\n    원본 LTC 처럼 수식 안에 '+0.02' 를 숨기지 않고, 조정액과 사유를 별도로 남긴다.\n    값은 위젯이 아닌 session_state['adjustment'] 에 보관한다 (결과가 없어 위젯이 안 그려지는 실행에서도 유지 — REVIEW C1).\n    \"\"\"\n    ss = st.session_state\n    for wkey, field in ((\"w_adj_usd\", \"usd\"), (\"w_adj_reason\", \"reason\")):\n        if wkey not in ss:\n            ss[wkey] = ss[\"adjustment\"][field]\n    c1, c2, c3 = st.columns([1, 2.2, 1.6], vertical_alignment=\"bottom\")\n    c1.number_input(\"최종 금액 수기 조정 (USD)\", min_value=-ADJ_LIMIT, max_value=ADJ_LIMIT, step=0.01, format=\"%.2f\",\n                    key=\"w_adj_usd\", help=\"상대측 정산서와 초 단위 차이 등으로 1의 자리 이하를 맞출 때만 사용 (±9.99 이내)\")\n    c2.text_input(\"조정 사유\", key=\"w_adj_reason\", placeholder=\"예: 상대측 정산서와 초 단위 차이\")\n    adj = normalize_adjustment({\"usd\": ss[\"w_adj_usd\"], \"reason\": ss[\"w_adj_reason\"]})\n    ss[\"adjustment\"] = adj\n    final = result[\"amount\"] + Decimal(str(adj[\"usd\"]))\n    if adj[\"usd\"]:\n        c3.markdown(f\"계산 USD {result['amount']:,.2f} {adj['usd']:+,.2f}<br>**최종 USD {final:,.2f}**\", unsafe_allow_html=True)\n        if not adj[\"reason\"].strip():\n            st.warning(\"조정 사유를 입력하세요. 송부용 Excel 에 사유가 함께 표시됩니다.\")\n    else:\n        c3.caption(\"조정 없음 — 계산 금액이 최종 금액입니다.\")\n    return adj\n\n\ndef _blocked(title: str, items: list[str], hint: str):\n    with st.container(border=True):\n        section(title)\n        for it in items:\n            st.markdown(f\"- {it}\")\n        st.caption(hint)\n\n\ndef render(contract: dict, events: list[dict], errors: list[str]) -> dict | None:\n    missing = missing_fields(contract)\n    if missing:\n        _blocked(\"❌ 계약 조건 필수 항목이 누락되어 계산할 수 없습니다\", missing, \"① 계약 조건 탭에서 입력하세요.\")\n        return None\n    if not events:\n        _blocked(\"SOF 이벤트가 없습니다\", [\"NOR 제출 · 하역 개시 · 하역 완료 이벤트가 필요합니다.\"],\n                 \"② NOR / SOF 탭에서 입력하거나 사이드바의 샘플을 불러오세요.\")\n        return None\n    if errors:\n        _blocked(\"❌ SOF 이벤트 검증 오류로 계산할 수 없습니다\", errors, \"② NOR / SOF 탭에서 수정하세요.\")\n        return None\n\n    try:\n        result = calculate(contract, events, st.session_state[\"overrides\"])\n    except Exception as exc:  # pragma: no cover\n        st.exception(exc)\n        return None\n\n    kind = result[\"kind\"]\n    party = contract.get(\"counterparty\") or \"정산 대상\"\n    if kind == \"DEMURRAGE\":\n        hero_state, direction = \"err\", f\"지급 — 당사 → {party} (Laytime 초과)\"\n    elif kind == \"DESPATCH\":\n        hero_state, direction = \"ok\", f\"수취 — {party} → 당사 (Laytime 절약, {contract['despatch_basis']})\"\n    else:\n        hero_state, direction = \"idle\", \"Laytime 과 사용 시간이 같습니다\"\n    if result[\"review_count\"]:\n        direction += f\" · ⚠️ 검토 필요 {result['review_count']}건 미확정 (금액 변동 가능)\"\n    pending = ai_pending(events)\n    if pending:\n        direction += \" · ⚠️ AI 추출값 미확정 (금액 변동 가능)\"\n        st.warning(\"**AI 결과가 확정되지 않아 아래 금액은 참고용입니다.**\\n\\n\" + \"\\n\".join(f\"- {p}\" for p in pending))\n\n    left, right = st.columns([1.15, 2], vertical_alignment=\"center\")\n    with left:\n        adj = current_adjustment()[\"usd\"]\n        if adj:\n            direction += f\" · 계산 USD {result['amount']:,.2f} 에 수기 조정 {adj:+,.2f}\"\n        result_hero(KIND_LABEL[kind], f\"USD {result['amount'] + Decimal(str(adj)):,.2f}\", direction, hero_state)\n    with right:\n        label = \"Time on Demurrage\" if kind == \"DEMURRAGE\" else f\"Time Saved ({contract['despatch_basis']})\"\n        metrics = [\n            (\"Allowed Laytime\", fmt_minutes(result[\"allowed\"]), f\"{to_days(result['allowed'])} days\"),\n            (\"Time Used\", fmt_minutes(result[\"used\"]), f\"{to_days(result['used'])} days\"),\n            (label, fmt_minutes(result[\"diff\"]), f\"{to_days(result['diff'])} days\"),\n            (\"적용 요율 (USD/day)\", f\"{result['rate']:,.2f}\", \"pro rata\"),\n        ]\n        for row in (metrics[:2], metrics[2:]):\n            cols = st.columns(2)\n            for col, (lab, val, sub) in zip(cols, row):\n                col.metric(lab, val, sub, delta_color=\"off\", delta_arrow=\"off\", border=True)\n\n    st.markdown(\n        f\"**NOR** {fmt_dt(result['nor'])} → **개시** {fmt_dt(result['commence'])} \"\n        f\"<span class='lt-muted'>({result['commence_basis']})<\/span> → **종료** {fmt_dt(result['end'])}\"\n        + (f\" · **체선 진입** {fmt_dt(result['expiry'])}\" if result[\"expiry\"] else \"\"),\n        unsafe_allow_html=True,\n    )\n    notes = result[\"notes\"]\n    if notes:\n        n_warn = sum(1 for lv, _ in notes if lv == \"warning\")\n        with st.expander(f\"계산 메모 {len(notes)}건\" + (f\" · ⚠️ {n_warn}건\" if n_warn else \"\"), expanded=bool(n_warn)):\n            for level, msg in notes:\n                getattr(st, level if level in (\"info\", \"warning\", \"error\") else \"info\")(msg)\n\n    if _review_editor(result):\n        st.rerun()\n\n    with st.container(border=True):\n        section(\"상세 Time Sheet\", \"1일 = 24시간 · 금액 = 요율 × 분 / 1,440 (pro rata) · 최종 금액에서 USD 0.01 반올림 1회\")\n        df = pd.DataFrame(timesheet_rows(result), columns=TIMESHEET_COLUMNS)\n        st.dataframe(_style_rows(df, result[\"rows\"]), hide_index=True, width=\"stretch\",\n                     height=min(40 + 35 * len(df), 700),\n                     column_config={\n                         \"상태\": st.column_config.TextColumn(width=74),\n                         \"From\": st.column_config.TextColumn(width=112),\n                         \"To\": st.column_config.TextColumn(width=112),\n                         \"경과시간\": st.column_config.TextColumn(width=62),\n                         \"반영률(%)\": st.column_config.TextColumn(width=62),\n                         \"반영시간\": st.column_config.TextColumn(width=62),\n                         \"누적 사용\": st.column_config.TextColumn(width=78),\n                         \"적용 조항\": st.column_config.TextColumn(width=165),\n                         \"비고\": st.column_config.TextColumn(width=320),\n                     })\n        legend()\n\n    with st.container(border=True):\n        section(\"출력\", \"시트 1 = 회사 LTC 양식 (송부용) · 시트 2 = Detail (행별 적용 조항·상태) · Contract · SOF Events\")\n        adjustment = _adjustment_section(result)\n        vessel = \" \".join(x for x in (contract.get(\"vessel\"), contract.get(\"voyage\")) if x) or \"vessel\"\n        name = f\"Laytime_Statement_{vessel.replace(' ', '_')}_{contract['port_type']}\"\n        b, w = st.columns([1, 2], vertical_alignment=\"center\")\n        download(\n            b, \"📊 Excel 다운로드\",\n            build_excel(contract, result, events, notices=[\"AI 추출값 미확정\"] if pending else None, adjustment=adjustment),\n            file_name=f\"{name}.xlsx\", mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\", primary=True,\n        )\n        if result[\"review_count\"] or pending:\n            todo = ([f\"검토 필요 {result['review_count']}건\"] if result[\"review_count\"] else []) + ([\"AI 추출값 미확정\"] if pending else [])\n            w.warning(f\"{' · '.join(todo)} 이(가) 남아 있습니다. 출력물에도 경고가 표시됩니다.\")\n        else:\n            w.caption(\"LTC 시트는 A4 세로 1페이지 폭으로 인쇄됩니다. 인쇄 영역 오른쪽(V열~)에 오류 검증·필수 Remark 확인표가 있습니다.\")\n    return result\n", "ui/tab_sof.py": "\"\"\"기능 2. NOR/SOF 제출 및 데이터 확인.\"\"\"\nfrom datetime import date\n\nimport streamlit as st\n\nfrom ai import client as ai_client\nfrom ai.extract import file_to_payload\nfrom ai.parsers import parse_sof\nfrom core.calendar_util import country_holidays\nfrom core.constants import EVENT_LABELS, EVENT_TYPES, INTERVAL_EVENTS, event_label\nfrom core.timeutil import parse_dt\nfrom core.validator import validate_events\n\nfrom .state import df_to_events, holidays_in_use, queue_state, record_ai_error, record_usage\nfrom .style import section\n\n\ndef run_sof_ai(contract: dict, body: str, images: list[str], mode: str = \"교체\") -> None:\n    \"\"\"SOF/NOR → AI 판독 → 이벤트 표 (미확정 상태). 탭과 사이드바 '불러오기' 에서 같이 사용.\"\"\"\n    hint = \" ~ \".join(x for x in (contract.get(\"laycan_start\"), contract.get(\"laycan_end\")) if x)\n    try:\n        with st.spinner(\"조체선료 분석 모델로 SOF 판독 중…\"):\n            result = parse_sof(body, images, hint)\n    except Exception as exc:\n        record_ai_error(exc)\n        st.error(f\"AI 파싱 실패: {exc}\")\n        return\n    record_usage(result[\"usage\"])\n    # '추가' 모드도 새 AI 행이 들어오므로 다시 확인이 필요하다\n    st.session_state[\"ai_sof\"] = {\"summary\": result[\"summary\"], \"count\": len(result[\"events\"]),\n                                  \"flagged\": sum(1 for e in result[\"events\"] if e[\"ai_flag\"]), \"confirmed\": False}\n    updates = {}\n    # SOF 머리글 값은 계약 입력칸이 비어 있을 때만 채운다 (계약서 값이 우선) — 계약 잠금 중이면 건드리지 않음\n    ss = st.session_state\n    load = ss.get(\"c_port_type\") == \"LOAD\"\n    header = {\n        \"c_vessel\": result.get(\"vessel\"),\n        \"c_voyage\": result.get(\"voyage\"),\n        \"c_load_port\": result.get(\"load_port\") or (result.get(\"port\") if load else None),\n        \"c_disch_port\": result.get(\"disch_port\") or (None if load else result.get(\"port\")),\n        \"c_cargo_name\": result.get(\"cargo\"),\n    }\n    if not ss.get(\"contract_locked\"):\n        updates.update({k: v for k, v in header.items() if v and not ss.get(k)})\n        if result.get(\"bl_qty\") and not ss.get(\"c_cargo_qty\"):\n            updates[\"c_cargo_qty\"] = float(result[\"bl_qty\"])\n    if mode == \"추가\":\n        # 편집기의 현재 값(사용자 수정 포함)은 표가 그려진 뒤에야 알 수 있으므로, 표 렌더링 후 병합한다\n        st.session_state[\"_append_events\"] = result[\"events\"]\n        queue_state(updates)\n    else:\n        queue_state(updates, events=result[\"events\"])\n\n\ndef _ai_section(contract: dict):\n    with st.expander(\"🤖 SOF / NOR 파일로 이벤트 표 자동 생성 (AI)\", expanded=st.session_state[\"events_df\"].empty):\n        if not ai_client.is_available():\n            st.info(\"OPENAI_API_KEY 가 설정되지 않아 AI 기능을 사용할 수 없습니다. 아래 표에 직접 입력하세요.\")\n            return\n        up = st.file_uploader(\"SOF 파일 (PDF / 엑셀 / CSV / 이미지 / TXT)\", type=[\"pdf\", \"xlsx\", \"xlsm\", \"csv\", \"png\", \"jpg\", \"jpeg\", \"webp\", \"txt\"], key=\"sof_file\")\n        text = st.text_area(\"또는 SOF 텍스트 붙여넣기\", height=180, key=\"sof_raw_text\")\n        mode = st.radio(\"기존 표 처리\", [\"교체\", \"추가\"], horizontal=True, key=\"sof_merge_mode\")\n        st.caption(\"⚠️ SOF 내용은 OpenAI API 로 전송됩니다. 스캔본은 비전 모델(OPENAI_VISION_MODEL)로 판독합니다.\")\n        if st.button(\"AI 파싱 실행\", type=\"primary\", key=\"btn_ai_sof\"):\n            images: list[str] = []\n            body = text or \"\"\n            try:\n                if up is not None:\n                    ftext, images = file_to_payload(up.name, up.getvalue())\n                    body = (body + \"\\n\\n\" + ftext).strip()\n                if not body and not images:\n                    st.warning(\"SOF 파일을 업로드하거나 텍스트를 입력하세요.\")\n                    return\n            except Exception as exc:\n                st.error(f\"파일을 읽을 수 없습니다: {exc}\")\n                return\n            run_sof_ai(contract, body, images, mode)\n\n    info = st.session_state.get(\"ai_sof\")\n    if info and info.get(\"confirmed\"):\n        st.success(f\"AI 가 추출한 이벤트 {info['count']}건을 확정했습니다.\")\n    elif info:\n        st.warning(f\"AI 가 이벤트 {info['count']}건을 추출했습니다 (🚩 {info.get('flagged', 0)}건) — **아직 미확정**. \"\n                   \"아래 표를 원본 SOF 와 대조·수정하고 'SOF 이벤트 확정'을 누르세요. 확정 전 정산 결과는 '검토 필요'로 표시됩니다.\")\n        if info.get(\"summary\"):\n            st.caption(f\"AI 요약: {info['summary']}\")\n\n\ndef _confirm_bar(events: list[dict]):\n    \"\"\"PRD §5-2: AI 로 만든 이벤트 표는 사용자가 확인·수정한 뒤 '확정'해야 결과가 '확정 가능'이 된다.\"\"\"\n    info = st.session_state.get(\"ai_sof\")\n    if not info or info.get(\"confirmed\"):\n        return\n    flagged = sum(1 for e in events if e.get(\"ai_flag\"))\n    c1, c2 = st.columns([1, 3], vertical_alignment=\"center\")\n    if c1.button(\"✅ SOF 이벤트 확정\", key=\"btn_sof_confirm\", type=\"primary\", width=\"stretch\", disabled=bool(flagged),\n                 help=\"🚩 행을 모두 확인(체크 해제)해야 확정할 수 있습니다.\" if flagged else None):\n        info[\"confirmed\"] = True\n        st.rerun()\n    if flagged:\n        c2.warning(f\"🚩 AI 확인 필요 행 {flagged}건 — 비고의 [확인] 내용을 원본과 대조해 고친 뒤 '🚩 AI 확인' 체크를 해제하면 확정할 수 있습니다.\")\n    else:\n        c2.caption(\"표의 모든 행을 원본 SOF 와 대조했으면 확정하세요.\")\n\n\ndef _holiday_section(contract: dict):\n    years = set()\n    for k in (\"laycan_start\", \"laycan_end\"):\n        dt = parse_dt(contract.get(k))\n        if dt:\n            years.add(dt.year)\n    years = sorted(years) or [date.today().year]\n    n_hol = len(holidays_in_use())\n    shinc = contract[\"laytime_terms\"] == \"SHINC\"\n    country = (contract.get(\"country\") or \"\").strip().upper()\n    auto_key = f\"{country}|{years}\"\n    if not shinc and n_hol == 0 and country and st.session_state.get(\"_auto_holidays\") != auto_key:\n        # PRD §5-2: 해당 항의 공휴일 캘린더 자동 적용 (같은 국가·연도는 한 번만 — 사용자가 비운 표를 다시 채우지 않음)\n        st.session_state[\"_auto_holidays\"] = auto_key\n        items = country_holidays(country, years)\n        if items:\n            queue_state({}, holidays=items)\n    title = f\"④ 휴일 캘린더 — {n_hol}일 적용\" + (\" (SHINC: 계산 영향 없음)\" if shinc else \"\")\n    with st.expander(title, expanded=not shinc and n_hol == 0):\n        c1, c2 = st.columns([1, 2], vertical_alignment=\"center\")\n        if c1.button(f\"{contract.get('country') or '?'} 공휴일 불러오기 ({', '.join(map(str, years))})\", key=\"btn_holidays\"):\n            items = country_holidays(contract.get(\"country\") or \"\", years)\n            if not items:\n                st.warning(\"해당 국가 코드의 공휴일을 찾지 못했습니다. ① 탭의 국가 코드를 확인하거나 직접 입력하세요.\")\n            else:\n                queue_state({}, holidays=items)\n        c2.caption(\"항만 휴무일·지방 공휴일은 행을 추가하고, 계약상 휴일이 아닌 날은 '적용' 체크를 해제하세요. \"\n                   \"휴일은 해당일 00:00~24:00 로 처리됩니다.\")\n        return st.data_editor(\n            st.session_state[\"holidays_df\"],\n            key=f\"holidays_editor_{st.session_state['holidays_version']}\",\n            num_rows=\"dynamic\",\n            hide_index=True,\n            width=\"stretch\",\n            column_config={\n                \"적용\": st.column_config.CheckboxColumn(default=True, width=\"small\"),\n                \"날짜\": st.column_config.DateColumn(format=\"YYYY-MM-DD\"),\n                \"명칭\": st.column_config.TextColumn(width=\"large\"),\n            },\n        )\n\n\ndef _validation_section(events, errors, warnings):\n    if not events:\n        section(\"③ 자동 검증\")\n        st.info(\"검증할 이벤트가 없습니다. 위 ① 에서 SOF 를 가져오거나, ② 표에 직접 입력하거나, 사이드바에서 샘플을 불러오세요.\")\n        return\n    if errors:\n        head, state = f\"❌ 오류 {len(errors)}건 · ⚠️ 경고 {len(warnings)}건 — 오류를 고쳐야 계산됩니다\", \"err\"\n    elif warnings:\n        head, state = f\"⚠️ 경고 {len(warnings)}건 — 계산은 가능하지만 확인이 필요합니다\", \"warn\"\n    else:\n        head, state = \"✅ 검증 통과 — ③ 정산 결과 탭에서 결과를 확인하세요\", \"ok\"\n    section(\"③ 자동 검증\")\n    with st.expander(head, expanded=state != \"ok\"):\n        if errors:\n            st.markdown(\"**오류 (계산 불가)**\")\n            for e in errors:\n                st.error(e)\n        if warnings:\n            st.markdown(\"**경고 (확인 필요)**\")\n            for w in warnings:\n                st.warning(w)\n        if state == \"ok\":\n            st.caption(\"필수 이벤트, 시간 순서, 기간 중복, Laycan 대비 NOR 시점을 확인했습니다.\")\n\n\ndef render(contract: dict) -> tuple[list[dict], list[str], list[str]]:\n    section(\"① SOF 가져오기\")\n    _ai_section(contract)\n\n    with st.container(border=True):\n        section(\"② 이벤트 확인 · 수정\",\n                \"구간 이벤트(Shifting, Draft survey, 악천후, 고장, 파업, 기타 중단)는 시작·종료를 모두, \"\n                \"시점 이벤트(NOR, 하역 개시/완료 등)는 시작만 입력합니다. 시각은 항구 현지시간 · 행 추가는 표 아래 + 버튼\")\n        edited = st.data_editor(\n            st.session_state[\"events_df\"],\n            key=f\"events_editor_{st.session_state['events_version']}\",\n            num_rows=\"dynamic\",\n            hide_index=False,\n            width=\"stretch\",\n            height=min(38 + 35 * (len(st.session_state[\"events_df\"]) + 2), 640),\n            column_config={\n                \"start\": st.column_config.DatetimeColumn(\"시작\", format=\"YYYY-MM-DD HH:mm\", step=60, required=True),\n                \"end\": st.column_config.DatetimeColumn(\"종료 (구간)\", format=\"YYYY-MM-DD HH:mm\", step=60),\n                \"event_type\": st.column_config.SelectboxColumn(\"이벤트\", options=EVENT_LABELS, required=True, width=\"medium\"),\n                \"description\": st.column_config.TextColumn(\"SOF 원문\", width=\"large\"),\n                \"remarks\": st.column_config.TextColumn(\"비고\", width=\"medium\"),\n                \"ai_flag\": st.column_config.CheckboxColumn(\"🚩 AI 확인\", help=\"AI 판독이 불확실한 행 — 원본과 대조 후 체크 해제\", width=\"small\"),\n            },\n        )\n        events = df_to_events(edited)\n        if \"_append_events\" in st.session_state:  # AI '추가' 결과를 현재 표(사용자 수정 포함) 뒤에 붙인다\n            queue_state({}, events=events + st.session_state.pop(\"_append_events\"))\n        _confirm_bar(events)\n        with st.expander(\"이벤트 코드 안내\"):\n            st.markdown(\n                \"\\n\".join(\n                    f\"- **{event_label(c)}**\" + (\" — 구간 (시작~종료)\" if c in INTERVAL_EVENTS else \"\")\n                    for c in EVENT_TYPES\n                )\n            )\n\n    errors, warnings = validate_events(contract, events)\n    if contract[\"laytime_terms\"] != \"SHINC\" and not holidays_in_use():\n        warnings.append(f\"{contract['laytime_terms']} 계약인데 적용된 휴일이 0일입니다. ④ 휴일 캘린더에서 항구 공휴일을 확인하세요 \"\n                        \"(누락 시 휴일이 Laytime 에 포함되어 사용 시간이 과대 계산됩니다).\")\n    flagged = sum(1 for e in events if e.get(\"ai_flag\"))\n    if flagged:\n        warnings.insert(0, f\"🚩 AI 확인 필요 행 {flagged}건이 남아 있습니다. 원본 SOF 와 대조 후 체크를 해제하세요.\")\n    _validation_section(events, errors, warnings)\n\n    holidays_df = _holiday_section(contract)\n    contract[\"holidays\"] = holidays_in_use(holidays_df)\n    return events, errors, warnings\n", "export/__init__.py": "", "export/excel.py": "\"\"\"정산 대상 송부용 Laytime Statement (Excel).\n\n- 시트 1 'V-<항차>' (또는 'LTC'): 회사 LTC 양식 (export/ltc.py) — 송부용\n- 시트 2 'Detail (검토용)': 행별 적용 조항·상태·누적 · 서명란 (A4 가로 1페이지 폭 인쇄)\n- 시트 3 'Contract': 적용 계약 조건\n- 시트 4 'SOF Events': 확정 이벤트 표\n일시는 Excel 날짜값, 시간은 [h]:mm 값으로 기록하여 검토자가 수식으로 검산할 수 있다.\n\"\"\"\nimport io\nfrom datetime import datetime\nfrom decimal import Decimal\n\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nfrom core.constants import BASIS_LABELS_EN, EVENT_TYPES\nfrom core.timeutil import fmt_dt, fmt_minutes, to_days\n\nfrom .importer import embed_payload\nfrom .ltc import write_ltc\nfrom .report import KIND_LABEL, contract_rows\n\nNAVY = \"1F3864\"\nHEADER_FILL = PatternFill(\"solid\", fgColor=NAVY)\nLABEL_FILL = PatternFill(\"solid\", fgColor=\"E7ECF5\")\nRESULT_FILL = PatternFill(\"solid\", fgColor=\"FFF2CC\")\nREVIEW_FILL = PatternFill(\"solid\", fgColor=\"FFE699\")\nUSER_FILL = PatternFill(\"solid\", fgColor=\"DDEBF7\")\nDEM_FILL = PatternFill(\"solid\", fgColor=\"FCE4D6\")\nGREY = Font(color=\"808080\")\nTHIN = Side(style=\"thin\", color=\"A6A6A6\")\nBORDER = Border(left=THIN, right=THIN, top=THIN, bottom=THIN)\nDT_FMT = \"yyyy-mm-dd hh:mm\"\nDUR_FMT = \"[h]:mm\"\nWRAP = Alignment(wrap_text=True, vertical=\"top\")\nCENTER = Alignment(horizontal=\"center\", vertical=\"center\", wrap_text=True)\n\nCOLS = [\"From\", \"To\", \"Duration\", \"Counted %\", \"Time Counted\", \"Cumulative\", \"Clause (적용 조항)\", \"Remarks (비고)\", \"Status\"]\nWIDTHS = [17, 17, 10, 10, 12, 12, 32, 58, 11]\n\n\ndef _days(minutes) -> float:\n    return float(Decimal(str(minutes)) / Decimal(1440))\n\n\ndef _box(ws, row, col, value, *, bold=False, fill=None, fmt=None, align=None, font=None):\n    cell = ws.cell(row=row, column=col, value=value)\n    cell.border = BORDER\n    if bold:\n        cell.font = Font(bold=True)\n    if font:\n        cell.font = font\n    if fill:\n        cell.fill = fill\n    if fmt:\n        cell.number_format = fmt\n    cell.alignment = align or WRAP\n    return cell\n\n\ndef _pair(ws, row, label, value, c_label, c_from, c_to, fill=None, bold_value=False):\n    _box(ws, row, c_label, label, bold=True, fill=LABEL_FILL)\n    _box(ws, row, c_from, value, fill=fill, bold=bold_value)\n    for col in range(c_from + 1, c_to + 1):\n        _box(ws, row, col, None, fill=fill)\n    ws.merge_cells(start_row=row, start_column=c_from, end_row=row, end_column=c_to)\n\n\ndef _statement_sheet(ws, c: dict, r: dict, notices: list[str] | None = None):\n    for i, w in enumerate(WIDTHS, start=1):\n        ws.column_dimensions[get_column_letter(i)].width = w\n\n    ws.merge_cells(\"A1:I1\")\n    ws[\"A1\"] = \"LAYTIME STATEMENT\"\n    ws[\"A1\"].font = Font(bold=True, size=18, color=NAVY)\n    ws[\"A1\"].alignment = Alignment(horizontal=\"center\")\n    ws.merge_cells(\"A2:I2\")\n    port_kind = \"Loading Port\" if c[\"port_type\"] == \"LOAD\" else \"Discharging Port\"\n    ws[\"A2\"] = f\"Demurrage / Despatch Calculation — {port_kind} · Basis: {BASIS_LABELS_EN[c['basis']]}\"\n    ws[\"A2\"].alignment = Alignment(horizontal=\"center\")\n    ws[\"A2\"].font = Font(italic=True, color=\"595959\")\n\n    # 1) Particulars (좌: A 라벨/B~D 값, 우: F 라벨/G~I 값)\n    laytime_terms = (\n        f\"{float(c['rate_mt_day']):,.0f} MT/day {c['laytime_terms']}\" if c[\"laytime_mode\"] == \"RATE\"\n        else f\"Fixed {c['fixed_laytime_hours']} hrs {c['laytime_terms']}\"\n    )\n    if c[\"laytime_terms\"] != \"SHINC\":\n        laytime_terms += f\" {c['excepted_used']}\"\n    left = [\n        (\"Vessel\", c.get(\"vessel\") or \"\"),\n        (\"Port\", c.get(\"port\") or \"\"),\n        (\"Counterparty\", c.get(\"counterparty\") or \"\"),  # 정산 대상\n        (\"Laycan\", f\"{c.get('laycan_start') or ''} ~ {c.get('laycan_end') or ''}\"),\n        (\"Cargo (MT)\", f\"{float(c.get('cargo_qty') or 0):,.3f}\"),\n        (\"Laytime terms\", laytime_terms),\n    ]\n    right = [\n        (\"Demurrage rate\", f\"USD {r['demurrage_rate']:,.2f} /day pro rata\"),\n        (\"Despatch rate\", f\"USD {r['despatch_rate']:,.2f} /day pro rata ({c['despatch_basis']})\"),\n        (\"NOR tendered\", fmt_dt(r[\"nor\"])),\n        (\"Laytime commenced\", f\"{fmt_dt(r['commence'])}\\n{r['commence_basis']}\"),\n        (\"Laytime completed\", fmt_dt(r[\"end\"])),\n        (\"Laytime expired\", fmt_dt(r[\"expiry\"]) if r[\"expiry\"] else \"-\"),\n    ]\n    row = 4\n    _box(ws, row, 1, \"PARTICULARS\", bold=True, font=Font(bold=True, color=\"FFFFFF\"), fill=HEADER_FILL)\n    ws.merge_cells(start_row=row, start_column=1, end_row=row, end_column=9)\n    row += 1\n    for (ll, lv), (rl, rv) in zip(left, right):\n        _pair(ws, row, ll, lv, 1, 2, 4)\n        _pair(ws, row, rl, rv, 6, 7, 9)\n        if \"\\n\" in rv:\n            ws.row_dimensions[row].height = 30\n        row += 1\n\n    # 2) Result\n    row += 1\n    _box(ws, row, 1, \"RESULT\", bold=True, font=Font(bold=True, color=\"FFFFFF\"), fill=HEADER_FILL)\n    ws.merge_cells(start_row=row, start_column=1, end_row=row, end_column=9)\n    row += 1\n    diff_label = \"Time on Demurrage\" if r[\"kind\"] == \"DEMURRAGE\" else f\"Time Saved ({c['despatch_basis']})\"\n    results = [\n        (\"Allowed Laytime\", r[\"allowed\"]),\n        (\"Time Used\", r[\"used\"]),\n        (diff_label, r[\"diff\"]),\n    ]\n    for label, minutes in results:\n        _box(ws, row, 1, label, bold=True, fill=LABEL_FILL)\n        _box(ws, row, 2, _days(minutes), fmt=DUR_FMT, align=CENTER)\n        _box(ws, row, 3, f\"{fmt_minutes(minutes)}\", align=CENTER)\n        _box(ws, row, 4, f\"{to_days(minutes)} days\", align=CENTER)\n        row += 1\n    _box(ws, row, 1, KIND_LABEL[r[\"kind\"]], bold=True, fill=RESULT_FILL)\n    amt = _box(ws, row, 2, float(r[\"amount\"]), fill=RESULT_FILL, fmt='\"USD\" #,##0.00', align=CENTER)\n    amt.font = Font(bold=True, size=13)\n    _box(ws, row, 3, None, fill=RESULT_FILL)\n    _box(ws, row, 4, None, fill=RESULT_FILL)\n    ws.merge_cells(start_row=row, start_column=2, end_row=row, end_column=4)\n    note = ws.cell(row=row - 3, column=6, value=\"1 day = 24 hrs · 금액 = 요율 × 시간(일) pro rata · USD 0.01 반올림\")\n    note.font = Font(italic=True, color=\"808080\", size=9)\n    ws.merge_cells(start_row=row - 3, start_column=6, end_row=row - 3, end_column=9)\n    if r[\"review_count\"]:\n        warn = ws.cell(row=row - 1, column=6, value=f\"⚠ 검토 필요 {r['review_count']}건 미확정 — 송부 전 확인 필요\")\n        warn.font = Font(bold=True, color=\"C00000\")\n        ws.merge_cells(start_row=row - 1, start_column=6, end_row=row - 1, end_column=9)\n    if notices:\n        warn = ws.cell(row=row - 2, column=6, value=\"⚠ \" + \" / \".join(notices))\n        warn.font = Font(bold=True, color=\"C00000\")\n        ws.merge_cells(start_row=row - 2, start_column=6, end_row=row - 2, end_column=9)\n    row += 2\n\n    # 3) Time Sheet\n    _box(ws, row, 1, \"TIME SHEET\", bold=True, font=Font(bold=True, color=\"FFFFFF\"), fill=HEADER_FILL)\n    ws.merge_cells(start_row=row, start_column=1, end_row=row, end_column=9)\n    row += 1\n    header_row = row\n    for col, h in enumerate(COLS, start=1):\n        cell = _box(ws, row, col, h, fill=LABEL_FILL, align=CENTER)\n        cell.font = Font(bold=True)\n    row += 1\n    first = row\n    for item in r[\"rows\"]:\n        if item[\"status\"] == \"검토 필요\":\n            fill = REVIEW_FILL\n        elif item[\"status\"] == \"사용자 판단\":\n            fill = USER_FILL\n        elif item[\"on_demurrage\"]:\n            fill = DEM_FILL\n        else:\n            fill = None\n        font = GREY if item[\"pct\"] == 0 and fill is None else None\n        remarks = (\"[ON DEMURRAGE] \" if item[\"on_demurrage\"] else \"\") + item[\"remarks\"]\n        vals = [\n            (item[\"from\"], DT_FMT), (item[\"to\"], DT_FMT), (_days(item[\"duration\"]), DUR_FMT),\n            (float(item[\"pct\"]) / 100, \"0%\"), (_days(item[\"counted\"]), DUR_FMT),\n            (_days(item[\"cumulative\"]) if item[\"cumulative\"] is not None else None, DUR_FMT),\n            (item[\"clause\"], None), (remarks, None), (item[\"status\"], None),\n        ]\n        for col, (v, fmt) in enumerate(vals, start=1):\n            cell = _box(ws, row, col, v, fill=fill, fmt=fmt, align=CENTER if col <= 6 or col == 9 else WRAP)\n            if font:\n                cell.font = font\n        row += 1\n    last = row - 1\n    _box(ws, row, 1, \"TOTAL TIME USED\", bold=True, fill=LABEL_FILL)\n    ws.merge_cells(start_row=row, start_column=1, end_row=row, end_column=4)\n    total = _box(ws, row, 5, f\"=SUM(E{first}:E{last})\" if last >= first else 0, fmt=DUR_FMT, align=CENTER, fill=LABEL_FILL)\n    total.font = Font(bold=True)\n    ws.freeze_panes = None\n    row += 3\n\n    # 4) 서명란\n    for col_from, col_to, title in ((1, 3, \"Prepared by\"), (4, 6, \"Checked by\"), (7, 9, \"Agreed by (Owner / Supplier)\")):\n        _box(ws, row, col_from, title, bold=True, fill=LABEL_FILL, align=CENTER)\n        for col in range(col_from + 1, col_to + 1):\n            _box(ws, row, col, None, fill=LABEL_FILL)\n        ws.merge_cells(start_row=row, start_column=col_from, end_row=row, end_column=col_to)\n        for col in range(col_from, col_to + 1):\n            _box(ws, row + 1, col, None)\n        ws.merge_cells(start_row=row + 1, start_column=col_from, end_row=row + 1, end_column=col_to)\n    ws.row_dimensions[row + 1].height = 45\n    foot = ws.cell(row=row + 3, column=1, value=f\"Generated {datetime.now():%Y-%m-%d %H:%M} · Laytime Calculator · Without prejudice\")\n    foot.font = Font(italic=True, color=\"808080\", size=9)\n\n    # 인쇄 설정: A4 가로, 폭 1페이지, Time Sheet 머리글 반복\n    ws.page_setup.orientation = \"landscape\"\n    ws.page_setup.paperSize = ws.PAPERSIZE_A4\n    ws.page_setup.fitToWidth = 1\n    ws.page_setup.fitToHeight = 0\n    ws.sheet_properties.pageSetUpPr.fitToPage = True\n    ws.print_title_rows = f\"{header_row}:{header_row}\"\n    ws.page_margins.left = ws.page_margins.right = 0.4\n    ws.sheet_view.showGridLines = False\n\n\ndef build_excel(c: dict, r: dict, events: list[dict], notices: list[str] | None = None,\n                adjustment: dict | None = None) -> bytes:\n    \"\"\"notices: 결과 옆에 빨간 경고로 표시할 문구 (예: AI 추출값 미확정).\n    adjustment: {\"usd\": 최종 금액 수기 조정액, \"reason\": 사유} — 상대측과의 초 단위 차이 등 (회사 LTC 시트에 별도 행으로 표시).\n    \"\"\"\n    wb = Workbook()\n    ltc = wb.active\n    write_ltc(ltc, c, r, events, adjustment)\n    warn = list(notices or []) + ([f\"검토 필요 {r['review_count']}건 미확정\"] if r[\"review_count\"] else [])\n    if warn:  # 송부 전 확인용 — 인쇄 영역 맨 위에 빨간 글씨\n        ltc[\"B1\"] = \"⚠ \" + \" / \".join(warn) + \" — 송부 전 확인 필요\"\n        ltc[\"B1\"].font = Font(name=\"Arial\", size=9, bold=True, color=\"C00000\")\n\n    detail_notices = list(notices or [])\n    adj = Decimal(str((adjustment or {}).get(\"usd\") or 0))\n    if adj:\n        detail_notices.append(f\"수기 조정 {adj:+,.2f} ({(adjustment or {}).get('reason') or '사유 미기재'}) → 최종 USD {r['amount'] + adj:,.2f}\")\n    ws = wb.create_sheet(\"Detail (검토용)\")\n    _statement_sheet(ws, c, r, detail_notices)\n\n    cs = wb.create_sheet(\"Contract\")\n    for col, h in enumerate([\"항목\", \"내용\"], start=1):\n        _box(cs, 1, col, h, fill=HEADER_FILL, font=Font(bold=True, color=\"FFFFFF\"), align=CENTER)\n    for i, (k, v) in enumerate(contract_rows(c), start=2):\n        _box(cs, i, 1, k, bold=True, fill=LABEL_FILL)\n        _box(cs, i, 2, v)\n    cs.column_dimensions[\"A\"].width = 32\n    cs.column_dimensions[\"B\"].width = 90\n\n    es = wb.create_sheet(\"SOF Events\")\n    for col, h in enumerate([\"Start\", \"End\", \"Event\", \"Description (SOF 원문)\", \"Remarks\"], start=1):\n        _box(es, 1, col, h, fill=HEADER_FILL, font=Font(bold=True, color=\"FFFFFF\"), align=CENTER)\n    for i, e in enumerate(sorted(events, key=lambda x: x[\"start\"]), start=2):\n        _box(es, i, 1, e[\"start\"], fmt=DT_FMT, align=CENTER)\n        _box(es, i, 2, e.get(\"end\"), fmt=DT_FMT, align=CENTER)\n        _box(es, i, 3, EVENT_TYPES.get(e[\"event_type\"], e[\"event_type\"]))\n        _box(es, i, 4, e.get(\"description\", \"\"))\n        _box(es, i, 5, e.get(\"remarks\", \"\"))\n    for col, w in zip(\"ABCDE\", (17, 17, 24, 60, 40)):\n        es.column_dimensions[col].width = w\n    es.freeze_panes = \"A2\"\n\n    embed_payload(wb, c, events, adjustment)  # 사이드바 '불러오기' 로 그대로 복원 (숨은 시트)\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n", "export/importer.py": "\"\"\"작업 파일 불러오기 — JSON 외 Excel 지원.\n\n- 이 앱이 내보낸 Excel: 숨은 시트 '_data' 에 작업 내용(JSON)을 넣어 두므로 계약·SOF·수기 조정을 그대로 복원한다.\n- 회사 LTC 양식 Excel (정산 예시/1. PAN DELIGHT 064R - 양하항 LTC.xlsx 같은 파일): 머리글을 읽어 계약 조건을 채운다.\n  (Time Sheet 행은 계산 결과라 SOF 이벤트로 되돌리지 않는다 — SOF 는 ② 탭에서 원본으로 입력)\n\"\"\"\nimport io\nimport json\nimport re\n\nfrom openpyxl import load_workbook\n\nfrom core.constants import PORT_COUNTRY\nfrom core.timeutil import fmt_dt\n\nDATA_SHEET = \"_data\"\nCHUNK = 30000  # Excel 셀 최대 32,767자\n\n\ndef embed_payload(wb, contract: dict, events: list[dict], adjustment: dict | None) -> None:\n    \"\"\"작업 내용을 숨은 시트에 저장 (다시 불러오기용).\"\"\"\n    payload = {\"contract\": contract, \"adjustment\": adjustment or {\"usd\": 0.0, \"reason\": \"\"},\n               \"events\": [{**e, \"start\": fmt_dt(e.get(\"start\")), \"end\": fmt_dt(e.get(\"end\")) or None} for e in events]}\n    text = json.dumps(payload, ensure_ascii=False, default=str)\n    ws = wb.create_sheet(DATA_SHEET)\n    ws.sheet_state = \"hidden\"\n    for i in range(0, len(text), CHUNK):\n        ws.cell(row=i // CHUNK + 1, column=1, value=text[i:i + CHUNK])\n\n\ndef read_excel(raw: bytes, filename: str = \"\") -> dict:\n    \"\"\"반환: {\"kind\": \"app\", \"data\": {...JSON 과 같은 구조}} 또는 {\"kind\": \"ltc\", \"contract\": {...}, \"found\": [...]}\"\"\"\n    wb = load_workbook(io.BytesIO(raw))\n    if DATA_SHEET in wb.sheetnames:\n        ws = wb[DATA_SHEET]\n        text = \"\".join(str(ws.cell(row=r, column=1).value or \"\") for r in range(1, ws.max_row + 1))\n        return {\"kind\": \"app\", \"data\": json.loads(text)}\n    for ws in wb.worksheets:\n        contract, found = _parse_company_ltc(ws, filename)\n        if found:\n            return {\"kind\": \"ltc\", \"contract\": contract, \"found\": found}\n    raise ValueError(\"이 앱에서 내보낸 Excel 이나 회사 LTC 양식(LAYTIME STATEMENT)이 아닙니다.\")\n\n\ndef _num(v):\n    if isinstance(v, (int, float)) and not isinstance(v, bool):\n        return float(v)\n    try:\n        return float(str(v).replace(\",\", \"\").replace(\"$\", \"\").strip())\n    except (TypeError, ValueError):\n        return None\n\n\ndef _parse_company_ltc(ws, filename: str) -> tuple[dict, list[str]]:\n    rows = {}\n    for r in range(1, 40):\n        label = ws.cell(row=r, column=2).value\n        if isinstance(label, str) and label.strip():\n            rows[label.strip().upper()] = r\n\n    def row(prefix):\n        return next((r for k, r in rows.items() if k.startswith(prefix)), None)\n\n    title = \" \".join(str(ws.cell(row=r, column=2).value or \"\") for r in range(1, 6)).replace(\" \", \"\").upper()\n    if \"LAYTIMESTATEMENT\" not in title or not row(\"NAME OF VESSEL\"):\n        return {}, []\n    c, found = {}, []\n\n    def val(r, col=\"L\"):\n        return ws[f\"{col}{r}\"].value if r else None\n\n    if (r := row(\"NAME OF VESSEL\")) and val(r):\n        parts = str(val(r)).strip().split()\n        if len(parts) > 1 and re.search(r\"\\d\", parts[-1]):\n            c[\"vessel\"], c[\"voyage\"] = \" \".join(parts[:-1]), parts[-1]\n        else:\n            c[\"vessel\"] = \" \".join(parts)\n        found.append(\"선박·항차\")\n    if (r := row(\"PORT OF LOADING\")) and val(r):\n        c[\"load_port\"] = str(val(r)).strip()\n    if (r := row(\"PORT OF DISCHARGING\")) and val(r):\n        c[\"disch_port\"] = str(val(r)).strip()\n    if \"load_port\" in c or \"disch_port\" in c:\n        found.append(\"선적항·양하항\")\n    if (r := row(\"CARGO QTTY\")) and _num(val(r)):\n        c[\"cargo_qty\"] = _num(val(r))\n        if val(r, \"Q\"):\n            c[\"cargo_name\"] = str(val(r, \"Q\")).strip().upper()\n        found.append(\"화물·B/L 수량\")\n    if (r := row(\"LOAD/DISCH TERMS\")) and _num(val(r)):\n        c[\"laytime_mode\"], c[\"rate_mt_day\"] = \"RATE\", _num(val(r))\n        found.append(\"하역률\")\n    if (r := row(\"LAYTIME ALLOWED\")):\n        formula = str(val(r) or \"\")\n        if formula.replace(\" \", \"\").upper() == \"=L8/L9\":\n            c[\"allowed_rounding\"] = \"EXACT\"\n        fmt = (ws[f\"P{r}\"].number_format or \"\").upper()\n        if \"SSHEX\" in fmt:\n            c[\"laytime_terms\"] = \"SSHEX\"\n        elif \"SHEX\" in fmt:\n            c[\"laytime_terms\"] = \"SHEX\"\n        elif \"SHINC\" in fmt:  # SASHINC 포함\n            c[\"laytime_terms\"] = \"SHINC\"\n        if \"T/TIME\" in fmt:\n            c[\"commence_if_sooner\"] = \"EIU\" not in fmt.split(\"T/TIME\", 1)[1]\n        turn = _num(val(r, \"T\"))\n        if turn is not None:\n            c[\"notice_hours\"] = turn\n            found.append(\"Turn time\")\n        found.append(\"Laytime 기준\")\n    if (r := row(\"DEM / DES RATE\")) and _num(val(r)):\n        c[\"demurrage_rate\"] = _num(val(r))\n        des = val(r, \"Q\")\n        m = re.fullmatch(r\"=\\+?L\\d+\\s*([/*])\\s*([\\d.]+)\", str(des or \"\").replace(\" \", \"\"))\n        if m:\n            c[\"despatch_mode\"] = \"RATIO\"\n            c[\"despatch_ratio\"] = 1 / float(m.group(2)) if m.group(1) == \"/\" else float(m.group(2))\n        elif _num(des):\n            c[\"despatch_mode\"], c[\"despatch_rate\"] = \"AMOUNT\", _num(des)\n        found.append(\"체선·조출 요율\")\n    # 항 구분: 파일명(선적항/양하항) → 항구 탭(B13)이 양하항 이름으로 시작하면 양하항\n    name = filename or \"\"\n    tab = str(ws[\"B13\"].value or \"\").strip().upper()\n    if \"양하\" in name or (tab and str(c.get(\"disch_port\", \"\")).upper().startswith(tab)):\n        c[\"port_type\"] = \"DISCH\"\n    elif \"선적\" in name or (tab and str(c.get(\"load_port\", \"\")).upper().startswith(tab)):\n        c[\"port_type\"] = \"LOAD\"\n    settle = c.get(\"disch_port\") if c.get(\"port_type\") == \"DISCH\" else c.get(\"load_port\")\n    if settle and str(settle).upper() in PORT_COUNTRY:\n        c[\"country\"] = PORT_COUNTRY[str(settle).upper()]\n    return c, found\n", "export/ltc.py": "\"\"\"회사 Laytime Statement (LTC) 양식 — `정산 예시/1. PAN DELIGHT 064R - 양하항 LTC.xlsx` 기준.\n\n원본 양식의 틀을 그대로 따른다.\n- 머리글: NAME OF VESSEL / PORT OF LOADING / PORT OF DISCHARGING / CARGO QTTY AS PER B/L / LOAD/DISCH TERMS /\n  LAYTIME ALLOWED (=B/L ÷ 하역률) / DEM / DES RATE\n- Time Sheet: 날짜별 행(자정 분할) · DATE · DAY · FROM - TO · REMARKS · COUNT PRO RATA · NOT TO COUNT · LAYTIME USED (DD-HH-MM)\n- TOTAL / TOTAL (PER DAILY) · LAYTIME ALLOWED / USED / LOST·SAVED · DEMURRAGE DUE TO OWNERS / DESPATCH DUE TO CHRTS\n- 인쇄 영역 밖(V열~) 검토용: 1. 오류 검증 · 2. 정보 · 3. On dem 시간 · 4. No count 적용 · 5. 필수 Remark · 시스템 검증\n\n원본 대비 개선 (값이 달라지는 것은 없음):\n- 행별 ROUND(…,6) 를 쓰지 않는다 → 합계가 분 단위로 정확해 '+0.02' 같은 숨은 보정이 필요 없다.\n  상대측과의 초 단위 차이 등 수기 조정은 별도 행(조정액·사유)으로 보이게 남긴다.\n- COUNT PRO RATA = 반영률 (100% 반영, 0% 미반영, 50% 절반). NOT TO COUNT 는 (1−반영률), LAYTIME USED 는 반영률만큼.\n- 체선 진입 시점에서 행을 나눠 'VESSEL ON DEM' 을 표시한다 (원본 '필수 입력 Remark' 항목).\n- 시스템(엔진) 금액과 이 시트 수식 금액을 자동 대조한다. 가로 1페이지에 맞춰 인쇄 (원본은 LAYTIME USED 열이 2페이지로 넘어감).\n\"\"\"\nimport re\nfrom datetime import datetime, timedelta\nfrom decimal import Decimal\n\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\n\nfrom core.constants import INTERVAL_EVENTS\nfrom core.engine import STATUS_INFO, STATUS_REVIEW, STATUS_USER, excepted_periods\n\nARIAL = \"Arial\"\nF = Font(name=ARIAL, size=8.5)\nFB = Font(name=ARIAL, size=8.5, bold=True)\nF_RED = Font(name=ARIAL, size=8.5, color=\"FF0000\")\nF_TITLE = Font(name=ARIAL, size=15, bold=True)\nF_REV = Font(name=ARIAL, size=9)\nF_REV_B = Font(name=ARIAL, size=9, bold=True)\nF_CHECK = Font(name=ARIAL, size=18, color=\"FF0000\")\nTHICK = Side(style=\"thick\")\nTHIN = Side(style=\"thin\")\nGREEN = PatternFill(\"solid\", fgColor=\"92D050\")\nREVIEW_FILL = PatternFill(\"solid\", fgColor=\"FFE699\")\nUSER_FILL = PatternFill(\"solid\", fgColor=\"DDEBF7\")\nLEFT = Alignment(horizontal=\"left\", vertical=\"center\")\nRIGHT = Alignment(horizontal=\"right\", vertical=\"center\")\nCENTER = Alignment(horizontal=\"center\", vertical=\"center\")\n\nDUR = 'dd\"-\"hh\"-\"mm'  # 원본 dd/hh/mm (한국 로캘에서 00-05-00 으로 표시)\nDHM = '\"(\"dd\"d \"hh\"h \"mm\"m\"\")\"'  # 원본 Q38 형식 그대로\nDAYS6 = \"0.000000\"\n\n# 원본 열 너비 (A~U) + 검토 영역 (V~AD)\nWIDTHS = {\"A\": 3.0, \"B\": 10.6, \"C\": 4.6, \"D\": 3.1, \"E\": 2.0, \"F\": 3.1, \"G\": 2.0, \"H\": 3.1, \"I\": 2.0, \"J\": 3.1, \"K\": 4.7,\n          \"L\": 6.9, \"M\": 4.1, \"N\": 3.4, \"O\": 8.4, \"P\": 5.1, \"Q\": 14.9, \"R\": 6.0, \"S\": 8.4, \"T\": 11.6, \"U\": 2.0,\n          \"V\": 13.0, \"W\": 15.5, \"X\": 12.0, \"Y\": 15.0, \"Z\": 17.0, \"AA\": 9.0, \"AB\": 2.9, \"AC\": 28.0, \"AD\": 12.0}\n\nFIRST_ROW = 17\nPOINT_LABELS = {\"ARRIVAL\": \"ARRIVED\", \"NOR_TENDERED\": \"NOR TENDERED\", \"NOR_ACCEPTED\": \"NOR ACCEPTED\"}\nINTERVAL_LABELS = {\"SHIFTING\": \"SHIFTING\", \"WEATHER\": \"BAD WEATHER\", \"BREAKDOWN_SHIP\": \"VESSEL'S BREAKDOWN\",\n                   \"BREAKDOWN_SHORE\": \"SHORE BREAKDOWN\", \"STRIKE\": \"STRIKE\", \"STOPPAGE_OTHER\": \"STOPPAGE\"}\nDOW_EN = [\"MONDAY\", \"TUESDAY\", \"WEDNESDAY\", \"THURSDAY\", \"FRIDAY\", \"SATURDAY\", \"SUNDAY\"]\n\n\n# --- 행 모델 (화면·테스트에서도 사용) ---------------------------------------------------\n\ndef _hm(t: datetime) -> str:\n    return t.strftime(\"%H:%M\")\n\n\ndef _op(c: dict) -> str:\n    return \"LOADING\" if c[\"port_type\"] == \"LOAD\" else \"DISCH\"\n\n\ndef _interval_label(ev: dict, ops: tuple) -> str:\n    code = ev[\"event_type\"]\n    if code == \"DRAFT_SURVEY\":\n        ops_start, ops_end = ops\n        if ops_start and ev[\"start\"] < ops_start:\n            return \"INITIAL DRAFT SURVEY\"\n        if ops_end and ev[\"start\"] >= ops_end:\n            return \"FINAL DRAFT SURVEY\"\n        return \"DRAFT SURVEY\"\n    if code == \"STOPPAGE_OTHER\" and ev.get(\"description\"):\n        return re.sub(r\"\\s+\", \" \", ev[\"description\"]).strip().upper()[:40]\n    return INTERVAL_LABELS.get(code, code)\n\n\ndef _span(ev: dict) -> str:\n    s, e = ev[\"start\"], ev[\"end\"]\n    if s.date() == e.date() or (e - s <= timedelta(days=1) and e.time() == datetime.min.time()):\n        return f\"{_hm(s)}~{'24:00' if e.time() == datetime.min.time() and e.date() > s.date() else _hm(e)}\"\n    return f\"{s:%m/%d} {_hm(s)}~{e:%m/%d} {_hm(e)}\"\n\n\ndef ltc_lines(c: dict, r: dict, events: list[dict]) -> list[dict]:\n    \"\"\"엔진 결과 → 회사 LTC 양식의 행 목록.\n\n    각 행: {date, start, end, point, remark, pct(0~1 Decimal|None), status, info}\n    - point: 시각만 있는 행 (원본 첫 줄 'ARRIVED/NOR TENDERED/ACCEPTED')\n    - info: Laytime 개시 전 (TURN TIME) — 반영률·시간 칸 비움\n    \"\"\"\n    rows = r[\"rows\"]\n    if not rows:\n        return []\n    commence, expiry = r[\"commence\"], r[\"expiry\"]\n    ops_start = next((e[\"start\"] for e in events if e[\"event_type\"] == \"COMMENCED\"), None)\n    ops_end = next((e[\"start\"] for e in reversed(events) if e[\"event_type\"] == \"COMPLETED\"), None)\n    intervals = [e for e in events if e[\"event_type\"] in INTERVAL_EVENTS and e.get(\"end\") and e[\"start\"] and e[\"end\"] > e[\"start\"]]\n    first = rows[0][\"from\"]\n    lines: list[dict] = []\n\n    # 1) 개시 전 시점 행: 도착·NOR (같은 시각은 한 줄로)\n    groups: dict[datetime, list[str]] = {}\n    for e in events:\n        if e[\"event_type\"] in POINT_LABELS and e[\"start\"] and e[\"start\"] <= first:\n            groups.setdefault(e[\"start\"], []).append(e[\"event_type\"])\n    for t in sorted(groups):\n        codes = groups[t]\n        if \"NOR_TENDERED\" in codes and \"NOR_ACCEPTED\" in codes:\n            parts = ([\"ARRIVED\"] if \"ARRIVAL\" in codes else []) + [\"NOR TENDERED\", \"ACCEPTED\"]\n        else:\n            parts = [POINT_LABELS[x] for x in (\"ARRIVAL\", \"NOR_TENDERED\", \"NOR_ACCEPTED\") if x in codes]\n        lines.append({\"start\": None, \"end\": t, \"point\": True, \"remark\": \"/\".join(parts), \"pct\": None,\n                      \"status\": STATUS_INFO, \"info\": True})\n\n    # 2) 엔진 구간을 자정에서 분할\n    pieces = []\n    for row in rows:\n        s = row[\"from\"]\n        while s < row[\"to\"]:\n            midnight = datetime.combine(s.date() + timedelta(days=1), datetime.min.time())\n            e = min(row[\"to\"], midnight)\n            pieces.append((s, e, row))\n            s = e\n\n    def active(s, e):\n        return tuple(i for i, iv in enumerate(intervals) if iv[\"start\"] <= s and iv[\"end\"] >= e)\n\n    # 3) 같은 날·같은 반영률·같은 예외 구간이면 한 줄로 (원본처럼 하루 한 줄, 바뀔 때만 분할)\n    merged = []\n    for s, e, row in pieces:\n        info = row[\"status\"] == STATUS_INFO\n        key = (info, row[\"pct\"], row[\"status\"], bool(row.get(\"on_demurrage\")), active(s, e))\n        prev = merged[-1] if merged else None\n        if (prev and prev[\"e\"] == s and prev[\"key\"] == key and prev[\"s\"].date() == s.date()\n                and s not in (commence, expiry) and row[\"status\"] not in (STATUS_REVIEW, STATUS_USER)):\n            prev[\"e\"] = e\n            continue\n        merged.append({\"s\": s, \"e\": e, \"key\": key, \"row\": row})\n\n    periods = excepted_periods(c, commence, r[\"end\"]) if r[\"end\"] > commence else []\n    points = [e for e in events if e[\"event_type\"] in (\"COMMENCED\", \"COMPLETED\", \"ALL_FAST\", \"DOCS_ON_BOARD\") and e[\"start\"]]\n    point_label = {\"COMMENCED\": f\"COMMENCED {_op(c)}\", \"COMPLETED\": f\"COMPLETED {_op(c)}\", \"ALL_FAST\": \"ALL FAST\",\n                   \"DOCS_ON_BOARD\": \"DOCS ON BOARD\"}\n\n    for k, m in enumerate(merged):\n        s, e, row = m[\"s\"], m[\"e\"], m[\"row\"]\n        info, pct = row[\"status\"] == STATUS_INFO, Decimal(row[\"pct\"]) / 100\n        tags = []\n        if s == commence and not info:\n            tags.append(\"LAYTIME COMMENCED\")\n        if expiry is not None and s == expiry and not info:\n            tags.append(\"VESSEL ON DEM\")\n        for i in m[\"key\"][4]:\n            iv = intervals[i]\n            tags.append(f\"{_interval_label(iv, (ops_start, ops_end))}({_span(iv)})\")\n        if not info and pct < 1 and not m[\"key\"][4]:\n            for ps, pe, plabel in periods:\n                if ps <= s and pe >= e:\n                    tags.append(f\"HOLIDAY({plabel[3:-1]})\" if plabel.startswith(\"휴일\") else DOW_EN[s.weekday()])\n                    break\n        last = k == len(merged) - 1\n        for p in points:\n            t = p[\"start\"]\n            if s <= t < e or (last and t == e):\n                tags.append(point_label[p[\"event_type\"]] + (\"\" if t == s else f\"({_hm(t)})\"))\n        if row.get(\"on_demurrage\") and m[\"key\"][4] and pct == 1:\n            tags.append(\"OODAOD\")\n        if info:\n            base = \"TURN TIME\" if s >= r.get(\"eff_nor\", r[\"nor\"]) else \"NOT COUNT\"\n        else:\n            base = \"COUNT\" if pct == 1 else \"NOT COUNT\" if pct == 0 else f\"COUNT {pct * 100:g}%\"\n        remark = base + (\"/\" + \"/\".join(dict.fromkeys(tags)) if tags else \"\")\n        if row[\"status\"] == STATUS_REVIEW:\n            remark += \"  ※검토 필요\"\n        elif row[\"status\"] == STATUS_USER:\n            reason = row[\"remarks\"].split(\"사용자 판단\", 1)[-1].strip(\" :\")\n            remark += f\"  ※사용자 판단 {reason}\".rstrip()\n        lines.append({\"start\": s, \"end\": e, \"point\": False, \"remark\": remark, \"pct\": None if info else pct,\n                      \"status\": row[\"status\"], \"info\": info})\n\n    # 날짜는 그날 첫 줄에만 (원본과 같음)\n    seen = set()\n    for ln in lines:\n        d = (ln[\"start\"] or ln[\"end\"]).date()\n        ln[\"date\"] = None if d in seen else d\n        seen.add(d)\n    return lines\n\n\n# --- 시트 작성 ------------------------------------------------------------------------\n\ndef _set(ws, ref, value=None, font=F, fmt=None, align=None, fill=None):\n    cell = ws[ref]\n    if value is not None:\n        cell.value = value\n    cell.font = font\n    if fmt:\n        cell.number_format = fmt\n    if align:\n        cell.alignment = align\n    if fill:\n        cell.fill = fill\n    return cell\n\n\ndef _border(ws, ref, **sides):\n    cell = ws[ref]\n    b = cell.border\n    cell.border = Border(left=sides.get(\"left\", b.left), right=sides.get(\"right\", b.right),\n                         top=sides.get(\"top\", b.top), bottom=sides.get(\"bottom\", b.bottom))\n\n\ndef _hline(ws, row, c1, c2, side, where=\"bottom\"):\n    for col in range(c1, c2 + 1):\n        _border(ws, f\"{_col(col)}{row}\", **{where: side})\n\n\ndef _col(i: int) -> str:\n    from openpyxl.utils import get_column_letter\n    return get_column_letter(i)\n\n\ndef _parties(c: dict) -> tuple[str, str]:\n    if c[\"basis\"] == \"SPA\":\n        return \" DEMURRAGE DUE TO SELLERS\", \" DESPATCH DUE TO BUYERS\"\n    return \" DEMURRAGE DUE TO OWNERS\", \" DESPATCH DUE TO CHRTS\"\n\n\ndef sheet_title(c: dict) -> str:\n    v = re.sub(r\"[\\[\\]:*?/\\\\]\", \"\", (c.get(\"voyage\") or \"\").strip())\n    return f\"V-{v}\"[:31] if v else \"LTC\"\n\n\ndef write_ltc(ws, c: dict, r: dict, events: list[dict], adjustment: dict | None = None) -> dict:\n    \"\"\"회사 LTC 양식 시트를 채운다. 반환: 주요 셀 위치 (테스트·검증용).\"\"\"\n    ws.title = sheet_title(c)\n    ws.sheet_view.showGridLines = False\n    for k, w in WIDTHS.items():\n        ws.column_dimensions[k].width = w\n    load = c[\"port_type\"] == \"LOAD\"\n    port, other = (c.get(\"port\") or \"\").upper(), (c.get(\"other_port\") or \"\").upper()\n\n    # 제목\n    ws.merge_cells(\"B3:T3\")\n    _set(ws, \"B3\", \"L A Y T I M E    S T A T E M E N T\", F_TITLE, align=CENTER)\n    ws.row_dimensions[3].height = 22\n\n    # 머리글 (원본 5~11행)\n    vessel = \" \".join(x for x in ((c.get(\"vessel\") or \"\").upper(), (c.get(\"voyage\") or \"\").upper()) if x)\n    labels = [\" NAME OF VESSEL\", \" PORT OF LOADING\", \" PORT OF DISCHARGING\", \" CARGO QTTY AS PER B/L\",\n              \" LOAD/DISCH TERMS\", \" LAYTIME ALLOWED\", \" DEM / DES RATE\"]\n    for i, lab in enumerate(labels):\n        row = 5 + i\n        _set(ws, f\"B{row}\", lab, FB, align=LEFT)\n        _set(ws, f\"J{row}\", \":\", FB, align=CENTER)\n    _set(ws, \"L5\", vessel, FB, align=LEFT)\n    _set(ws, \"L6\", port if load else other, FB, align=LEFT)\n    _set(ws, \"L7\", other if load else port, FB, align=LEFT)\n    for row in (8, 9, 10, 11):\n        ws.merge_cells(f\"L{row}:O{row}\")\n    qty = float(c[\"cargo_qty\"] or 0)\n    _set(ws, \"L8\", qty, FB, \"#,##0\" if qty == int(qty) else \"#,##0.000\", RIGHT)\n    _set(ws, \"P8\", \"MT \", FB, align=LEFT)\n    _set(ws, \"Q8\", (c.get(\"cargo_name\") or \"\").upper(), FB, align=LEFT)\n    terms = c[\"laytime_terms\"] + (f\" {c['excepted_used']}\" if c[\"laytime_terms\"] != \"SHINC\" else \"\")\n    tt = \"UU\" if c.get(\"commence_if_sooner\") else \"EIU\"\n    notice = float(c.get(\"notice_hours\") or 0)\n    ws.merge_cells(\"P10:S10\")\n    if c[\"laytime_mode\"] == \"FIXED\":\n        hours = float(c[\"fixed_laytime_hours\"] or 0)\n        _set(ws, \"L9\", None, FB)\n        _set(ws, \"P9\", f\"FIXED {hours:g} HRS\", FB, align=LEFT)\n        _set(ws, \"L10\", f\"={hours}/24\", FB, DAYS6, RIGHT)\n    else:\n        _set(ws, \"L9\", float(c[\"rate_mt_day\"] or 0), FB, \"#,##0\", RIGHT)\n        _set(ws, \"P9\", \"MT / DAY\", FB, align=LEFT)\n        rounding = c.get(\"allowed_rounding\", \"ROUND\")\n        fn = {\"ROUND\": \"ROUND\", \"DOWN\": \"ROUNDDOWN\", \"UP\": \"ROUNDUP\"}.get(rounding)\n        _set(ws, \"L10\", f\"={fn}(L8/L9*1440,0)/1440\" if fn else \"=L8/L9\", FB, DAYS6, RIGHT)\n    _set(ws, \"T9\", \"TURN TIME\", FB, align=CENTER)\n    _set(ws, \"T10\", notice, FB, \"General\", CENTER)\n    _set(ws, \"P10\", \"=T10\", FB, f'\"DAYS {terms} + \"{\"0\" if notice == int(notice) else \"0.0\"}\" HRS T/TIME {tt}\"', LEFT)\n    dem = float(c[\"demurrage_rate\"] or 0)\n    money = \"$#,##0\" if dem == int(dem) else \"$#,##0.00\"\n    _set(ws, \"L11\", dem, FB, money, RIGHT)\n    _set(ws, \"P11\", \"/\", FB, align=CENTER)\n    ws.merge_cells(\"Q11:R11\")\n    if c.get(\"despatch_mode\", \"RATIO\") == \"RATIO\":\n        _set(ws, \"Q11\", f\"=L11*{float(c['despatch_ratio'] or 0)}\", FB, money, LEFT)\n    else:\n        _set(ws, \"Q11\", float(c[\"despatch_rate\"] or 0), FB, money, LEFT)\n    _hline(ws, 4, 2, 20, THIN)\n    _hline(ws, 11, 2, 20, THIN)\n\n    # 항구명 탭 + 표 머리 (원본 13~16행)\n    _set(ws, \"B13\", port, F, align=LEFT)\n    _hline(ws, 12, 2, 10, THIN)\n    for ref, text in ((\"B15\", \"DATE\"), (\"C15\", \"DAY\"), (\"D15\", \"FROM\"), (\"G15\", \"-\"), (\"H15\", \"TO\"),\n                      (\"S14\", \"NOT TO\"), (\"S15\", \"COUNT\"), (\"S16\", \"DD-HH-MM\"), (\"T14\", \"LAYTIME\"), (\"T15\", \"USED\"),\n                      (\"T16\", \"DD-HH-MM\")):\n        _set(ws, ref, text, F, align=CENTER)\n    ws.merge_cells(\"D15:F15\")\n    ws.merge_cells(\"H15:J15\")\n    ws.merge_cells(\"K15:Q15\")\n    _set(ws, \"K15\", \"R E M A R K S\", F, align=CENTER)\n    ws.merge_cells(\"R14:R16\")\n    _set(ws, \"R14\", \"COUNT\\nPRO\\nRATA\", F, align=Alignment(horizontal=\"center\", vertical=\"center\", wrap_text=True))\n    _hline(ws, 13, 2, 20, THIN)\n    _hline(ws, 16, 2, 20, THIN)\n\n    # Time Sheet\n    lines = ltc_lines(c, r, events)\n    row = FIRST_ROW\n    for ln in lines:\n        n = row\n        if ln[\"date\"]:\n            _set(ws, f\"B{n}\", datetime.combine(ln[\"date\"], datetime.min.time()), F, \"yyyy-mm-dd\", CENTER)\n            _set(ws, f\"C{n}\", f'=TEXT(B{n},\"ddd\")', F, align=CENTER)\n        end = ln[\"end\"]\n        eh, em = (24, 0) if (ln[\"start\"] and end.date() > ln[\"start\"].date()) else (end.hour, end.minute)\n        if not ln[\"point\"]:\n            s = ln[\"start\"]\n            _set(ws, f\"D{n}\", s.hour, F, \"00\", RIGHT)\n            _set(ws, f\"E{n}\", \":\", F, align=CENTER)\n            _set(ws, f\"F{n}\", s.minute, F, \"00\", LEFT)\n            _set(ws, f\"G{n}\", \"-\", F, align=CENTER)\n        _set(ws, f\"H{n}\", eh, F, \"00\", RIGHT)\n        _set(ws, f\"I{n}\", \":\", F, align=CENTER)\n        _set(ws, f\"J{n}\", em, F, \"00\", LEFT)\n        ws.merge_cells(f\"K{n}:Q{n}\")\n        fill = REVIEW_FILL if ln[\"status\"] == STATUS_REVIEW else USER_FILL if ln[\"status\"] == STATUS_USER else None\n        pct = ln[\"pct\"]\n        _set(ws, f\"K{n}\", \"  \" + ln[\"remark\"], F_RED if pct is not None and pct == 0 else F, align=LEFT, fill=fill)\n        if pct is not None:\n            _set(ws, f\"R{n}\", float(pct), F, \"0%\" if pct * 100 == int(pct * 100) else \"0.##%\", CENTER, fill)\n            dur = f\"(((J{n}/60)+H{n})/24-((F{n}/60)+D{n})/24)\"\n            if pct < 1:\n                _set(ws, f\"S{n}\", f\"={dur}*(1-R{n})\", F_RED, DUR, CENTER, fill)\n            if pct > 0:\n                _set(ws, f\"T{n}\", f\"={dur}*R{n}\", F, DUR, CENTER, fill)\n        ws.row_dimensions[n].height = 15\n        row += 1\n    last_line = max(row - 1, FIRST_ROW)\n    row = last_line + 3  # 원본처럼 빈 줄 2개\n\n    total, daily = row, row + 1\n    _set(ws, f\"B{total}\", \"     TOTAL\", F, align=LEFT)\n    _set(ws, f\"S{total}\", f\"=SUM(S{FIRST_ROW}:S{total - 1})\", F_RED, DUR, CENTER)\n    _set(ws, f\"T{total}\", f\"=SUM(T{FIRST_ROW}:T{total - 1})\", F, DUR, CENTER)\n    _set(ws, f\"B{daily}\", \"     TOTAL (PER DAILY)\", F, align=LEFT)\n    _set(ws, f\"S{daily}\", f\"=+S{total}\", F_RED, DAYS6, CENTER)\n    _set(ws, f\"T{daily}\", f\"=+T{total}\", F, DAYS6, CENTER)\n    for rr in (total, daily):\n        _hline(ws, rr, 2, 20, THIN, \"top\")\n    _hline(ws, daily, 2, 20, THIN)\n    # 표 세로선 (원본: DATE | DAY | FROM-TO | REMARKS | COUNT | NOT TO COUNT | USED)\n    for rr in range(14, daily + 1):\n        for col in (2, 3, 10, 17, 18, 19):\n            if rr >= 15 or col in (18, 19):  # 14행은 COUNT·NOT TO COUNT 칸만 머리글 시작\n                _border(ws, f\"{_col(col)}{rr}\", right=THIN)\n\n    # 요약 박스 (원본 38~41행)\n    a, u, d, f = daily + 2, daily + 3, daily + 4, daily + 5\n    ats = r[\"kind\"] == \"DESPATCH\" and c.get(\"despatch_basis\") == \"ATS\"\n    dem_label, des_label = _parties(c)\n    rows_sum = [(a, \" LAYTIME ALLOWED\", \"=+L10\"), (u, \" LAYTIME USED\", f\"=+T{daily}\")]\n    for rr, label, formula in rows_sum:\n        _set(ws, f\"F{rr}\", label, F, align=LEFT)\n        ws.merge_cells(f\"M{rr}:O{rr}\")\n        _set(ws, f\"M{rr}\", formula, F, DAYS6, RIGHT)\n        _set(ws, f\"P{rr}\", \"DAYS\", F, align=CENTER)\n        ws.merge_cells(f\"Q{rr}:R{rr}\")\n        _set(ws, f\"Q{rr}\", f\"=+M{rr}\", F, DHM, CENTER)\n    if ats:\n        _set(ws, f\"F{d}\", \" LAYTIME SAVED (ALL TIME SAVED)\", F, align=LEFT)\n        diff_formula = float(Decimal(r[\"diff\"]) / Decimal(1440))\n    else:\n        _set(ws, f\"F{d}\", f'=IF(M{u}>M{a},\" LAYTIME LOST\",\" LAYTIME SAVED\")', F, align=LEFT)\n        diff_formula = f\"=IF(M{a}<M{u},M{u}-M{a},M{a}-M{u})\"\n    ws.merge_cells(f\"M{d}:O{d}\")\n    _set(ws, f\"M{d}\", diff_formula, F, DAYS6, RIGHT)\n    _set(ws, f\"P{d}\", \"DAYS\", F, align=CENTER)\n    ws.merge_cells(f\"Q{d}:R{d}\")\n    _set(ws, f\"Q{d}\", f\"=+M{d}\", F, DHM, CENTER)\n\n    amount_formula = f\"ROUND(IF(M{u}>M{a},L11*M{d},Q11*M{d}),2)\"\n    adj = Decimal(str((adjustment or {}).get(\"usd\") or 0))\n    calc_row = f\n    if adj:\n        _set(ws, f\"F{f}\", \"  CALCULATED AMOUNT\", F, align=LEFT)\n        ws.merge_cells(f\"M{f}:O{f}\")\n        _set(ws, f\"M{f}\", f\"={amount_formula}\", F, \"#,##0.00\", RIGHT)\n        _set(ws, f\"P{f}\", \"(USD)\", F, align=CENTER)\n        reason = (adjustment or {}).get(\"reason\") or \"사유 미기재\"\n        _set(ws, f\"F{f + 1}\", f\"  ADJUSTMENT ({reason})\"[:60], F, align=LEFT)\n        ws.merge_cells(f\"M{f + 1}:O{f + 1}\")\n        _set(ws, f\"M{f + 1}\", float(adj), F, \"+#,##0.00;-#,##0.00\", RIGHT)\n        _set(ws, f\"P{f + 1}\", \"(USD)\", F, align=CENTER)\n        f += 2\n        final_formula = f\"=M{calc_row}+M{calc_row + 1}\"\n    else:\n        final_formula = f\"={amount_formula}\"\n    for col in range(6, 19):\n        ws.cell(row=f, column=col).fill = GREEN\n    _set(ws, f\"F{f}\", f'=IF(M{u}>M{a},\"{dem_label}\",\"{des_label}\")', FB, align=LEFT, fill=GREEN)\n    ws.merge_cells(f\"M{f}:O{f}\")\n    _set(ws, f\"M{f}\", final_formula, FB, \"#,##0.00\", RIGHT, GREEN)\n    _set(ws, f\"P{f}\", \"(USD)\", FB, align=CENTER, fill=GREEN)\n    for rr in range(a, f + 1):\n        _border(ws, f\"F{rr}\", left=THIN)\n        _border(ws, f\"L{rr}\", right=THIN)\n        _border(ws, f\"R{rr}\", right=THIN)\n    _hline(ws, a, 6, 18, THIN, \"top\")\n    _hline(ws, f, 6, 18, THIN, \"top\")\n    _hline(ws, f, 6, 18, THIN)\n\n    # 바깥 굵은 테두리 (B2:T{f})\n    last = f + 1\n    _hline(ws, 2, 2, 20, THICK)\n    _hline(ws, last, 2, 20, THICK)\n    for rr in range(3, last + 1):\n        _border(ws, f\"B{rr}\", left=THICK)\n        _border(ws, f\"T{rr}\", right=THICK)\n\n    _review_block(ws, c, r, lines, {\"a\": a, \"u\": u, \"d\": d, \"final\": f, \"calc\": calc_row, \"daily\": daily})\n\n    # 인쇄: A4 세로, 가로 1페이지\n    ws.print_area = f\"A1:U{last + 1}\"\n    ws.page_setup.paperSize = 9\n    ws.page_setup.orientation = \"portrait\"\n    ws.sheet_properties.pageSetUpPr.fitToPage = True\n    ws.page_setup.fitToWidth = 1\n    ws.page_setup.fitToHeight = 0\n    ws.print_options.horizontalCentered = True\n    ws.page_margins.left = ws.page_margins.right = 0.5\n    return {\"first\": FIRST_ROW, \"last_line\": last_line, \"total\": total, \"daily\": daily, \"allowed\": a, \"used\": u,\n            \"diff\": d, \"final\": f, \"calc\": calc_row, \"lines\": lines}\n\n\ndef _review_block(ws, c, r, lines, at):\n    \"\"\"인쇄 영역 밖 검토 영역 — 원본 V~AD 열 구성.\"\"\"\n    box = Border(left=THIN, right=THIN, top=THIN, bottom=THIN)\n\n    def put(ref, value, font=F_REV, fmt=None, boxed=False, align=None):\n        cell = _set(ws, ref, value, font, fmt, align or Alignment(vertical=\"center\"))\n        if boxed:\n            cell.border = box\n        return cell\n\n    dtf = \"yyyy-mm-dd hh:mm\"\n    a, u, daily, calc = at[\"a\"], at[\"u\"], at[\"daily\"], at[\"calc\"]\n    put(\"V2\", \"1. 오류 검증\", F_REV_B)\n    checks = [\n        (\"laytime 시작\", r[\"commence\"], dtf),\n        (\"하역종료\", r[\"end\"], dtf),\n        (\"No count\", f\"=S{daily}\", \"#,##0.000000\"),\n        (\"차이\", \"=W4-W3-W5\", \"#,##0.000000\"),\n        (\"Laytime allowed\", \"=L10\", \"#,##0.000000\"),\n        (\"체선일수\", \"=ROUND(W6-W7,6)\", \"#,##0.000000;[Red]-#,##0.000000\"),\n        (\"On Dem\", r[\"expiry\"], dtf),\n        (\"계산\", f\"=M{u}-M{a}\", \"#,##0.000000;[Red]-#,##0.000000\"),\n    ]\n    for i, (label, value, fmt) in enumerate(checks):\n        put(f\"V{3 + i}\", label)\n        put(f\"W{3 + i}\", value if value is not None else \"-\", fmt=fmt, boxed=True, align=CENTER)\n    put(\"V12\", \"검증\")\n    put(\"W12\", '=IF(ROUND(W8,4)<>ROUND(W10,4),\"오류\",\"OK\")', F_CHECK, boxed=True, align=CENTER)\n    put(\"V13\", \"체선료\" if r[\"kind\"] == \"DEMURRAGE\" else \"조출료\")\n    put(\"W13\", f\"=M{calc}\", fmt=\"#,##0.00\", boxed=True, align=CENTER)\n    put(\"V14\", \"소수점 차이\")\n    put(\"W14\", \"=W8-W10\", fmt=\"0.00000000\", boxed=True, align=CENTER)\n    put(\"X3\", \"※ 차이 = 하역종료 − 개시 − No count (= LAYTIME USED). On Dem 은 엔진 계산 체선 진입 시점\", Font(name=ARIAL, size=8, color=\"808080\"))\n\n    put(\"Y2\", \"2. 정보\", F_REV_B)\n    put(\"Y3\", \"Laycan:\")\n    put(\"Z3\", f\"{c.get('laycan_start') or ''} ~ {c.get('laycan_end') or ''}\")\n\n    put(\"Y5\", \"3. On dem 시간 적용\", F_REV_B)\n    for i, (value, label) in enumerate(((r[\"nor\"], \"Nor tender\"), (r[\"commence\"], \"Laytime commenced\"), (r[\"expiry\"], \"On Dem\"))):\n        put(f\"Y{6 + i}\", value if value is not None else \"-\", fmt=dtf, boxed=True, align=CENTER)\n        put(f\"Z{6 + i}\", label)\n\n    put(\"Y11\", \"4. No count 적용\", F_REV_B)\n    put(\"AA11\", \"적용여부\", boxed=True, align=CENTER)\n    put(\"Y12\", \"No count 항목\", boxed=True)\n    names = {\"shifting\": \"Shifting\", \"draft_survey\": \"Draft survey\", \"weather\": \"Bad weather\", \"breakdown_ship\": \"Vessel's breakdown\",\n             \"breakdown_shore\": \"Shore breakdown\", \"strike\": \"Strike\"}\n    items = [(names[k], \"O\" if rule.get(\"applies\") else \"X\") for k, rule in c[\"exceptions\"].items()]\n    items.append((\"Weekend / Holiday\", \"X\" if c[\"laytime_terms\"] == \"SHINC\" else f\"O ({c['laytime_terms']})\"))\n    for i, (name, flag) in enumerate(items):\n        put(f\"Z{12 + i}\", f\"{i + 1}. {name}\", boxed=True)\n        put(f\"AA{12 + i}\", flag, boxed=True, align=CENTER)\n\n    put(\"AC2\", \"5. 필수 입력 Remark\", F_REV_B)\n    put(\"AD2\", \"확인\", boxed=True, align=CENTER)\n    text = \" \".join(ln[\"remark\"] for ln in lines)\n    required = [\"LAYTIME COMMENCED\"]\n    if r[\"kind\"] == \"DEMURRAGE\" and r[\"expiry\"] is not None:\n        required.append(\"VESSEL ON DEM\")\n    if \"SHIFTING(\" in text or any(ln[\"remark\"] and \"SHIFTING\" in ln[\"remark\"] for ln in lines):\n        required.append(\"SHIFTING\")\n    if \"INITIAL DRAFT SURVEY\" in text:\n        required.append(\"INITIAL DRAFT SURVEY\")\n    required += [f\"COMMENCED {_op(c)}\", f\"COMPLETED {_op(c)}\"]\n    for i, phrase in enumerate(required):\n        put(f\"AC{3 + i}\", phrase, boxed=True)\n        put(f\"AD{3 + i}\", \"O\" if phrase in text else \"누락\", F_REV if phrase in text else Font(name=ARIAL, size=9, color=\"FF0000\"),\n            boxed=True, align=CENTER)\n\n    final = at[\"final\"]\n    put(f\"V{final - 1}\", \"5. 시스템 검증\", F_REV_B)\n    put(f\"V{final}\", float(r[\"amount\"]), fmt=\"#,##0.00\", boxed=True, align=CENTER)\n    put(f\"W{final}\", f'=IF(ROUND(M{calc},2)=ROUND(V{final},2),\"OK\",\"차이 \"&TEXT(M{calc}-V{final},\"0.00\"))',\n        F_REV_B, boxed=True, align=CENTER)\n    put(f\"X{final}\", \"← 엔진 계산 금액 (조정 전) vs 이 시트 수식\", Font(name=ARIAL, size=8, color=\"808080\"))\n\n    if c[\"port_type\"] == \"LOAD\" and (c.get(\"country\") or \"\").upper() == \"BR\":\n        put(\"AC12\", \"6. 브라질 선적율 (해당 시)\", F_REV_B)\n        for i, (label, formula, fmt) in enumerate(((\"L/T allowed\", \"=(40+((L8-120000)/5000))/24\", \"#,##0.000000\"),\n                                                  (\"선적률\", \"=L8/AD13\", \"#,##0.00\"),\n                                                  (\"체선요율\", \"=50000*0.11+70000*0.07+(L8-120000)*0.05\", \"#,##0.00\"))):\n            put(f\"AC{13 + i}\", label, boxed=True)\n            put(f\"AD{13 + i}\", formula, fmt=fmt, boxed=True, align=CENTER)\n", "export/report.py": "\"\"\"결과 표 데이터 (화면/Excel 공통).\"\"\"\nfrom core.constants import BASIS_LABELS, BERTH_TERMS, DESPATCH_BASIS, EXCEPTION_LABELS, LAYTIME_END_EVENTS, LAYTIME_TERMS, NOR_EARLY_MODES\nfrom core.timeutil import fmt_dt, fmt_hhmm, fmt_minutes\n\nKIND_LABEL = {\"DEMURRAGE\": \"Demurrage (체선료)\", \"DESPATCH\": \"Despatch (조출료)\", \"NIL\": \"해당 없음\"}\n\n\n# 상태를 맨 앞에 둔다 (좁은 화면에서도 가로 스크롤 없이 검토 필요 여부가 보이도록)\nTIMESHEET_COLUMNS = [\"상태\", \"From\", \"To\", \"경과시간\", \"반영률(%)\", \"반영시간\", \"누적 사용\", \"적용 조항\", \"비고\"]\n\n\ndef timesheet_rows(r: dict) -> list[list]:\n    out = []\n    for row in r[\"rows\"]:\n        out.append(\n            [\n                row[\"status\"],\n                fmt_dt(row[\"from\"]),\n                fmt_dt(row[\"to\"]),\n                fmt_hhmm(row[\"duration\"]),\n                f\"{row['pct']:g}\",\n                fmt_hhmm(row[\"counted\"]),\n                fmt_minutes(row[\"cumulative\"]) if row[\"cumulative\"] is not None else \"\",\n                row[\"clause\"],\n                (\"[DEMURRAGE] \" if row[\"on_demurrage\"] else \"\") + row[\"remarks\"],\n            ]\n        )\n    return out\n\n\ndef contract_rows(c: dict) -> list[tuple[str, str]]:\n    rows = [\n        (\"정산 기준\", BASIS_LABELS[c[\"basis\"]]),\n        (\"정산 대상\", c.get(\"counterparty\") or \"\"),\n        (\"항 구분\", c[\"port_type\"]),\n        (\"선박 / 항차\", \" \".join(x for x in (c.get(\"vessel\"), c.get(\"voyage\")) if x)),\n        (\"정산 항구 / 상대 항구\", f\"{c.get('port') or ''} / {c.get('other_port') or ''}\"),\n        (\"화물 / B/L 수량\", f\"{c.get('cargo_name') or ''} {float(c.get('cargo_qty') or 0):,.3f} MT\".strip()),\n        (\"Laytime 기준\", LAYTIME_TERMS[c[\"laytime_terms\"]] + (\"\" if c[\"laytime_terms\"] == \"SHINC\" else f\" / {c['excepted_used']}\")),\n        (\"Despatch 기준\", DESPATCH_BASIS[c[\"despatch_basis\"]]),\n        (\"Notice time (h)\", str(c[\"notice_hours\"])),\n        (\"Unless sooner commenced\", \"Yes\" if c[\"commence_if_sooner\"] else \"No\"),\n        (\"Laycan 이전 기산 허용\", \"Yes\" if c[\"nor_before_laycan_counts\"] else \"No\"),\n        (\"Laycan 이전 NOR 처리\", NOR_EARLY_MODES.get(c.get(\"nor_early_mode\"), \"\")),\n        (\"Berth 조건\", BERTH_TERMS[c[\"berth_terms\"]]),\n        (\"Laytime 종료\", LAYTIME_END_EVENTS[c[\"laytime_end_event\"]]),\n        (\"OODAOD\", \"Yes\" if c[\"oodaod\"] else \"No\"),\n        (\"NOR 조건\", c.get(\"nor_condition\") or \"\"),\n    ]\n    for k, rule in c[\"exceptions\"].items():\n        txt = f\"제외 (반영 {rule['counted_pct']:g}%) {rule.get('clause') or ''}\" if rule[\"applies\"] else \"예외 아님 (계속 반영)\"\n        rows.append((f\"예외: {EXCEPTION_LABELS[k]}\", txt))\n    if c.get(\"holidays\"):\n        rows.append((\"적용 휴일\", \", \".join(f\"{h['date']} {h.get('name', '')}\" for h in c[\"holidays\"])))\n    return rows\n"}, "streamlitConfig": {"theme.font": "sans-serif", "theme.light.primaryColor": "#1F3864", "theme.dark.primaryColor": "#7A9CD3", "client.toolbarMode": "viewer"}};
