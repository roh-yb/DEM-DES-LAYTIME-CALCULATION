:00\", None, \"NOR_ACCEPTED\", \"NOR accepted subject to all terms, conditions and exceptions of C/P\", \"\"),\n        (\"2026-10-01 10:00\", None, \"OTHER\", \"Vessel waiting at anchorage for berth (berth occupied / congestion)\", \"대기 01-Oct 10:00 ~ 03-Oct 10:00 (WIBON: Laytime 반영)\"),\n        (\"2026-10-01 14:00\", None, \"OTHER\", \"Inward customs clearance completed\", \"\"),\n        (\"2026-10-03 10:00\", None, \"PILOT_ON\", \"Pilot on board / Commenced heaving up anchor\", \"\"),\n        (\"2026-10-03 10:00\", \"2026-10-03 17:00\", \"SHIFTING\", \"Shifting anchorage to Raw Material Berth No.1\", \"Anchor aweigh 10:24, first line 16:30\"),\n        (\"2026-10-03 17:00\", None, \"ALL_FAST\", \"All fast alongside Raw Material Berth No.1 / Shifting completed\", \"\"),\n        (\"2026-10-03 17:00\", \"2026-10-03 18:00\", \"DRAFT_SURVEY\", \"Initial draft survey\", \"\"),\n        (\"2026-10-03 18:00\", None, \"COMMENCED\", \"Commenced discharging\", \"\"),\n        (\"2026-10-06 15:00\", None, \"COMPLETED\", \"Completed discharging\", \"175,000.000 MT\"),\n        (\"2026-10-06 15:00\", \"2026-10-06 16:00\", \"DRAFT_SURVEY\", \"Final draft survey\", \"\"),\n        (\"2026-10-06 17:30\", None, \"DOCS_ON_BOARD\", \"Cargo documents on board\", \"\"),\n        (\"2026-10-06 18:30\", None, \"OTHER\", \"Pilot on board\", \"\"),\n        (\"2026-10-06 19:00\", None, \"OTHER\", \"Last line let go / Vessel sailed\", \"\"),\n    ]\n    return [\n        {\"start\": _dt(s), \"end\": _dt(e) if e else None, \"event_type\": t, \"description\": d, \"remarks\": r}\n        for s, e, t, d, r in rows\n    ]\n\n\ndef _dt(s):\n    return datetime.strptime(s, \"%Y-%m-%d %H:%M\")\n\n\ndef sample_events() -> list[dict]:\n    rows = [\n        (\"2026-03-02 08:00\", None, \"ARRIVAL\", \"EOSP / Arrived Port Hedland anchorage\"),\n        (\"2026-03-02 08:00\", None, \"NOR_TENDERED\", \"NOR tendered\"),\n        (\"2026-03-02 09:00\", None, \"ANCHORED\", \"Dropped anchor\"),\n        (\"2026-03-03 10:00\", \"2026-03-03 11:30\", \"SHIFTING\", \"Anchor aweigh, shifting to berth\"),\n        (\"2026-03-03 11:30\", None, \"ALL_FAST\", \"All fast No.3 berth\"),\n        (\"2026-03-03 12:00\", \"2026-03-03 13:00\", \"DRAFT_SURVEY\", \"Initial draft survey\"),\n        (\"2026-03-03 13:30\", None, \"COMMENCED\", \"Commenced loading\"),\n        (\"2026-03-04 15:00\", \"2026-03-04 19:00\", \"WEATHER\", \"Rain stopped loading\"),\n        (\"2026-03-05 02:00\", \"2026-03-05 05:00\", \"BREAKDOWN_SHORE\", \"Shiploader breakdown\"),\n        (\"2026-03-07 16:00\", \"2026-03-07 17:00\", \"WEATHER\", \"Rain stopped loading\"),\n        (\"2026-03-07 20:00\", None, \"COMPLETED\", \"Completed loading\"),\n        (\"2026-03-07 21:00\", None, \"DOCS_ON_BOARD\", \"Documents on board\"),\n    ]\n    return [\n        {\"start\": _dt(s), \"end\": _dt(e) if e else None, \"event_type\": t, \"description\": d, \"remarks\": \"\"}\n        for s, e, t, d in rows\n    ]\n\n\nPAN_DELIGHT_NOTE = (\n    \"PAN DELIGHT 064R (양하항 당진, 실제 정산 건): 회사 LTC 엑셀에서 계약 조건·이벤트를 옮김 — 확정 금액 USD 121,880.67. \"\n    \"Laycan 은 원본에 없어 NOR 주변 날짜로 임시 입력했습니다.\"\n)\n\n\ndef pan_delight_contract() -> dict:\n    \"\"\"정산 예시/1. PAN DELIGHT 064R - 양하항 LTC.xlsx 의 계약 조건 (60,000 MT/day SASHINC + 24hrs T/TIME EIU).\"\"\"\n    return normalize_contract(\n        {\n            \"basis\": \"CP\",\n            \"port_type\": \"DISCH\",\n            \"vessel\": \"PAN DELIGHT\",\n            \"voyage\": \"064R\",\n            \"port\": \"PYEONGTAEK-DANGJIN, KOREA\",\n            \"other_port\": \"PORT HEDLAND, AUS\",\n            \"cargo_name\": \"IRON ORE\",\n            \"country\": \"KR\",\n            \"counterparty\": \"팬오션\",\n            \"laycan_start\": \"2026-09-01 00:00\",  # 원본 미기재 — 임시값\n            \"laycan_end\": \"2026-09-10 23:59\",\n            \"cargo_qty\": 181358.0,\n            \"laytime_mode\": \"RATE\",\n            \"rate_mt_day\": 60000.0,\n            \"allowed_rounding\": \"EXACT\",  # 원본: L10 = L8/L9 (반올림 없음)\n            \"laytime_terms\": \"SHINC\",\n            \"demurrage_rate\": 20000.0,\n            \"despatch_mode\": \"RATIO\",\n            \"despatch_ratio\": 0.5,\n            \"despatch_basis\": \"WTS\",\n            \"notice_hours\": 24.0,  # TURN TIME 24 HRS\n            \"commence_if_sooner\": False,  # T/TIME EIU\n            \"berth_terms\": \"WIBON\",\n            \"laytime_end_event\": \"COMPLETED\",\n            \"oodaod\": True,\n        }\n    )\n\n\ndef pan_delight_events() -> list[dict]:\n    \"\"\"LTC Time Sheet 에서 복원한 이벤트 (원본 SOF PDF 는 보안 레이블로 열 수 없음).\"\"\"\n    return [\n        {\"start\": _dt(\"2026-09-06 22:42\"), \"end\": None, \"event_type\": \"ARRIVAL\", \"description\": \"Arrived\", \"remarks\": \"\"},\n        {\"start\": _dt(\"2026-09-06 22:42\"), \"end\": None, \"event_type\": \"NOR_TENDERED\", \"description\": \"NOR tendered\", \"remarks\": \"\"},\n        {\"start\": _dt(\"2026-09-06 22:42\"), \"end\": None, \"event_type\": \"NOR_ACCEPTED\", \"description\": \"NOR accepted\", \"remarks\": \"\"},\n        {\"start\": _dt(\"2026-09-09 11:00\"), \"end\": _dt(\"2026-09-09 16:00\"), \"event_type\": \"SHIFTING\",\n         \"description\": \"Shifting (berthed at pier #5)\", \"remarks\": \"\"},\n        {\"start\": _dt(\"2026-09-09 17:00\"), \"end\": None, \"event_type\": \"COMMENCED\", \"description\": \"Commenced discharging\", \"remarks\": \"\"},\n        {\"start\": _dt(\"2026-09-17 06:30\"), \"end\": None, \"event_type\": \"COMPLETED\", \"description\": \"Completed discharging\", \"remarks\": \"\"},\n    ]\n", "core/timeutil.py": "from datetime import datetime, time\nfrom decimal import ROUND_HALF_UP, Decimal\n\nimport pandas as pd\n\nDT_FORMATS = (\n    \"%Y-%m-%d %H:%M\",\n    \"%Y-%m-%dT%H:%M\",\n    \"%Y-%m-%d %H:%M:%S\",\n    \"%Y-%m-%dT%H:%M:%S\",\n    \"%Y/%m/%d %H:%M\",\n    \"%Y.%m.%d %H:%M\",\n)\n\n\ndef parse_dt(value) -> datetime | None:\n    \"\"\"문자열/Timestamp/datetime → datetime(분 단위). 실패 시 None.\"\"\"\n    if value is None or value is pd.NaT:\n        return None\n    if isinstance(value, float) and value != value:\n        return None\n    if isinstance(value, pd.Timestamp):\n        value = value.to_pydatetime()\n    if isinstance(value, datetime):\n        return value.replace(second=0, microsecond=0, tzinfo=None)\n    s = str(value).strip()\n    if not s or s.lower() in (\"nat\", \"none\", \"null\"):\n        return None\n    for fmt in DT_FORMATS:\n        try:\n            return datetime.strptime(s, fmt)\n        except ValueError:\n            continue\n    try:\n        ts = pd.to_datetime(s)\n        return None if pd.isna(ts) else ts.to_pydatetime().replace(second=0, microsecond=0, tzinfo=None)\n    except Exception:\n        return None\n\n\ndef fmt_dt(dt: datetime | None) -> str:\n    if dt is None or dt is pd.NaT:\n        return \"\"\n    return dt.strftime(\"%Y-%m-%d %H:%M\")\n\n\ndef parse_hm(s) -> time:\n    if isinstance(s, time):\n        return s\n    h, m = str(s).split(\":\")[:2]\n    return time(int(h), int(m))\n\n\ndef fmt_hm(t: time) -> str:\n    return f\"{t.hour:02d}:{t.minute:02d}\"\n\n\ndef fmt_minutes(minutes) -> str:\n    \"\"\"분 → 'D일 HH:MM' (소수 분이 있으면 초까지 표시).\"\"\"\n    m = Decimal(str(minutes))\n    sign = \"-\" if m < 0 else \"\"\n    m = abs(m)\n    total_sec = int((m * 60).quantize(Decimal(1), ROUND_HALF_UP))\n    d, rem = divmod(total_sec, 86400)\n    h, rem = divmod(rem, 3600)\n    mi, sec = divmod(rem, 60)\n    text = f\"{sign}{d}일 {h:02d}:{mi:02d}\"\n    if sec:\n        text += f\":{sec:02d}\"\n    return text\n\n\ndef fmt_hhmm(minutes) -> str:\n    \"\"\"분 → 'HH:MM' (24시간 초과 시 시간 누적).\"\"\"\n    m = Decimal(str(minutes))\n    total_sec = int((abs(m) * 60).quantize(Decimal(1), ROUND_HALF_UP))\n    h, rem = divmod(total_sec, 3600)\n    mi, sec = divmod(rem, 60)\n    text = f\"{'-' if m < 0 else ''}{h:02d}:{mi:02d}\"\n    if sec:\n        text += f\":{sec:02d}\"\n    return text\n\n\ndef to_days(minutes) -> Decimal:\n    return (Decimal(str(minutes)) / Decimal(1440)).quantize(Decimal(\"0.000001\"), ROUND_HALF_UP)\n", "core/validator.py": "\"\"\"SOF 이벤트 및 계약 조건 자동 검증.\"\"\"\nfrom .constants import EVENT_TYPES, INTERVAL_EVENTS, LAYTIME_END_EVENTS\nfrom .timeutil import fmt_dt, parse_dt\n\n\ndef validate_events(c: dict, events: list[dict]) -> tuple[list[str], list[str]]:\n    \"\"\"(errors, warnings). errors 가 있으면 계산 불가.\"\"\"\n    errors: list[str] = []\n    warnings: list[str] = []\n\n    for idx, e in enumerate(events, start=1):\n        code = e.get(\"event_type\")\n        if not code:\n            errors.append(f\"{idx}행: 이벤트 종류가 비어 있습니다.\")\n            continue\n        if not e.get(\"start\"):\n            errors.append(f\"{idx}행 ({EVENT_TYPES.get(code, code)}): 시작 일시가 없습니다.\")\n            continue\n        if code in INTERVAL_EVENTS:\n            if not e.get(\"end\"):\n                errors.append(f\"{idx}행 ({EVENT_TYPES[code]}): 구간 이벤트는 종료 일시가 필요합니다.\")\n            elif e[\"end\"] <= e[\"start\"]:\n                errors.append(f\"{idx}행 ({EVENT_TYPES[code]}): 종료가 시작보다 빠르거나 같습니다.\")\n\n    valid = [e for e in events if e.get(\"event_type\") and e.get(\"start\")]\n    codes = {e[\"event_type\"] for e in valid}\n    for req in (\"NOR_TENDERED\", \"COMMENCED\", \"COMPLETED\"):\n        if req not in codes:\n            errors.append(f\"필수 이벤트 누락: {EVENT_TYPES[req]}\")\n    end_code = c.get(\"laytime_end_event\", \"COMPLETED\")\n    if end_code not in codes and end_code != \"COMPLETED\":\n        warnings.append(f\"Laytime 종료 이벤트({LAYTIME_END_EVENTS.get(end_code, end_code)})가 없어 하역 완료로 대체됩니다.\")\n    if c.get(\"berth_terms\") == \"BERTH\" and \"ALL_FAST\" not in codes:\n        warnings.append(\"Berth charter 조건이나 접안 완료(All fast) 이벤트가 없습니다.\")\n\n    def first(code):\n        hits = sorted(e[\"start\"] for e in valid if e[\"event_type\"] == code)\n        return hits[0] if hits else None\n\n    def last(code):\n        hits = sorted(e[\"start\"] for e in valid if e[\"event_type\"] == code)\n        return hits[-1] if hits else None\n\n    nor, ops_s, ops_e = first(\"NOR_TENDERED\"), first(\"COMMENCED\"), last(\"COMPLETED\")\n    n_nor = sum(1 for e in valid if e[\"event_type\"] == \"NOR_TENDERED\")\n    if n_nor > 1:\n        warnings.append(f\"NOR 제출 이벤트가 {n_nor}건입니다 (재제출). 계산은 첫 NOR 기준이므로, 무효 NOR 행은 표에서 삭제하거나 \"\n                        \"이벤트를 '기타'로 바꾸세요. — 검토 필요\")\n    if nor and ops_e and ops_e < nor:\n        errors.append(\"시간 순서 오류: 하역 완료가 NOR 제출보다 빠릅니다.\")\n    if ops_s and ops_e and ops_e <= ops_s:\n        errors.append(\"시간 순서 오류: 하역 완료가 하역 개시보다 빠르거나 같습니다.\")\n    if nor and ops_s and ops_s < nor:\n        warnings.append(\"하역 개시가 NOR 제출보다 빠릅니다. NOR 유효성을 검토하세요.\")\n    docs = last(\"DOCS_ON_BOARD\")\n    if docs and ops_e and docs < ops_e:\n        warnings.append(\"서류 선적 완료가 하역 완료보다 빠릅니다.\")\n\n    laycan_s, laycan_e = parse_dt(c.get(\"laycan_start\")), parse_dt(c.get(\"laycan_end\"))\n    if nor and laycan_s and nor < laycan_s:\n        msg = \"허용(계약)\" if c.get(\"nor_before_laycan_counts\") else (\n            \"Laycan 시작에 제출 간주\" if c.get(\"nor_early_mode\") == \"DEEMED_AT_LAYCAN\" else \"Laycan 시작 전 기산 불가\"\n        )\n        warnings.append(f\"NOR({fmt_dt(nor)})이 Laycan 시작({fmt_dt(laycan_s)}) 이전에 제출됨 → {msg}\")\n    if nor and laycan_e and nor > laycan_e:\n        warnings.append(f\"NOR({fmt_dt(nor)})이 Laycan 종료({fmt_dt(laycan_e)}) 이후에 제출됨 — 검토 필요\")\n\n    intervals = sorted(\n        (e for e in valid if e[\"event_type\"] in INTERVAL_EVENTS and e.get(\"end\") and e[\"end\"] > e[\"start\"]),\n        key=lambda e: e[\"start\"],\n    )\n    for i, a in enumerate(intervals):\n        for b in intervals[i + 1 :]:\n            if b[\"start\"] >= a[\"end\"]:\n                break\n            warnings.append(\n                f\"기간 중복: {EVENT_TYPES[a['event_type']]}({fmt_dt(a['start'])}~{fmt_dt(a['end'])}) ↔ \"\n                f\"{EVENT_TYPES[b['event_type']]}({fmt_dt(b['start'])}~{fmt_dt(b['end'])}) — 이중 공제 방지 적용, 검토 필요\"\n            )\n    return errors, warnings\n", "ai/__init__.py": "", "ai/client.py": "\"\"\"OpenAI 클라이언트 — .env / Streamlit Secrets 의 OPENAI_API_KEY, OPENAI_MODEL 사용.\"\"\"\nimport json\n\nimport config\n\n\nclass AIUnavailable(RuntimeError):\n    pass\n\n\ndef is_available() -> bool:\n    return bool(config.openai_api_key())\n\n\ndef _client():\n    key = config.openai_api_key()\n    if not key:\n        raise AIUnavailable(\"OPENAI_API_KEY 가 설정되지 않았습니다. .env 또는 Streamlit Secrets 에 등록하세요.\")\n    from openai import OpenAI\n\n    return OpenAI(api_key=key)\n\n\ndef chat_json(system: str, user_text: str, images: list[str] | None = None, model: str | None = None) -> tuple[dict, dict]:\n    \"\"\"JSON 응답을 받아 (dict, usage) 반환.\n\n    images: data URL 목록 (\"data:image/png;base64,...\") — 있으면 비전 모델 사용.\n    \"\"\"\n    client = _client()\n    if images:\n        model = model or config.openai_vision_model()\n        content = [{\"type\": \"text\", \"text\": user_text}] + [\n            {\"type\": \"image_url\", \"image_url\": {\"url\": url, \"detail\": \"high\"}} for url in images\n        ]\n    else:\n        model = model or config.openai_model()\n        content = user_text\n\n    kwargs = dict(\n        model=model,\n        messages=[{\"role\": \"system\", \"content\": system}, {\"role\": \"user\", \"content\": content}],\n        response_format={\"type\": \"json_object\"},\n    )\n    import openai\n\n    try:\n        try:\n            resp = client.chat.completions.create(temperature=0, **kwargs)\n        except openai.BadRequestError as exc:  # 일부 추론 모델은 temperature 를 지원하지 않음\n            if \"temperature\" not in str(exc).lower():\n                raise\n            resp = client.chat.completions.create(**kwargs)\n    except openai.AuthenticationError as exc:\n        raise AIUnavailable(f\"OpenAI API 키가 유효하지 않습니다 (만료/무효화/오타). .env 또는 Secrets 의 OPENAI_API_KEY 를 새 키로 교체하세요. [{exc.status_code}]\") from exc\n    except openai.NotFoundError as exc:\n        raise AIUnavailable(f\"모델 '{model}' 을(를) 찾을 수 없거나 이 키로 접근 권한이 없습니다. OPENAI_MODEL 값을 확인하세요.\") from exc\n    except openai.RateLimitError as exc:\n        raise AIUnavailable(\"OpenAI 사용 한도/요금 한도를 초과했습니다. 잠시 후 다시 시도하거나 결제 설정을 확인하세요.\") from exc\n    except openai.APIConnectionError as exc:\n        raise AIUnavailable(\"OpenAI 서버에 연결할 수 없습니다. 네트워크를 확인하세요.\") from exc\n\n    text = resp.choices[0].message.content or \"{}\"\n    try:\n        data = json.loads(text)\n    except json.JSONDecodeError as exc:\n        raise ValueError(f\"모델 응답이 JSON 형식이 아닙니다: {text[:300]}\") from exc\n    usage = {\n        \"model\": model,\n        \"prompt_tokens\": getattr(resp.usage, \"prompt_tokens\", 0) if resp.usage else 0,\n        \"completion_tokens\": getattr(resp.usage, \"completion_tokens\", 0) if resp.usage else 0,\n    }\n    return data, usage\n", "ai/extract.py": "\"\"\"업로드 파일 → 모델 입력 (텍스트 또는 이미지 data URL).\"\"\"\nimport base64\nimport io\n\nMAX_PDF_IMAGE_PAGES = 8\n\n\ndef _img_data_url(raw: bytes, mime: str) -> str:\n    return f\"data:{mime};base64,{base64.b64encode(raw).decode()}\"\n\n\ndef file_to_payload(name: str, raw: bytes) -> tuple[str, list[str]]:\n    \"\"\"(text, images). 스캔 PDF/이미지는 images 로 반환.\"\"\"\n    lower = name.lower()\n    if lower.endswith((\".txt\", \".md\")):\n        for enc in (\"utf-8\", \"cp949\", \"latin-1\"):\n            try:\n                return raw.decode(enc), []\n            except UnicodeDecodeError:\n                continue\n    if lower.endswith((\".csv\", \".xlsx\", \".xlsm\")):\n        import pandas as pd\n\n        if lower.endswith(\".csv\"):\n            sheets = {\"csv\": pd.read_csv(io.BytesIO(raw), header=None, dtype=str)}\n        else:\n            sheets = pd.read_excel(io.BytesIO(raw), sheet_name=None, header=None, dtype=str)\n        parts = [f\"### Sheet: {n}\\n{df.dropna(how='all').fillna('').to_csv(index=False, header=False)}\" for n, df in sheets.items()]\n        return \"\\n\\n\".join(parts), []\n    if lower.endswith(\".pdf\"):\n        return _pdf_payload(raw)\n    if lower.endswith((\".png\", \".jpg\", \".jpeg\", \".webp\", \".gif\")):\n        ext = lower.rsplit(\".\", 1)[-1]\n        mime = \"image/jpeg\" if ext in (\"jpg\", \"jpeg\") else f\"image/{ext}\"\n        return \"\", [_img_data_url(raw, mime)]\n    raise ValueError(f\"지원하지 않는 파일 형식입니다: {name}\")\n\n\ndef _pdf_payload(raw: bytes) -> tuple[str, list[str]]:\n    import pdfplumber\n\n    texts = []\n    with pdfplumber.open(io.BytesIO(raw)) as pdf:\n        for i, page in enumerate(pdf.pages, start=1):\n            texts.append(f\"--- page {i} ---\\n{page.extract_text() or ''}\")\n    text = \"\\n\".join(texts)\n    if len(\"\".join(t.split(\"---\", 2)[-1] for t in texts).strip()) >= 80:\n        return text, []\n\n    # 텍스트가 거의 없으면 스캔본으로 보고 이미지로 변환\n    import pypdfium2 as pdfium\n\n    images = []\n    doc = pdfium.PdfDocument(raw)\n    for i in range(min(len(doc), MAX_PDF_IMAGE_PAGES)):\n        pil = doc[i].render(scale=3).to_pil().convert(\"RGB\")\n        for tile in page_strips(pil):\n            buf = io.BytesIO()\n            tile.save(buf, format=\"JPEG\", quality=88)\n            images.append(_img_data_url(buf.getvalue(), \"image/jpeg\"))\n    return \"\", images\n\n\nSTRIPS_PER_PAGE = 3\nSTRIP_OVERLAP = 0.06\n\n\ndef page_strips(pil, n: int = STRIPS_PER_PAGE, overlap: float = STRIP_OVERLAP) -> list:\n    \"\"\"세로로 긴 페이지를 위→아래 가로 띠 n 개로 나눈다 (조금씩 겹치게).\n\n    비전 모델은 이미지를 짧은 변 768px 로 줄여 읽기 때문에 A4 한 장을 통째로 보내면 손글씨 시각이 뭉개진다\n    (2026-11-24 실제 SOF: 수기 '10:20' → '01:20' 오판독). 띠로 나누면 같은 글자가 약 2배 해상도로 전달된다.\n    \"\"\"\n    w, h = pil.size\n    if h <= w * 1.1:\n        return [pil]\n    step = h / n\n    pad = int(h * overlap)\n    return [pil.crop((0, max(0, int(k * step) - pad), w, min(h, int((k + 1) * step) + pad))) for k in range(n)]\n", "ai/parsers.py": "\"\"\"계약서/SOF AI 파싱 → 검증·정규화된 구조 데이터.\n\nAI 출력은 그대로 계산에 사용하지 않는다. 화면에서 사용자 확인 후 확정한다.\n\"\"\"\nimport re\nfrom datetime import timedelta\n\nfrom core.constants import (\n    BERTH_TERMS,\n    DESPATCH_BASIS,\n    EVENT_TYPES,\n    EXCEPTED_USED,\n    INTERVAL_EVENTS,\n    LAYTIME_END_EVENTS,\n    LAYTIME_TERMS,\n    NOR_EARLY_MODES,\n)\nfrom core.contract import DEFAULT_CONTRACT\nfrom core.timeutil import fmt_dt, parse_dt\n\nfrom .client import chat_json\nfrom .prompts import CONTRACT_SYSTEM, SOF_SYSTEM\n\nMAX_TEXT_CHARS = 60000\n\n_ENUMS = {\n    \"basis\": {\"CP\", \"SPA\"},\n    \"port_type\": {\"LOAD\", \"DISCH\"},\n    \"laytime_mode\": {\"RATE\", \"FIXED\"},\n    \"laytime_terms\": set(LAYTIME_TERMS),\n    \"excepted_used\": set(EXCEPTED_USED),\n    \"despatch_mode\": {\"RATIO\", \"AMOUNT\"},\n    \"despatch_basis\": set(DESPATCH_BASIS),\n    \"berth_terms\": set(BERTH_TERMS),\n    \"laytime_end_event\": set(LAYTIME_END_EVENTS),\n    \"nor_early_mode\": set(NOR_EARLY_MODES),\n}\n_NUMBERS = {\"cargo_qty\", \"rate_mt_day\", \"fixed_laytime_hours\", \"demurrage_rate\", \"despatch_ratio\", \"despatch_rate\", \"notice_hours\"}\n_INTS = {\"weekend_start_dow\", \"weekend_end_dow\"}\n_BOOLS = {\"commence_if_sooner\", \"nor_before_laycan_counts\", \"oodaod\"}\n_TIMES = {\"weekend_start_time\", \"weekend_end_time\"}\n_DATETIMES = {\"laycan_start\", \"laycan_end\"}\n\n\ndef _to_number(v):\n    if isinstance(v, bool):\n        return None\n    if isinstance(v, (int, float)):\n        return float(v)\n    try:\n        return float(str(v).replace(\",\", \"\").strip())\n    except (TypeError, ValueError):\n        return None\n\n\ndef _hhmm(v) -> str | None:\n    \"\"\"'10:20', '1020', '1020hrs', '10.20' → '10:20' (판독 대조용). 해석 불가면 None.\"\"\"\n    m = re.search(r\"(\\d{1,2})\\s*[:.h]?\\s*(\\d{2})\", str(v or \"\"))\n    if not m:\n        return None\n    h, mi = int(m.group(1)), int(m.group(2))\n    return f\"{h:02d}:{mi:02d}\" if h <= 24 and mi < 60 else None\n\n\ndef _text(v) -> str | None:\n    s = str(v).strip() if v is not None else \"\"\n    return s or None\n\n\ndef _coerce(key, v):\n    \"\"\"AI 값을 계약 dict 형식으로 변환. 변환 실패 시 None.\"\"\"\n    if v is None:\n        return None\n    if key in _ENUMS:\n        s = str(v).strip().upper()\n        return s if s in _ENUMS[key] else None\n    if key in _NUMBERS:\n        return _to_number(v)\n    if key in _INTS:\n        n = _to_number(v)\n        return int(n) if n is not None and 0 <= n <= 6 else None\n    if key in _BOOLS:\n        if isinstance(v, bool):\n            return v\n        s = str(v).strip().lower()\n        return True if s in (\"true\", \"yes\", \"y\") else False if s in (\"false\", \"no\", \"n\") else None\n    if key in _TIMES:\n        s = str(v).strip()\n        try:\n            h, m = s.split(\":\")[:2]\n            return f\"{int(h):02d}:{int(m):02d}\"\n        except ValueError:\n            return None\n    if key in _DATETIMES:\n        dt = parse_dt(v)\n        return fmt_dt(dt) if dt else None\n    return str(v).strip()\n\n\ndef parse_contract(text: str, images: list[str] | None = None) -> dict:\n    \"\"\"반환: {\"values\": {key: value}, \"exceptions\": {key: rule}, \"meta\": {key: {...}}, \"summary\": str, \"usage\": {...}}\"\"\"\n    user = \"Contract text:\\n\\n\" + (text or \"\")[:MAX_TEXT_CHARS]\n    data, usage = chat_json(CONTRACT_SYSTEM, user, images)\n\n    values, meta = {}, {}\n    for key, item in (data.get(\"fields\") or {}).items():\n        if key not in DEFAULT_CONTRACT or key in (\"exceptions\", \"holidays\"):\n            continue\n        item = item if isinstance(item, dict) else {\"value\": item}\n        raw = item.get(\"value\")\n        val = _coerce(key, raw)\n        review = bool(item.get(\"needs_review\")) or str(item.get(\"confidence\", \"\")).lower() == \"low\"\n        if raw is not None and val is None:\n            review = True  # 형식 변환 실패\n        meta[key] = {\n            \"value\": val if val is not None else raw,\n            \"source_clause\": item.get(\"source_clause\"),\n            \"confidence\": item.get(\"confidence\"),\n            \"needs_review\": review or val is None,\n        }\n        if val is not None:\n            values[key] = val  # 검토 필요 항목도 값은 채우고 화면에서 표시\n\n    exceptions = {}\n    for key, item in (data.get(\"exceptions\") or {}).items():\n        if key not in DEFAULT_CONTRACT[\"exceptions\"] or not isinstance(item, dict):\n            continue\n        rule = {}\n        if isinstance(item.get(\"applies\"), bool):\n            rule[\"applies\"] = item[\"applies\"]\n        pct = _to_number(item.get(\"counted_pct\"))\n        if pct is not None and 0 <= pct <= 100:\n            rule[\"counted_pct\"] = pct\n        if item.get(\"clause\"):\n            rule[\"clause\"] = str(item[\"clause\"])\n        if rule:\n            exceptions[key] = rule\n        meta[f\"exc_{key}\"] = {\n            \"value\": rule or None,\n            \"source_clause\": item.get(\"source_clause\"),\n            \"confidence\": item.get(\"confidence\"),\n            \"needs_review\": bool(item.get(\"needs_review\")) or not rule or str(item.get(\"confidence\", \"\")).lower() == \"low\",\n        }\n\n    return {\"values\": values, \"exceptions\": exceptions, \"meta\": meta, \"summary\": data.get(\"summary\", \"\"), \"usage\": usage}\n\n\n_SHIFT_START = re.compile(r\"heav\\w*\\s+(up\\s+)?(the\\s+)?anchor|anchor\\s+(aweigh|up)|commenc\\w*\\s+shift\", re.IGNORECASE)\n_SHIFT_LOOKBACK = timedelta(hours=6)\n\n\ndef _add_flag(e: dict, note: str):\n    e[\"ai_flag\"] = True\n    e[\"remarks\"] = f\"{e['remarks']} {note}\".strip() if e.get(\"remarks\") else note\n\n\ndef _check_shifting(events: list[dict]):\n    \"\"\"AI 가 고른 Shifting 구간을 SOF 의 다른 행과 대조해, 어긋나면 🚩 로 표시한다 (값은 고치지 않음 — 추정 금지).\n\n    - 시작보다 앞선 '닻 올리기 시작 / anchor aweigh / commenced shifting' 기록이 있으면 시작 시각 후보로 안내\n      (2026-11-24 실제 파싱: 10:00 heaving 이 있는데 10:24 anchor aweigh 로 시작 → 24분 차이)\n    - Shifting 종료가 그 구간 근처의 All fast 시각과 다르면 안내\n    \"\"\"\n    for s in events:\n        if s[\"event_type\"] != \"SHIFTING\" or s[\"start\"] is None:\n            continue\n        earlier = [\n            e for e in events\n            if e is not s and e[\"start\"] is not None and e[\"event_type\"] != \"SHIFTING\"\n            and s[\"start\"] - _SHIFT_LOOKBACK <= e[\"start\"] < s[\"start\"] and _SHIFT_START.search(e.get(\"description\") or \"\")\n        ]\n        if earlier:\n            first = min(earlier, key=lambda e: e[\"start\"])\n            _add_flag(s, f\"[확인] 시작 전 기록 {fmt_dt(first['start'])} '{first['description']}' — \"\n                         \"Shifting 기산 시점(닻 올리기 시작 / anchor aweigh 중 빠른 시점) 확인 필요\")\n        if s[\"end\"] is not None:\n            fasts = [e for e in events if e[\"event_type\"] == \"ALL_FAST\" and e[\"start\"] is not None\n                     and s[\"start\"] < e[\"start\"] <= s[\"end\"] + _SHIFT_LOOKBACK]\n            if fasts and all(e[\"start\"] != s[\"end\"] for e in fasts):\n                _add_flag(s, f\"[확인] Shifting 종료 {fmt_dt(s['end'])} ≠ All fast {fmt_dt(fasts[0]['start'])}\")\n\n\ndef parse_sof(text: str, images: list[str] | None = None, year_hint: str = \"\") -> dict:\n    \"\"\"반환: {\"events\": [ {start, end, event_type, description, remarks, ai_flag} ], \"summary\", \"usage\", \"vessel\", \"port\"}\"\"\"\n    hint = f\"Context hint: laycan / voyage period around {year_hint}.\\n\\n\" if year_hint else \"\"\n    if images and not text:\n        hint += (f\"The {len(images)} attached images are horizontal strips of the scanned pages, top to bottom in reading order. \"\n                 \"Neighbouring strips overlap slightly: do not output a row twice.\\n\\n\")\n    user = hint + \"SOF document:\\n\\n\" + ((text or \"\")[:MAX_TEXT_CHARS] if text else \"(see attached images)\")\n    data, usage = chat_json(SOF_SYSTEM, user, images)\n\n    events = []\n    for item in data.get(\"events\") or []:\n        if not isinstance(item, dict):\n            continue\n        code = str(item.get(\"event_type\", \"\")).strip().upper()\n        flag = bool(item.get(\"ai_flag\"))\n        remarks = str(item.get(\"remarks\") or \"\")\n        if code not in EVENT_TYPES:\n            remarks = f\"[원래 분류: {code}] {remarks}\".strip()\n            code, flag = \"OTHER\", True\n        start, end = parse_dt(item.get(\"start\")), parse_dt(item.get(\"end\"))\n        if start is None:\n            flag = True\n        if code in INTERVAL_EVENTS and end is None:\n            flag = True\n            remarks = (remarks + \" 종료 시각 확인 필요\").strip()\n        if code not in INTERVAL_EVENTS:\n            end = None\n        # 수기 판독값·다른 칸과 어긋난 값은 모델이 ai_flag 를 빠뜨려도 코드가 🚩 처리한다 (추정 금지)\n        if item.get(\"handwritten\") is True:\n            flag = True\n            remarks = (remarks + \" [확인] 수기 기재 시각\").strip()\n        others = sorted({t for t in (_hhmm(x) for x in (item.get(\"other_readings\") or [])) if t})\n        own = {t.strftime(\"%H:%M\") for t in (start, end) if t}\n        if others and not set(others) <= own:\n            flag = True\n            remarks = (remarks + f\" [확인] 다른 칸 기재 {', '.join(others)}\").strip()\n        events.append(\n            {\n                \"start\": start,\n                \"end\": end,\n                \"event_type\": code,\n                \"description\": str(item.get(\"description\") or \"\"),\n                \"remarks\": remarks,\n                \"ai_flag\": flag,\n            }\n        )\n    events.sort(key=lambda e: (e[\"start\"] is None, e[\"start\"] or 0))\n    _check_shifting(events)\n    return {\n        \"events\": events,\n        \"summary\": data.get(\"summary\", \"\"),\n        \"vessel\": data.get(\"vessel\"),\n        \"port\": data.get(\"port\"),\n        \"voyage\": _text(data.get(\"voyage\")),\n        \"load_port\": _text(data.get(\"load_port\")),\n        \"disch_port\": _text(data.get(\"disch_port\")),\n        \"cargo\": _text(data.get(\"cargo\")),\n        \"bl_qty\": _to_number(data.get(\"bl_qty\")) if data.get(\"bl_qty\") is not None else None,\n        \"usage\": usage,\n    }\n", "ai/prompts.py": "\"\"\"조체선료 분석 모델용 시스템 프롬프트.\n\n원칙: AI 는 문서 해석/구조화만 수행한다. 시간·금액 계산 금지, 원문에 없는 값 추정 금지.\n\"\"\"\n\nCONTRACT_FIELDS_SPEC = \"\"\"\nField keys and allowed values (use exactly these keys):\n- basis: \"CP\" (charter party, settlement with shipowner) | \"SPA\" (purchase contract with iron ore/coal supplier)\n- port_type: \"LOAD\" | \"DISCH\"\n- vessel: string (vessel name only, without voyage number)\n- voyage: string (voyage number if stated, e.g. \"064R\")\n- port: string (the port this laytime settlement is for: the load port if port_type = LOAD, the discharge port if DISCH)\n- other_port: string (the other port of the voyage: discharge port if port_type = LOAD, load port if DISCH)\n- cargo_name: string (e.g. \"IRON ORE\", \"COAL\")\n- country: ISO 3166-1 alpha-2 code of the port country (e.g. \"AU\", \"BR\", \"KR\")\n- counterparty: settlement counterparty. If CP: the shipowner, one of 팬오션 (Pan Ocean), H-LINE, K-LINE, 대한해운 (Korea Line),\n  폴라리스 (Polaris Shipping), HMM; any other owner -> write its name as stated.\n  If SPA: one of BHP, VALE, RIO TINTO, FMG, KUMBA, ASSMANG, SAMARCO (supplier), or the supplier name as stated. If not stated, null.\n- laycan_start, laycan_end: \"YYYY-MM-DD HH:MM\" (if only dates, use 00:00 for start and 23:59 for end)\n- cargo_qty: number (metric tons, B/L quantity or contract quantity)\n- laytime_mode: \"RATE\" (loading/discharge rate given) | \"FIXED\" (fixed laytime given)\n- rate_mt_day: number (MT per day, e.g. \"30,000 MT PWWD SHINC\" -> 30000)\n- fixed_laytime_hours: number (convert stated days to hours, e.g. \"3 days\" -> 72)\n- laytime_terms: \"SHINC\" | \"SHEX\" | \"SSHEX\"\n- excepted_used: \"EIU\" (even if used) | \"UU\" (unless used)\n- weekend_start_dow / weekend_end_dow: integer 0=Monday … 6=Sunday (excepted weekend period)\n- weekend_start_time / weekend_end_time: \"HH:MM\"\n- demurrage_rate: number (USD per day pro rata)\n- despatch_mode: \"RATIO\" | \"AMOUNT\"\n- despatch_ratio: number (e.g. \"half demurrage\" -> 0.5)\n- despatch_rate: number (USD per day) when stated as an amount\n- despatch_basis: \"WTS\" (working time saved / laytime saved) | \"ATS\" (all time saved)\n- nor_condition: string (where/when NOR may be tendered, e.g. \"ATDNSHINC, whether in berth or not\")\n- notice_hours: number (e.g. \"laytime to commence 6 hours after NOR\" -> 6; \"12 hours\" -> 12)\n- commence_if_sooner: boolean (true if \"unless sooner commenced, in which case actual time used shall count\")\n- nor_before_laycan_counts: boolean (true only if contract says laytime may count before laycan commencement)\n- nor_early_mode: \"NOT_BEFORE_LAYCAN\" (laytime shall not commence before laycan start; NOR+notice or laycan start, whichever later) |\n  \"DEEMED_AT_LAYCAN\" (NOR tendered before laycan deemed tendered at laycan start, then notice time runs)\n- berth_terms: \"WIBON\" | \"WIPON\" | \"WIFPON\" | \"WCCON\" | \"PORT\" | \"BERTH\"\n- laytime_end_event: \"COMPLETED\" (completion of loading/discharge) | \"DOCS_ON_BOARD\"\n- oodaod: boolean (once on demurrage, always on demurrage)\n- clause_laytime, clause_nor, clause_demurrage: clause numbers as written (e.g. \"Cl.18\")\n\nException keys (in \"exceptions\"): shifting, draft_survey, weather, breakdown_ship, breakdown_shore, strike\n- applies: true if the time is excluded (or partly) from laytime by the contract\n- counted_pct: percent of the time that still COUNTS as laytime (excluded entirely -> 0, half counts -> 50)\n- clause: clause number/short reference\n- \"WWD\" / \"weather permitting\" means weather.applies = true, counted_pct = 0.\n\"\"\".strip()\n\nCONTRACT_SYSTEM = f\"\"\"You are a maritime laytime & demurrage contract analyst for dry bulk cargo (iron ore, coal).\nRead the given Charter Party or Sales contract text and extract the terms needed for a laytime calculation.\n\nStrict rules:\n1. Never guess. If a term is not stated or is ambiguous, set value to null and needs_review to true.\n2. Do not calculate laytime or money. Only convert units that are explicitly stated.\n3. source_clause must be a verbatim quote from the contract (max 300 chars), including the clause number if visible.\n4. confidence: \"high\" | \"medium\" | \"low\". Use needs_review = true for low confidence or conflicting clauses.\n5. Respond with JSON only.\n\n{CONTRACT_FIELDS_SPEC}\n\nOutput JSON schema:\n{{\n  \"fields\": {{\n    \"<field_key>\": {{\"value\": <value or null>, \"source_clause\": <string or null>, \"confidence\": \"high|medium|low\", \"needs_review\": <bool>}}\n  }},\n  \"exceptions\": {{\n    \"<exception_key>\": {{\"applies\": <bool or null>, \"counted_pct\": <number or null>, \"clause\": <string or null>,\n                         \"source_clause\": <string or null>, \"confidence\": \"high|medium|low\", \"needs_review\": <bool>}}\n  }},\n  \"summary\": \"<Korean summary of key laytime terms, 2-4 sentences>\"\n}}\n\"\"\"\n\nSOF_EVENT_SPEC = \"\"\"\nevent_type codes:\n- Point events (end = null): ARRIVAL, NOR_TENDERED, NOR_ACCEPTED, ANCHORED, FREE_PRATIQUE, PILOT_ON, ALL_FAST,\n  COMMENCED (cargo operations commenced), COMPLETED (cargo operations completed), DOCS_ON_BOARD, OTHER\n- Interval events (start AND end required): SHIFTING, DRAFT_SURVEY, WEATHER (rain/swell/wind stoppage),\n  BREAKDOWN_SHIP (vessel's gear/crane/hatch failure), BREAKDOWN_SHORE (shiploader/conveyor/terminal failure),\n  STRIKE, STOPPAGE_OTHER (any other stoppage, e.g. waiting cargo, trimming, cleaning holds)\n\"\"\".strip()\n\nSOF_SYSTEM = f\"\"\"You are a maritime Statement of Facts (SOF) parser for dry bulk laytime calculations.\nConvert the SOF / NOR / time sheet into a chronological event table.\n\nStrict rules:\n1. Copy times exactly as written; normalize to \"YYYY-MM-DD HH:MM\" local port time. \"2400\" -> next day 00:00.\n2. If a year or date is missing, infer from surrounding rows or the hint given, and set ai_flag = true.\n3. Convert stoppage pairs (e.g. \"rain stopped loading 1500\" / \"resumed 1900\") into ONE interval event with start/end.\n4. If you cannot read a value with certainty (scan quality, handwriting), still output the row with ai_flag = true and explain in remarks.\n5. Do NOT calculate laytime, durations or money. Do not invent events that are not in the document.\n6. If cargo operations are suspended/resumed several times, output COMMENCED once (first) and COMPLETED once (final), with stoppages as interval events.\n7. \"Waiting for berth / congestion / berth occupied\" is NOT a stoppage: output it as OTHER (point event at its start, end = null)\n   and mention the period in remarks. Lines like \"Discharging in progress - no stoppages\" are not events: skip them.\n8. Shifting from anchorage to berth: one SHIFTING interval. start = the EARLIEST of \"commenced heaving (up) anchor\",\n   \"commenced shifting\" (also check summary tables) and \"anchor aweigh\"; end = \"all fast\". Also output ALL_FAST as a point event.\n   Example: \"10:00 Pilot on board / Commenced heaving up anchor\" and \"10:24 Anchor aweigh\" -> SHIFTING starts 10:00, not 10:24.\n   If the document gives different shifting start times, use the earliest and set ai_flag = true, listing the alternatives in remarks.\n   Pilot on board, customs clearance, sailed -> OTHER or PILOT_ON.\n9. Draft surveys (initial/final) with From/To -> DRAFT_SURVEY intervals, even if outside cargo operations.\n10. Agent \"TIME SHEET\" layouts (event list + \"Working Records\" table + numbered \"Remark\" lines) are common.\n    Use ALL three sections and cross-check them; when they disagree, use the most specific one and set ai_flag = true with both values in remarks.\n    - Numbered remark periods such as \"1300hrs-1400hrs/21st Sep: Carried out initial draft survey\" are intervals (DRAFT_SURVEY here).\n    - \"From anchor aweigh to all line made fast\" -> SHIFTING. A later berth-to-berth shift (\"Shifted from No.4 pier to No.5 pier\")\n      is ALSO a SHIFTING interval. If Working Records show \"Stopped discharge due to shifting\" for a longer period than the\n      actual move (POB / un-berthed -> shifted / all fast), output the STOPPED period as the SHIFTING interval, set ai_flag = true,\n      and list the actual move times in remarks — which period is excluded depends on the contract, so the user must decide.\n    - Other \"Stopped discharge due to X\" rows in Working Records are stoppages of type X.\n    - \"Awaited shore readiness / awaiting cargo / awaiting trucks\" -> STOPPAGE_OTHER interval (the contract decides; never drop it).\n    - \"Awaited berthing order / congestion\" -> OTHER (rule 7). \"Awaited departure clearance / pilot for sailing\" after completion -> OTHER.\n    - Handwritten times are common. Set \"handwritten\": true on every event whose time is handwritten (not printed/typed).\n      In handwriting a leading \"1\" often looks like \"/\" or \"|\": \"/0:20\" is 10:20, \"/2:42\" is 12:42, \"//20\" is 1120.\n      A handwritten value must be consistent with the other sections (Working Records \"To\" time, numbered Remark periods).\n    - For every event, put in \"other_readings\" the time(s) of the SAME fact as written in the other sections\n      (e.g. Completed Discharging in the event list AND the last Working Records \"To\" AND the final draft survey remark start).\n    - \"First line to shore\" is NOT all fast. ALL_FAST = \"all line(s) made fast\" / \"all fast\"; a SHIFTING to berth ends at all fast.\n    - Day numbers like \"21st Sep\" with the year in the header: build full dates from the header year.\n11. Respond with JSON only.\n\n{SOF_EVENT_SPEC}\n\nOutput JSON schema:\n{{\n  \"vessel\": <string or null, vessel name only>,\n  \"voyage\": <string or null, voyage number e.g. \"84\" or \"064R\">,\n  \"port\": <string or null, the port where this SOF was issued>,\n  \"load_port\": <string or null>,\n  \"disch_port\": <string or null>,\n  \"cargo\": <string or null, e.g. \"IRON ORE\">,\n  \"bl_qty\": <number or null, B/L quantity in metric tons>,\n  \"events\": [\n    {{\"start\": \"YYYY-MM-DD HH:MM\", \"end\": \"YYYY-MM-DD HH:MM\" or null, \"event_type\": \"<code>\",\n      \"description\": \"<original wording>\", \"remarks\": \"<Korean note or empty>\", \"ai_flag\": <bool>,\n      \"handwritten\": <bool>, \"other_readings\": [\"HH:MM\", ...]}}\n  ],\n  \"summary\": \"<Korean summary: NOR, commencement, completion, major stoppages>\"\n}}\n\"\"\"\n", "ui/__init__.py": "", "ui/download.py": "\"\"\"다운로드 버튼 — 서버 실행(streamlit run)과 HTML 단일 파일(stlite, 브라우저 안 Python) 모두 지원.\n\nstlite 1.12 (Streamlit 1.65) 에서는 st.download_button 이 파일을 'stlite.invalid/…/media' 주소로 가져오다 실패한다\n(2026-11-24 확인: \"Download Button fetch error\"). 브라우저 안에서 실행 중이면 data URL 링크로 내려받게 한다.\n\"\"\"\nimport base64\nimport sys\nfrom html import escape\n\n\nIN_BROWSER = sys.platform == \"emscripten\"  # Pyodide (stlite)\n\n_STYLE = (\"display:block;text-align:center;padding:0.45rem 0.75rem;border-radius:0.5rem;text-decoration:none;\"\n          \"font-weight:600;border:1px solid rgba(31,56,100,0.45);{extra}\")\n\n\ndef download(container, label: str, data, file_name: str, mime: str, primary: bool = False) -> None:\n    if not IN_BROWSER:\n        container.download_button(label, data, file_name=file_name, mime=mime, width=\"stretch\",\n                                  type=\"primary\" if primary else \"secondary\")\n        return\n    raw = data.encode(\"utf-8\") if isinstance(data, str) else bytes(data)\n    href = f\"data:{mime};base64,{base64.b64encode(raw).decode()}\"\n    extra = \"background:#1F3864;color:#fff;\" if primary else \"color:inherit;\"\n    container.markdown(f'<a download=\"{escape(file_name)}\" href=\"{href}\" style=\"{_STYLE.format(extra=extra)}\">{escape(label)}<\/a>',\n                       unsafe_allow_html=True)\n", "ui/state.py": "\"\"\"Streamlit session_state ↔ 계약 dict / 이벤트 표 변환.\"\"\"\nfrom datetime import time\n\nimport pandas as pd\nimport streamlit as st\n\nfrom core.constants import EVENT_TYPES, code_from_label, event_label, parse_rate\nfrom core.contract import DEFAULT_CONTRACT, default_contract, normalize_contract\nfrom core.timeutil import fmt_dt, fmt_hm, parse_dt, parse_hm\n\nSIMPLE_KEYS = [\n    k\n    for k in DEFAULT_CONTRACT\n    if k not in (\"exceptions\", \"holidays\", \"laycan_start\", \"laycan_end\", \"weekend_start_time\", \"weekend_end_time\")\n]\nFLOAT_KEYS = {\"cargo_qty\", \"rate_mt_day\", \"fixed_laytime_hours\", \"demurrage_rate\", \"despatch_ratio\", \"despatch_rate\", \"notice_hours\"}\nEVENT_COLUMNS = [\"start\", \"end\", \"event_type\", \"description\", \"remarks\", \"ai_flag\"]\n\n\ndef contract_to_state(c: dict) -> dict:\n    c = normalize_contract(c)\n    s = {}\n    for k in SIMPLE_KEYS:\n        v = c[k]\n        s[f\"c_{k}\"] = float(v or 0) if k in FLOAT_KEYS else v\n    for side in (\"start\", \"end\"):\n        dt = parse_dt(c[f\"laycan_{side}\"])\n        s[f\"c_laycan_{side}_date\"] = dt.date() if dt else None\n        s[f\"c_weekend_{side}_time\"] = parse_hm(c[f\"weekend_{side}_time\"])\n    for ek, rule in c[\"exceptions\"].items():\n        s[f\"x_{ek}_applies\"] = bool(rule.get(\"applies\"))\n        s[f\"x_{ek}_pct\"] = float(rule.get(\"counted_pct\") or 0)\n        s[f\"x_{ek}_clause\"] = rule.get(\"clause\") or \"\"\n    return s\n\n\ndef state_to_contract() -> dict:\n    ss = st.session_state\n    c = default_contract()\n    for k in SIMPLE_KEYS:\n        c[k] = ss.get(f\"c_{k}\", c[k])\n    for k in (\"vessel\", \"cargo_name\", \"load_port\", \"disch_port\"):  # selectbox(직접 입력 허용) 미선택 = None → 빈 문자열\n        c[k] = c[k] or \"\"\n    c[\"rate_mt_day\"] = parse_rate(c[\"rate_mt_day\"]) or 0.0  # 하역률 selectbox (직접 입력은 문자열로 들어옴)\n    c[\"port\"] = c[\"other_port\"] = \"\"  # 선적항·양하항에서 다시 계산 (normalize_contract)\n    for side in (\"start\", \"end\"):\n        d = ss.get(f\"c_laycan_{side}_date\")\n        # Laycan 은 날짜로만 입력: 시작일 00:00 ~ 종료일 24:00 (23:59 로 저장 — 분 단위 계산에서 1분 차이 없음, 종료일 포함)\n        c[f\"laycan_{side}\"] = f\"{d.isoformat()} {'00:00' if side == 'start' else '23:59'}\" if d else None\n        c[f\"weekend_{side}_time\"] = fmt_hm(ss.get(f\"c_weekend_{side}_time\") or time(0, 0))\n    for ek in c[\"exceptions\"]:\n        c[\"exceptions\"][ek] = {\n            \"applies\": bool(ss.get(f\"x_{ek}_applies\")),\n            \"counted_pct\": float(ss.get(f\"x_{ek}_pct\") or 0),\n            \"clause\": ss.get(f\"x_{ek}_clause\") or \"\",\n        }\n    c[\"holidays\"] = holidays_in_use()\n    return normalize_contract(c)\n\n\ndef holidays_in_use(df: pd.DataFrame | None = None) -> list[dict]:\n    if df is None:\n        df = st.session_state.get(\"holidays_df\")\n    if df is None or df.empty:\n        return []\n    out = []\n    for _, row in df.iterrows():\n        if not row.get(\"적용\", True) or pd.isna(row.get(\"날짜\")):\n            continue\n        d = pd.to_datetime(row[\"날짜\"]).date()\n        out.append({\"date\": d.isoformat(), \"name\": str(row.get(\"명칭\") or \"\")})\n    return out\n\n\ndef empty_events_df() -> pd.DataFrame:\n    df = pd.DataFrame(columns=EVENT_COLUMNS)\n    df[\"start\"] = pd.to_datetime(df[\"start\"])\n    df[\"end\"] = pd.to_datetime(df[\"end\"])\n    df[\"ai_flag\"] = df[\"ai_flag\"].astype(bool)\n    return df\n\n\ndef events_to_df(events: list[dict]) -> pd.DataFrame:\n    if not events:\n        return empty_events_df()\n    rows = [\n        {\n            \"start\": e.get(\"start\"),\n            \"end\": e.get(\"end\"),\n            \"event_type\": event_label(e[\"event_type\"]),\n            \"description\": e.get(\"description\", \"\"),\n            \"remarks\": e.get(\"remarks\", \"\"),\n            \"ai_flag\": bool(e.get(\"ai_flag\", False)),\n        }\n        for e in events\n    ]\n    df = pd.DataFrame(rows, columns=EVENT_COLUMNS)\n    df[\"start\"] = pd.to_datetime(df[\"start\"])\n    df[\"end\"] = pd.to_datetime(df[\"end\"])\n    df.index = range(1, len(df) + 1)  # 표의 행 번호 = 검증 메시지의 'n행'\n    return df\n\n\ndef df_to_events(df: pd.DataFrame) -> list[dict]:\n    events = []\n    if df is None:\n        return events\n    for _, row in df.iterrows():\n        code = code_from_label(row.get(\"event_type\"))\n        start = parse_dt(row.get(\"start\"))\n        if code is None and start is None:\n            continue  # 빈 행\n        events.append(\n            {\n                \"start\": start,\n                \"end\": parse_dt(row.get(\"end\")),\n                \"event_type\": code,\n                \"description\": \"\" if pd.isna(row.get(\"description\")) else str(row.get(\"description\") or \"\"),\n                \"remarks\": \"\" if pd.isna(row.get(\"remarks\")) else str(row.get(\"remarks\") or \"\"),\n                \"ai_flag\": bool(row.get(\"ai_flag\")) if not pd.isna(row.get(\"ai_flag\")) else False,\n            }\n        )\n    return events\n\n\ndef events_to_json(events: list[dict]) -> list[dict]:\n    return [{**e, \"start\": fmt_dt(e[\"start\"]), \"end\": fmt_dt(e.get(\"end\")) or None} for e in events]\n\n\ndef events_from_json(items: list[dict]) -> list[dict]:\n    return [\n        {**e, \"start\": parse_dt(e.get(\"start\")), \"end\": parse_dt(e.get(\"end\"))}\n        for e in items\n        if e.get(\"event_type\") in EVENT_TYPES\n    ]\n\n\nADJ_WIDGETS = (\"w_adj_usd\", \"w_adj_reason\")\nADJ_LIMIT = 9.99  # 수기 조정은 최종 금액의 1의 자리 이하만 (상대측과의 초 단위 차이 맞춤 용도)\n\n\ndef empty_adjustment() -> dict:\n    return {\"usd\": 0.0, \"reason\": \"\"}\n\n\ndef normalize_adjustment(a) -> dict:\n    a = a if isinstance(a, dict) else {}\n    try:\n        usd = round(float(a.get(\"usd\") or 0), 2)\n    except (TypeError, ValueError):\n        usd = 0.0\n    return {\"usd\": max(-ADJ_LIMIT, min(ADJ_LIMIT, usd)), \"reason\": str(a.get(\"reason\") or \"\")}\n\n\ndef current_adjustment() -> dict:\n    \"\"\"이번 실행의 수기 조정값 — 위젯이 이미 바뀐 값을 갖고 있으면 그것을 우선 (같은 실행에서 금액 표시가 늦지 않게).\"\"\"\n    ss = st.session_state\n    base = ss.get(\"adjustment\") or empty_adjustment()\n    return normalize_adjustment({\"usd\": ss.get(\"w_adj_usd\", base[\"usd\"]), \"reason\": ss.get(\"w_adj_reason\", base[\"reason\"])})\n\n\ndef queue_state(updates: dict, events: list[dict] | None = None, holidays: list[dict] | None = None,\n                adjustment: dict | None = None):\n    \"\"\"위젯 생성 전(다음 실행 시작 시)에 적용할 상태를 예약하고 재실행.\"\"\"\n    pending = st.session_state.setdefault(\"_pending\", {})\n    pending.update(updates)\n    if events is not None:\n        st.session_state[\"_pending_events\"] = events\n    if holidays is not None:\n        st.session_state[\"_pending_holidays\"] = holidays\n    if adjustment is not None:\n        st.session_state[\"_pending_adjustment\"] = adjustment\n    st.rerun()\n\n\ndef apply_pending():\n    ss = st.session_state\n    if \"_pending\" in ss:\n        for k, v in ss.pop(\"_pending\").items():\n            ss[k] = v\n    if \"_pending_events\" in ss:\n        ss[\"events_df\"] = events_to_df(ss.pop(\"_pending_events\"))\n        ss.pop(\"events_editor\", None)\n        ss[\"events_version\"] = ss.get(\"events_version\", 0) + 1\n        ss[\"overrides\"] = {}\n        ss[\"adjustment\"] = empty_adjustment()  # 다른 정산 건 — 이전 수기 조정은 남기지 않는다\n        for k in ADJ_WIDGETS:\n            ss.pop(k, None)\n    if \"_pending_adjustment\" in ss:\n        ss[\"adjustment\"] = normalize_adjustment(ss.pop(\"_pending_adjustment\"))\n        for k in ADJ_WIDGETS:\n            ss.pop(k, None)\n    if \"_pending_holidays\" in ss:\n        items = ss.pop(\"_pending_holidays\")\n        if not items:  # 샘플·템플릿으로 휴일이 비워지면 자동 불러오기를 다시 허용\n            ss.pop(\"_auto_holidays\", None)\n        ss[\"holidays_df\"] = holidays_to_df(items)\n        ss[\"holidays_version\"] = ss.get(\"holidays_version\", 0) + 1\n\n\ndef holidays_to_df(items: list[dict]) -> pd.DataFrame:\n    df = pd.DataFrame(\n        [{\"적용\": True, \"날짜\": pd.to_datetime(h[\"date\"]).date(), \"명칭\": h.get(\"name\", \"\")} for h in items],\n        columns=[\"적용\", \"날짜\", \"명칭\"],\n    )\n    return df\n\n\ndef init_state():\n    ss = st.session_state\n    for k, v in contract_to_state(DEFAULT_CONTRACT).items():\n        ss.setdefault(k, v)\n    ss.setdefault(\"events_df\", empty_events_df())\n    ss.setdefault(\"events_version\", 0)\n    ss.setdefault(\"holidays_df\", holidays_to_df([]))\n    ss.setdefault(\"holidays_version\", 0)\n    ss.setdefault(\"overrides\", {})\n    ss.setdefault(\"ai_contract\", None)\n    ss.setdefault(\"ai_sof\", None)\n    ss.setdefault(\"contract_locked\", False)\n    ss.setdefault(\"adjustment\", empty_adjustment())\n    ss.setdefault(\"sample_note\", None)\n    ss.setdefault(\"ai_error\", None)\n    ss.setdefault(\"ai_usage\", {\"calls\": 0, \"prompt_tokens\": 0, \"completion_tokens\": 0})\n\n\ndef reset_ai_confirmation(contract: bool = True, sof: bool = True):\n    \"\"\"샘플·템플릿처럼 AI 와 무관한 데이터로 바꿀 때 AI 결과·확정·잠금 상태를 초기화한다.\"\"\"\n    ss = st.session_state\n    if contract:\n        ss[\"ai_contract\"] = None\n        ss[\"contract_locked\"] = False\n    if sof:\n        ss[\"ai_sof\"] = None\n\n\ndef ai_pending(events: list[dict]) -> list[str]:\n    \"\"\"PRD §3-1: AI 출력은 사용자 확인을 거쳐야 한다 — 아직 확인되지 않은 항목 목록 (비어 있으면 확정 가능).\"\"\"\n    ss = st.session_state\n    items = []\n    ai_c = ss.get(\"ai_contract\")\n    if ai_c and not ai_c.get(\"confirmed\"):\n        items.append(\"AI 가 채운 계약 조건이 확정되지 않았습니다 — ① 탭에서 원문과 대조한 뒤 '계약 조건 확정'을 누르세요.\")\n    ai_s = ss.get(\"ai_sof\")\n    if ai_s and not ai_s.get(\"confirmed\"):\n        items.append(\"AI 가 추출한 SOF 이벤트가 확정되지 않았습니다 — ② 탭에서 원본과 대조한 뒤 'SOF 이벤트 확정'을 누르세요.\")\n    flagged = sum(1 for e in events if e.get(\"ai_flag\"))\n    if flagged:\n        items.append(f\"🚩 AI 확인 필요 행 {flagged}건이 남아 있습니다 — ② 탭에서 원본과 대조 후 체크를 해제하세요.\")\n    return items\n\n\ndef record_ai_error(exc: Exception):\n    st.session_state[\"ai_error\"] = str(exc)\n\n\ndef record_usage(usage: dict):\n    st.session_state[\"ai_error\"] = None\n    u = st.session_state[\"ai_usage\"]\n    u[\"calls\"] += 1\n    u[\"prompt_tokens\"] += usage.get(\"prompt_tokens\", 0)\n    u[\"completion_tokens\"] += usage.get(\"completion_tokens\", 0)\n", "ui/style.py": "\"\"\"공통 스타일 — 의미 색상(화면·Excel 공통 의미), 상태 카드, 결과 카드, 범례.\n\n색은 의미에만 쓴다. 배경은 반투명 rgba 로 지정해 라이트/다크 테마 모두에서 글자가 읽히게 한다.\n\"\"\"\nfrom html import escape\n\nimport streamlit as st\n\n# 화면 강조색 (Excel 은 export/excel.py 의 같은 의미 색을 사용)\nROW_COLORS = {\n    \"review\": \"rgba(255, 193, 7, 0.32)\",  # 검토 필요 — 노랑\n    \"user\": \"rgba(13, 110, 253, 0.18)\",  # 사용자 판단 — 파랑\n    \"dem\": \"rgba(220, 53, 69, 0.14)\",  # 체선 구간 — 연한 빨강\n}\nSTATE_COLORS = {\n    \"ok\": (\"rgba(25, 135, 84, 0.12)\", \"rgba(25, 135, 84, 0.55)\"),\n    \"warn\": (\"rgba(255, 193, 7, 0.16)\", \"rgba(204, 153, 0, 0.65)\"),\n    \"err\": (\"rgba(220, 53, 69, 0.12)\", \"rgba(220, 53, 69, 0.60)\"),\n    \"idle\": (\"rgba(128, 128, 128, 0.08)\", \"rgba(128, 128, 128, 0.35)\"),\n}\nSTATE_ICON = {\"ok\": \"✅\", \"warn\": \"⚠️\", \"err\": \"❌\", \"idle\": \"○\"}\n\n_CSS = \"\"\"\n<style>\n.block-container {padding-top: 2.2rem; padding-bottom: 3rem; max-width: 1500px;}\nh1 {font-size: 1.75rem !important;}\ndiv[data-testid=\"stTabs\"] button p {font-size: 0.98rem; font-weight: 600;}\n.lt-steps {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; margin: 0.2rem 0 0.8rem;}\n@media (max-width: 760px) {.lt-steps {grid-template-columns: 1fr;}}\n.lt-step {border: 1px solid; border-radius: 10px; padding: 0.55rem 0.85rem; line-height: 1.35;}\n.lt-step .t {font-weight: 700; font-size: 0.92rem;}\n.lt-step .s {font-size: 0.85rem; opacity: 0.85;}\n.lt-hero {border: 1px solid; border-radius: 12px; padding: 0.9rem 1.2rem; margin-bottom: 0.6rem;}\n.lt-hero .k {font-size: 0.9rem; font-weight: 700; letter-spacing: 0.02em;}\n.lt-hero .a {font-size: 2.1rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums;}\n.lt-hero .d {font-size: 0.88rem; opacity: 0.85;}\n.lt-legend {display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; font-size: 0.82rem; margin: 0.3rem 0 0.2rem;}\n.lt-chip {display: inline-flex; align-items: center; gap: 0.35rem;}\n.lt-chip i {display: inline-block; width: 0.95rem; height: 0.95rem; border-radius: 3px; border: 1px solid rgba(128,128,128,0.4);}\n.lt-sec {font-weight: 700; font-size: 1.02rem; margin: 0.1rem 0 0.35rem;}\n.lt-muted {font-size: 0.85rem; opacity: 0.75;}\n<\/style>\n\"\"\"\n\n\ndef inject_css():\n    st.markdown(_CSS, unsafe_allow_html=True)\n\n\ndef section(title: str, caption: str | None = None):\n    st.markdown(f'<div class=\"lt-sec\">{escape(title)}<\/div>', unsafe_allow_html=True)\n    if caption:\n        st.caption(caption)\n\n\ndef steps_bar(steps: list[tuple[str, str, str]]):\n    \"\"\"steps: [(state, 제목, 설명)] — state ∈ ok|warn|err|idle\"\"\"\n    cards = []\n    for state, title, desc in steps:\n        bg, border = STATE_COLORS[state]\n        cards.append(\n            f'<div class=\"lt-step\" style=\"background:{bg};border-color:{border}\">'\n            f'<div class=\"t\">{STATE_ICON[state]} {escape(title)}<\/div><div class=\"s\">{escape(desc)}<\/div><\/div>'\n        )\n    st.markdown(f'<div class=\"lt-steps\">{\"\".join(cards)}<\/div>', unsafe_allow_html=True)\n\n\ndef result_hero(kind_label: str, amount_text: str, direction: str, state: str):\n    bg, border = STATE_COLORS[state]\n    st.markdown(\n        f'<div class=\"lt-hero\" style=\"background:{bg};border-color:{border}\">'\n        f'<div class=\"k\">{escape(kind_label)}<\/div><div class=\"a\">{escape(amount_text)}<\/div>'\n        f'<div class=\"d\">{escape(direction)}<\/div><\/div>',\n        unsafe_allow_html=True,\n    )\n\n\ndef legend():\n    items = [\n        (ROW_COLORS[\"review\"], \"검토 필요\"),\n        (ROW_COLORS[\"user\"], \"사용자 판단 반영\"),\n        (ROW_COLORS[\"dem\"], \"체선(Demurrage) 구간\"),\n        (\"transparent\", \"회색 글자 = 미반영(0%)\"),\n    ]\n    chips = \"\".join(f'<span class=\"lt-chip\"><i style=\"background:{c}\"><\/i>{escape(t)}<\/span>' for c, t in items)\n    st.markdown(f'<div class=\"lt-legend\">{chips}<\/div>', unsafe_allow_html=True)\n", "ui/tab_contract.py": "\"\"\"기능 1. 계약 조건 체크리스트.\"\"\"\nimport pandas as pd\nimport streamlit as st\n\nfrom ai import client as ai_client\nfrom ai.extract import file_to_payload\nfrom ai.parsers import parse_contract\nfrom core.constants import (\n    ALLOWED_ROUNDING,\n    BASIS_LABELS,\n    BERTH_TERMS,\n    CARGO_LABELS,\n    CARGO_RATES,\n    COUNTERPARTIES,\n    DISCH_PORTS,\n    LOAD_PORTS,\n    PORT_COUNTRY,\n    norm_cargo,\n    parse_rate,\n    OWNER_VESSELS,\n    SPOT,\n    DESPATCH_BASIS,\n    DOW_KR,\n    EXCEPTED_USED,\n    EXCEPTION_LABELS,\n    LAYTIME_END_EVENTS,\n    LAYTIME_TERMS,\n    NOR_EARLY_MODES,\n    match_counterparty,\n    owner_of_vessel,\n)\nfrom core.contract import required_status\n\nfrom .state import contract_to_state, queue_state, record_ai_error, record_usage, state_to_contract\nfrom .style import section\n\n\ndef _meta(key):\n    ai = st.session_state.get(\"ai_contract\") or {}\n    return (ai.get(\"meta\") or {}).get(key)\n\n\n# 이번 실행에서 아직 입력되지 않은 필수 항목 키 (render 시작 시 계산) — 입력칸 라벨에 빨간 표시\n_MISSING: set[str] = set()\nMISSING_KEYS = {\"화물량 (B/L MT)\": \"cargo_qty\", \"하역률 (MT/day)\": \"rate_mt_day\", \"고정 Laytime (시간)\": \"fixed_laytime_hours\",\n                \"Demurrage 요율 (USD/day)\": \"demurrage_rate\", \"Despatch 비율\": \"despatch_ratio\",\n                \"Despatch 요율 (USD/day)\": \"despatch_rate\", \"Notice time\": \"notice_hours\", \"Laycan 시작\": \"laycan_start\",\n                \"Laycan 종료\": \"laycan_end\"}\nMISSING_TAG = \" :red[**● 필수 입력**]\"\n\n\ndef _missing_keys(missing: list[str]) -> set[str]:\n    keys = {MISSING_KEYS[m] for m in missing if m in MISSING_KEYS}\n    for ek, label in EXCEPTION_LABELS.items():\n        if f\"예외 반영률: {label}\" in missing:\n            keys.add(f\"exc_{ek}\")\n    return keys\n\n\ndef _lbl(key, text):\n    m = _meta(key)\n    if m and m.get(\"needs_review\"):\n        text = f\"{text} ⚠️\"\n    return text + (MISSING_TAG if key in _MISSING else \"\")\n\n\ndef _num_fmt(value, decimals: int) -> str:\n    \"\"\"1의 자리 이하가 없으면 소수점을 숨긴다 (예: 181,358 → '181358', 181,358.5 → '181358.500').\"\"\"\n    try:\n        return \"%.0f\" if float(value or 0).is_integer() else f\"%.{decimals}f\"\n    except (TypeError, ValueError):\n        return f\"%.{decimals}f\"\n\n\ndef _rate_text(r: float) -> str:\n    return f\"{r:,.0f}\" if float(r).is_integer() else f\"{r:,.2f}\"\n\n\ndef _help(key):\n    m = _meta(key)\n    if not m:\n        return None\n    src = m.get(\"source_clause\") or \"(원문에서 찾지 못함)\"\n    flag = \" · 검토 필요\" if m.get(\"needs_review\") else \"\"\n    return f\"AI 근거: {src}\\n\\n신뢰도: {m.get('confidence') or '-'}{flag}\"\n\n\ndef run_contract_ai(body: str, images: list[str]) -> None:\n    \"\"\"계약서 원문 → AI 해석 → 체크리스트에 채움 (미확정 상태). 탭과 사이드바 '불러오기' 에서 같이 사용.\"\"\"\n    if st.session_state.get(\"contract_locked\"):\n        st.warning(\"계약 조건이 확정(잠금)되어 있습니다. ① 탭에서 잠금을 해제한 뒤 다시 시도하세요.\")\n        return\n    try:\n        with st.spinner(\"조체선료 분석 모델로 계약 조항 해석 중…\"):\n            result = parse_contract(body, images)\n    except Exception as exc:\n        record_ai_error(exc)\n        st.error(f\"AI 분석 실패: {exc}\")\n        return\n    record_usage(result[\"usage\"])\n    result[\"confirmed\"] = False  # PRD §5-1: 사용자가 확인 후 '확정'할 때까지 결과는 '검토 필요'\n    st.session_state[\"ai_contract\"] = result\n    current = state_to_contract()\n    current.update(port_values_to_load_disch(result[\"values\"], current[\"port_type\"]))\n    for ek, rule in result[\"exceptions\"].items():\n        current[\"exceptions\"][ek].update(rule)\n    queue_state(contract_to_state(current))\n\n\ndef _ai_section():\n    with st.expander(\"🤖 계약서 원문으로 체크리스트 자동 채우기 (AI)\", expanded=False):\n        if not ai_client.is_available():\n            st.info(\"OPENAI_API_KEY 가 설정되지 않아 AI 기능을 사용할 수 없습니다. `.env` 또는 Streamlit Secrets 를 확인하세요. (수동 입력은 가능)\")\n            return\n        text = st.text_area(\"계약서 원문 (CP / 구매계약 Laytime·Demurrage 조항)\", height=220, key=\"contract_raw_text\")\n        up = st.file_uploader(\"또는 계약서 파일 (PDF / TXT)\", type=[\"pdf\", \"txt\"], key=\"contract_file\")\n        st.caption(\"⚠️ 입력한 계약서 내용은 OpenAI API 로 전송됩니다.\")\n        locked = st.session_state[\"contract_locked\"]\n        if locked:\n            st.caption(\"🔒 계약 조건이 확정되어 잠겨 있습니다. AI 로 다시 채우려면 먼저 잠금을 해제하세요.\")\n        if st.button(\"AI 분석 실행\", type=\"primary\", key=\"btn_ai_contract\", disabled=locked):\n            images = []\n            body = text or \"\"\n            if up is not None:\n                ftext, images = file_to_payload(up.name, up.getvalue())\n                body = (body + \"\\n\\n\" + ftext).strip()\n            if not body and not images:\n                st.warning(\"계약서 원문을 입력하거나 파일을 업로드하세요.\")\n                return\n            run_contract_ai(body, images)\n\n    ai = st.session_state.get(\"ai_contract\")\n    if ai:\n        n_review = sum(1 for m in ai[\"meta\"].values() if m.get(\"needs_review\"))\n        if ai.get(\"confirmed\"):\n            st.success(f\"AI 가 채운 체크리스트를 확정했습니다 (AI 검토 표시 {n_review}건 확인 완료).\")\n        else:\n            st.warning(f\"AI 가 체크리스트를 채웠습니다 — **아직 미확정**. ⚠️ 표시 항목 {n_review}건을 원문과 대조·수정한 뒤 \"\n                       \"아래 '🔒 계약 조건 확정'을 누르세요. 확정 전 정산 결과는 '검토 필요'로 표시됩니다. (항목 옆 ? 아이콘 = 근거 조항)\")\n        if ai.get(\"summary\"):\n            st.caption(f\"AI 요약: {ai['summary']}\")\n        with st.expander(f\"AI 추출 근거 ({len(ai['meta'])}개 항목 · 검토 필요 {n_review}건)\"):\n            rows = sorted(\n                (\n                    {\n                        \"검토\": \"⚠️\" if m.get(\"needs_review\") else \"\",\n                        \"항목\": k,\n                        \"값\": \"\" if m.get(\"value\") is None else str(m.get(\"value\")),\n                        \"신뢰도\": m.get(\"confidence\") or \"\",\n                        \"원문 근거\": m.get(\"source_clause\") or \"(원문에서 찾지 못함)\",\n                    }\n                    for k, m in ai[\"meta\"].items()\n                ),\n                key=lambda r: (r[\"검토\"] == \"\", r[\"항목\"]),\n            )\n            st.dataframe(pd.DataFrame(rows), hide_index=True, width=\"stretch\")\n            # 미확정 상태에서 지우면 확인 절차를 건너뛰게 되므로 확정 후에만 지울 수 있다\n            if st.button(\"AI 결과 표시 지우기\", disabled=not ai.get(\"confirmed\"),\n                         help=None if ai.get(\"confirmed\") else \"계약 조건을 확정한 뒤에 지울 수 있습니다.\"):\n                st.session_state[\"ai_contract\"] = None\n                st.rerun()\n\n\ndef port_values_to_load_disch(values: dict, port_type: str) -> dict:\n    \"\"\"AI 의 정산 항구(port)·상대 항구(other_port) → 선적항(load_port)·양하항(disch_port).\"\"\"\n    vals = dict(values)\n    load = vals.get(\"port_type\", port_type) == \"LOAD\"\n    if vals.get(\"port\"):\n        vals[\"load_port\" if load else \"disch_port\"] = vals.pop(\"port\")\n    if vals.get(\"other_port\"):\n        vals[\"disch_port\" if load else \"load_port\"] = vals.pop(\"other_port\")\n    vals.pop(\"port\", None)\n    vals.pop(\"other_port\", None)\n    return vals\n\n\ndef _status_banner(contract: dict):\n    filled, total, missing = required_status(contract)\n    if missing:\n        st.error(f\"**❗ 아직 입력하지 않은 필수 항목 {len(missing)}개** (필수 {filled}/{total} 입력) — 모두 입력해야 정산이 계산됩니다.\\n\\n\"\n                 + \"\\n\".join(f\"- {m}\" for m in missing)\n                 + \"\\n\\n아래 입력칸 중 :red[**● 필수 입력**] 표시가 있는 곳을 채우세요.\")\n    else:\n        st.success(f\"필수 항목 {total}/{total} 입력 완료 — ② NOR / SOF 탭으로 이동하세요.\")\n    return missing\n\n\ndef _confirm_bar(missing: list[str]):\n    \"\"\"PRD §5-1: 필드 확인·수정 후 '확정' 버튼으로 잠금. AI 로 채운 값은 확정해야 결과가 '확정 가능'이 된다.\"\"\"\n    ss = st.session_state\n    ai = ss.get(\"ai_contract\")\n    ai_pending = bool(ai) and not ai.get(\"confirmed\")\n    c1, c2 = st.columns([1, 3], vertical_alignment=\"center\")\n    if ss[\"contract_locked\"]:\n        if c1.button(\"🔓 잠금 해제 (수정)\", key=\"btn_contract_unlock\", width=\"stretch\"):\n            ss[\"contract_locked\"] = False\n            st.rerun()\n        c2.caption(\"🔒 계약 조건이 확정되어 잠겨 있습니다. 수정하려면 잠금을 해제하세요.\")\n        return\n    if c1.button(\"🔒 계약 조건 확정\", key=\"btn_contract_lock\", type=\"primary\", width=\"stretch\", disabled=bool(missing),\n                 help=\"필수 항목을 모두 입력해야 확정할 수 있습니다.\" if missing else None):\n        ss[\"contract_locked\"] = True\n        if ai:\n            ai[\"confirmed\"] = True\n        st.rerun()\n    if ai_pending:\n        c2.warning(\"AI 가 채운 값이 아직 확정되지 않았습니다. ⚠️ 항목을 원문과 대조한 뒤 확정하세요.\")\n    else:\n        c2.caption(\"값을 모두 확인했으면 확정해 잠그세요 (실수로 값이 바뀌는 것을 막습니다).\")\n\n\ndef render() -> dict:\n    ss = st.session_state\n    L = ss[\"contract_locked\"]  # 확정 잠금 — 위젯은 숨기지 않고 disabled 로만 잠근다 (REVIEW C1)\n    missing = _status_banner(state_to_contract())\n    _MISSING.clear()\n    _MISSING.update(_missing_keys(missing))\n    _confirm_bar(missing)\n    _ai_section()\n\n    # ① 가장 먼저: 선적항 / 양하항 조체선료 (항 구분에 따라 이후 입력 항목 이름·Excel 양식이 정해진다)\n    with st.container(border=True):\n        section(\"정산 구분\", \"선적항 조체선료인지, 양하항 조체선료인지 먼저 선택하세요.\")\n        c1, c2 = st.columns([1.3, 1])\n        c1.radio(_lbl(\"port_type\", \"조체선료 구분\"), [\"LOAD\", \"DISCH\"], disabled=L, key=\"c_port_type\", horizontal=True,\n                 format_func=lambda x: \"🚢 선적항 조체선료\" if x == \"LOAD\" else \"⚓ 양하항 조체선료\", help=_help(\"port_type\"))\n        c2.radio(_lbl(\"basis\", \"정산 기준\"), list(BASIS_LABELS), disabled=L, key=\"c_basis\", horizontal=True,\n                 format_func=BASIS_LABELS.get, help=_help(\"basis\"))\n\n    with st.container(border=True):\n        section(\"기본 정보\")\n        cp = ss[\"c_basis\"] == \"CP\"\n        # 정산 대상: 목록에서 고르거나 직접 입력 (목록에 없는 선사·공급사). 예전 값·AI 값은 목록 항목으로 맞춘다.\n        cur = ss[\"c_counterparty\"] = ss.get(\"c_counterparty\") or None  # \"\" 는 선택 안 함 (selectbox 옵션에 없는 값 방지)\n        options = list(COUNTERPARTIES[ss[\"c_basis\"]])\n        other_basis = \"SPA\" if cp else \"CP\"\n        if cur and cur not in options:\n            # 정산 기준을 바꿔 다른 기준의 목록 값이 남아 있으면 비우고, 그 밖의 값은 목록에 맞추거나 직접 입력 값으로 유지\n            cur = ss[\"c_counterparty\"] = (match_counterparty(cur, ss[\"c_basis\"])\n                                          or (None if match_counterparty(cur, other_basis) else cur))\n        if cp and not cur and owner_of_vessel(ss.get(\"c_vessel\")):\n            cur = ss[\"c_counterparty\"] = owner_of_vessel(ss.get(\"c_vessel\"))  # 선박으로 선사 자동 선택\n        if cur and cur not in options:\n            options.append(cur)\n        c1, c2, c3, c4 = st.columns(4)\n        c1.selectbox(\n            _lbl(\"counterparty\", \"정산 대상 (선사)\" if cp else \"정산 대상 (공급사)\"),\n            options, disabled=L, key=\"c_counterparty\", placeholder=\"선택 또는 직접 입력\", accept_new_options=True,\n            help=_help(\"counterparty\") or (\"선사를 고르면 선박 목록이 연동됩니다. 목록에 없으면 직접 입력 (SPOT = 기타 선사)\" if cp\n                                           else \"구매계약: 공급사 선택 또는 직접 입력\"),\n        )\n        owner = ss.get(\"c_counterparty\")\n        vessels = list(OWNER_VESSELS.get(owner, [])) if cp else []\n        vessel = ss.get(\"c_vessel\") or None\n        if vessel and cp and owner in OWNER_VESSELS and owner != SPOT and owner_of_vessel(vessel) not in (None, owner):\n            vessel = None  # 다른 선사의 선박이 남아 있으면 비운다 (선사를 바꾼 경우)\n        if vessel and vessel not in vessels:\n            vessels.append(vessel)  # 직접 입력한 선박도 목록에 유지\n        ss[\"c_vessel\"] = vessel\n        c2.selectbox(_lbl(\"vessel\", \"선박명\"), vessels, disabled=L, key=\"c_vessel\", accept_new_options=True,\n                     placeholder=\"직접 입력\" if (not cp or owner == SPOT or owner not in OWNER_VESSELS) else \"선택 또는 직접 입력\",\n                     help=_help(\"vessel\") or \"선사를 고르면 해당 선사 선박이 나옵니다. SPOT·목록에 없는 선박은 직접 입력하세요.\")\n        c3.text_input(_lbl(\"voyage\", \"항차 (Voyage)\"), disabled=L, key=\"c_voyage\", help=_help(\"voyage\") or \"예: 064R — LTC 의 NAME OF VESSEL 에 선박명과 함께 표시\")\n        cargo = ss[\"c_cargo_name\"] = norm_cargo(ss.get(\"c_cargo_name\"))\n        ca
