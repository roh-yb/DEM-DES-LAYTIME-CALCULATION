  <div id="loading">⚓ 조체선료 자동 정산 TOOL 을 불러오는 중입니다…<br /><small>처음 실행 시 1~2분 걸릴 수 있습니다 (인터넷 연결 필요).</small></div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    const options = {"requirements": ["pandas", "openpyxl", "holidays", "python-dotenv", "Pillow"], "entrypoint": "app.py", "files": {"app.py": "\"\"\"벌크선 조체선료(Demurrage/Despatch) 자동 정산 TOOL — Streamlit 진입점.\n\n실행: streamlit run app.py\n\"\"\"\nimport hmac\nimport json\nfrom datetime import datetime\nfrom decimal import Decimal\n\nimport streamlit as st\n\nimport config\nfrom ai import client as ai_client\nfrom ai.extract import file_to_payload\nfrom core.contract import normalize_contract, required_status\nfrom core.sample import (\n    CLAUDE_YB_ASSUMPTION,\n    PAN_DELIGHT_NOTE,\n    claude_yb_contract,\n    claude_yb_events,\n    pan_delight_contract,\n    pan_delight_events,\n    sample_contract,\n    sample_events,\n)\nfrom export.importer import read_excel\nfrom export.report import KIND_LABEL\nfrom ui import tab_contract, tab_result, tab_sof\nfrom ui.download import download\nfrom ui.style import inject_css, steps_bar\nfrom ui.state import (\n    apply_pending,\n    contract_to_state,\n    events_from_json,\n    ai_pending,\n    current_adjustment,\n    events_to_json,\n    init_state,\n    queue_state,\n    reset_ai_confirmation,\n)\n\nst.set_page_config(page_title=\"조체선료 자동 정산 TOOL\", page_icon=\"⚓\", layout=\"wide\")\n\n\ndef password_gate() -> bool:\n    pw = config.app_password()\n    if not pw or st.session_state.get(\"authed\"):\n        return True\n    st.title(\"⚓ 조체선료 자동 정산 TOOL\")\n    entered = st.text_input(\"접속 비밀번호\", type=\"password\")\n    if entered:\n        if hmac.compare_digest(entered, pw):\n            st.session_state[\"authed\"] = True\n            st.rerun()\n        st.error(\"비밀번호가 올바르지 않습니다.\")\n    return False\n\n\ndef _apply_work_data(data: dict, include_events: bool):\n    \"\"\"JSON 또는 이 앱이 내보낸 Excel 의 작업 내용 적용.\"\"\"\n    c = normalize_contract(data.get(\"contract\", data))\n    reset_ai_confirmation(sof=include_events)\n    queue_state(\n        contract_to_state(c),\n        events=events_from_json(data.get(\"events\", [])) if include_events else None,\n        holidays=c.get(\"holidays\") or [],\n        adjustment=data.get(\"adjustment\") if include_events else None,  # 수기 조정은 정산 건(SOF)과 함께만\n    )\n\n\ndef _import_file(up, ext: str, include_events: bool, doc_kind: str, contract: dict):\n    raw = up.getvalue()\n    if ext == \"json\":\n        try:\n            data = json.loads(raw.decode(\"utf-8\"))\n        except Exception as exc:\n            st.error(f\"파일을 읽을 수 없습니다: {exc}\")\n            return\n        _apply_work_data(data, include_events)\n        return\n    if ext in (\"xlsx\", \"xlsm\"):\n        try:\n            got = read_excel(raw, up.name)\n        except ValueError:\n            got = None  # LTC·작업 파일이 아닌 Excel (예: 엑셀 SOF) → AI 판독으로 처리\n        except Exception as exc:\n            st.error(f\"Excel 을 읽을 수 없습니다: {exc}\")\n            return\n        if got and got[\"kind\"] == \"app\":\n            _apply_work_data(got[\"data\"], include_events)\n            return\n        if got and got[\"kind\"] == \"ltc\":\n            st.session_state[\"sample_note\"] = f\"회사 LTC Excel 에서 불러옴 ({', '.join(got['found'])}) — Laycan·예외 항목·SOF 는 확인해 입력하세요.\"\n            reset_ai_confirmation(sof=False)\n            queue_state(contract_to_state(normalize_contract({**contract, **got[\"contract\"]})))\n            return\n        doc_kind = \"SOF / NOR\"\n    if not ai_client.is_available():\n        st.error(\"PDF·이미지 판독에는 OPENAI_API_KEY 가 필요합니다.\")\n        return\n    try:\n        text, images = file_to_payload(up.name, raw)\n    except Exception as exc:\n        st.error(f\"파일을 읽을 수 없습니다: {exc}\")\n        return\n    if doc_kind == \"계약서\":\n        tab_contract.run_contract_ai(text, images)\n    else:\n        tab_sof.run_sof_ai(contract, text, images, \"교체\")\n\n\ndef sidebar(contract_fn):\n    with st.sidebar:\n        st.subheader(\"🤖 AI 상태\")\n        models = f\"분석 모델: `{config.openai_model()}`\\n\\n비전 모델: `{config.openai_vision_model()}`\"\n        if ai_client.is_available() and st.session_state.get(\"ai_error\"):\n            st.error(f\"AI 호출 오류\\n\\n{st.session_state['ai_error']}\\n\\n{models}\")\n        elif ai_client.is_available():\n            st.success(f\"API 키 설정됨 (연결은 AI 실행 시 확인)\\n\\n{models}\")\n            u = st.session_state[\"ai_usage\"]\n            if u[\"calls\"]:\n                st.caption(f\"이번 세션 AI 호출 {u['calls']}회 · 입력 {u['prompt_tokens']:,} / 출력 {u['completion_tokens']:,} 토큰\")\n        else:\n            st.warning(\"AI 미연결 — `.env` 또는 Secrets 에 OPENAI_API_KEY 를 설정하세요. 수동 입력·계산은 사용 가능합니다.\")\n\n        st.divider()\n        st.subheader(\"📂 샘플\")\n        samples = {\n            \"PAN DELIGHT 064R (실제 정산 · 체선)\": (pan_delight_contract, pan_delight_events, PAN_DELIGHT_NOTE),\n            \"MV CLAUDE YB (실제 SOF · 가정 계약)\": (claude_yb_contract, claude_yb_events, CLAUDE_YB_ASSUMPTION),\n            \"MV SAMPLE STAR (데모 · 체선 발생)\": (sample_contract, sample_events, \"데모용 가상 데이터입니다.\"),\n        }\n        choice = st.selectbox(\"샘플 선택\", list(samples), label_visibility=\"collapsed\")\n        if st.button(\"샘플 불러오기\", width=\"stretch\"):\n            c_fn, e_fn, note = samples[choice]\n            reset_ai_confirmation()\n            st.session_state[\"sample_note\"] = note\n            queue_state(contract_to_state(c_fn()), events=e_fn(), holidays=[])\n\n        st.divider()\n        st.subheader(\"💾 템플릿 · 작업 파일\")\n        contract, events = contract_fn()\n        payload = {\"saved_at\": datetime.now().isoformat(timespec=\"seconds\"), \"contract\": contract, \"events\": events_to_json(events),\n                   \"adjustment\": current_adjustment()}\n        fname = f\"laytime_{(contract.get('counterparty') or ' '.join(x for x in (contract.get('vessel'), contract.get('voyage')) if x) or 'template').replace(' ', '_')}.json\"\n        download(st, \"💾 현재 계약+SOF 저장 (JSON)\", json.dumps(payload, ensure_ascii=False, indent=2, default=str),\n                 file_name=fname, mime=\"application/json\")\n        up = st.file_uploader(\"불러오기 (JSON · Excel · PDF · 이미지 · TXT)\", key=\"template_upload\",\n                              type=[\"json\", \"xlsx\", \"xlsm\", \"pdf\", \"png\", \"jpg\", \"jpeg\", \"webp\", \"txt\", \"csv\"],\n                              help=\"JSON·이 앱의 Excel = 작업 그대로 복원 · 회사 LTC Excel = 계약 조건 · PDF/이미지 = 계약서 또는 SOF 를 AI 로 판독\")\n        ext = up.name.lower().rsplit(\".\", 1)[-1] if up is not None else \"\"\n        include_events = st.checkbox(\"SOF 이벤트도 불러오기\", value=False, disabled=ext not in (\"\", \"json\", \"xlsx\", \"xlsm\"),\n                                     help=\"JSON·이 앱의 Excel: 해제 시 계약 조건만 불러옵니다 (공급사·선사별 템플릿 용도)\")\n        doc_kind = st.radio(\"PDF·이미지 문서 종류\", [\"계약서\", \"SOF / NOR\"], horizontal=True, key=\"import_doc_kind\",\n                            disabled=ext in (\"\", \"json\", \"xlsx\", \"xlsm\"),\n                            help=\"PDF·이미지·TXT 는 AI 로 읽어 계약서 → ① 체크리스트, SOF → ② 이벤트 표에 채웁니다 (미확정 상태)\")\n        if up is not None and st.button(\"불러오기 적용\", width=\"stretch\"):\n            _import_file(up, ext, include_events, doc_kind, contract)\n        st.divider()\n        with st.popover(\"🗑️ 전체 초기화\", width=\"stretch\"):\n            st.warning(\"입력한 계약 조건, SOF 이벤트, 검토 판단이 모두 지워집니다. 필요하면 먼저 JSON 으로 저장하세요.\")\n            if st.button(\"초기화 실행\", type=\"primary\", width=\"stretch\"):\n                st.session_state.clear()\n                st.rerun()\n        st.caption(\"계산 규칙: 분 단위 · 1일 = 24시간 · 금액 pro rata · USD 0.01 반올림. AI 는 해석만, 계산은 규칙 엔진이 수행합니다.\")\n\n\nTAB_BASE = [\"① 계약 조건\", \"② NOR / SOF\", \"③ 정산 결과\"]\nBADGE = {\"ok\": \"✅\", \"err\": \"❌\", \"idle\": \"\"}\n\n\ndef compute_status(contract, events, errors, warnings, result, pending=()) -> list[tuple[str, str, str]]:\n    \"\"\"[(state, 제목, 설명)] × 3 — 상단 진행 카드와 탭 배지에 사용.\"\"\"\n    filled, total, missing = required_status(contract)\n    if missing:\n        c = (\"err\", f\"필수 {filled}/{total} 입력 · 누락 {len(missing)}개\")\n    else:\n        c = (\"ok\", f\"필수 {total}/{total} 입력 완료\")\n    if not events:\n        s = (\"idle\", \"이벤트 없음 — SOF 를 가져오거나 입력하세요\")\n    elif errors:\n        s = (\"err\", f\"이벤트 {len(events)}건 · 오류 {len(errors)} · 경고 {len(warnings)}\")\n    elif warnings:\n        s = (\"warn\", f\"이벤트 {len(events)}건 · 경고 {len(warnings)}\")\n    else:\n        s = (\"ok\", f\"이벤트 {len(events)}건 · 검증 통과\")\n    if result is None:\n        r = (\"idle\", \"계산 대기 — ①·② 를 완료하세요\")\n    else:\n        final = result[\"amount\"] + Decimal(str(current_adjustment()[\"usd\"]))\n        money = f\"{KIND_LABEL[result['kind']].split(' ')[0]} USD {final:,.2f}\"\n        todo = ([f\"검토 필요 {result['review_count']}건\"] if result[\"review_count\"] else []) + \\\n               ([f\"AI 미확정 {len(pending)}건\"] if pending else [])\n        r = (\"warn\", \" · \".join([money, *todo])) if todo else (\"ok\", f\"{money} · 확정 가능\")\n    return [(c[0], TAB_BASE[0], c[1]), (s[0], TAB_BASE[1], s[1]), (r[0], TAB_BASE[2], r[1])]\n\n\ndef _badge(state: str, desc: str) -> str:\n    if state == \"warn\":\n        n = next((tok for tok in desc.replace(\"·\", \" \").split() if tok.isdigit()), \"\")\n        return f\"⚠️{n}\"\n    return BADGE[state]\n\n\ndef tabs_with_badges(status):\n    \"\"\"상태 배지가 붙은 탭. 라벨이 바뀌어도 사용자가 보던 탭을 유지한다.\"\"\"\n    labels = [f\"{base} {_badge(st_, desc)}\".strip() for base, (st_, _t, desc) in zip(TAB_BASE, status)]\n    ss = st.session_state\n    prev = ss.get(\"main_tab\")\n    # 어느 탭이든 라벨(배지)이 바뀌면 Streamlit 은 새 위젯으로 보고 첫 탭으로 돌아간다 (보던 탭의 라벨이 그대로여도).\n    # 그래서 라벨 목록이 바뀐 실행에서는 위젯 생성 전에 보던 탭을 ①②③ 접두어로 다시 지정한다.\n    if prev not in labels or ss.get(\"_tab_labels\") != labels:\n        idx = next((i for i, b in enumerate(TAB_BASE) if prev and prev.startswith(b)), 0)\n        ss[\"main_tab\"] = labels[idx]\n        ss[\"_tab_labels\"] = labels\n    return st.tabs(labels, key=\"main_tab\", on_change=\"rerun\")\n\n\ndef main():\n    if not password_gate():\n        return\n    inject_css()\n    init_state()\n    apply_pending()\n\n    st.title(\"⚓ 벌크선 조체선료 자동 정산 TOOL\")\n    st.caption(\"계약 조건과 SOF 를 입력하면 Laytime Statement 를 자동 생성합니다. 담당자는 '검토 필요' 항목만 확인하세요.\")\n    status = st.session_state.get(\"_status\") or [(\"idle\", b, \"확인 중…\") for b in TAB_BASE]\n    steps_bar(status)\n    if st.session_state.get(\"sample_note\"):\n        st.info(\"📌 샘플 불러옴 — \" + st.session_state[\"sample_note\"])\n\n    t1, t2, t3 = tabs_with_badges(status)\n    with t1:\n        contract = tab_contract.render()\n    with t2:\n        events, errors, warnings = tab_sof.render(contract)\n    with t3:\n        result = tab_result.render(contract, events, errors)\n\n    sidebar(lambda: (contract, events))\n\n    # 입력 결과로 상태가 바뀌었으면 상단 카드·탭 배지를 갱신하기 위해 한 번 더 그린다\n    new_status = compute_status(contract, events, errors, warnings, result, ai_pending(events))\n    if new_status != st.session_state.get(\"_status\"):\n        st.session_state[\"_status\"] = new_status\n        st.rerun()\n\n\nmain()\n", "config.py": "\"\"\"환경 설정 로더.\n\n우선순위: Streamlit Cloud Secrets(st.secrets) → .env / 환경변수 → 기본값\n\"\"\"\nimport os\nfrom pathlib import Path\n\nfrom dotenv import load_dotenv\n\nload_dotenv(Path(__file__).parent / \".env\")\n\n\ndef get_setting(key: str, default: str | None = None) -> str | None:\n    try:\n        import streamlit as st\n\n        if key in st.secrets:\n            value = st.secrets[key]\n            return str(value) if value not in (None, \"\") else default\n    except Exception:\n        # secrets.toml 이 없는 로컬 환경 등\n        pass\n    value = os.getenv(key)\n    return value if value not in (None, \"\") else default\n\n\ndef openai_api_key() -> str | None:\n    return get_setting(\"OPENAI_API_KEY\")\n\n\ndef openai_model() -> str:\n    \"\"\"조체선료 분석 모델 ID (fine-tuned 모델 ID 사용 가능: ft:...).\"\"\"\n    return get_setting(\"OPENAI_MODEL\", \"gpt-4o\")\n\n\ndef openai_vision_model() -> str:\n    \"\"\"스캔본/이미지 SOF 파싱용 모델. 미설정 시 OPENAI_MODEL 사용.\"\"\"\n    return get_setting(\"OPENAI_VISION_MODEL\", openai_model())\n\n\ndef app_password() -> str | None:\n    return get_setting(\"APP_PASSWORD\")\n", "core/__init__.py": "", "core/calendar_util.py": "\"\"\"항구 국가 공휴일 캘린더 (holidays 라이브러리).\"\"\"\nfrom datetime import date\n\n\ndef country_holidays(country: str, years: list[int]) -> list[dict]:\n    \"\"\"[{\"date\": \"YYYY-MM-DD\", \"name\": str}] — 지원하지 않는 국가 코드면 빈 목록.\"\"\"\n    try:\n        import holidays\n    except ImportError:\n        return []\n    try:\n        cal = holidays.country_holidays(country.strip().upper(), years=sorted(set(years)))\n    except (NotImplementedError, KeyError, AttributeError):\n        return []\n    items = sorted(cal.items())\n    return [{\"date\": d.isoformat(), \"name\": str(n)} for d, n in items if isinstance(d, date)]\n", "core/constants.py": "\"\"\"이벤트 코드, 예외 항목, 계약 선택지 정의.\"\"\"\nimport re\n\nEVENT_TYPES: dict[str, str] = {\n    \"ARRIVAL\": \"도착 (EOSP/Arrived)\",\n    \"NOR_TENDERED\": \"NOR 제출\",\n    \"NOR_ACCEPTED\": \"NOR 수리\",\n    \"ANCHORED\": \"투묘\",\n    \"FREE_PRATIQUE\": \"검역 완료 (Free pratique)\",\n    \"PILOT_ON\": \"도선사 승선\",\n    \"ALL_FAST\": \"접안 완료 (All fast)\",\n    \"COMMENCED\": \"하역 개시\",\n    \"COMPLETED\": \"하역 완료\",\n    \"DOCS_ON_BOARD\": \"서류 선적 완료\",\n    \"SHIFTING\": \"이동 (Shifting)\",\n    \"DRAFT_SURVEY\": \"흘수 검정 (Draft survey)\",\n    \"WEATHER\": \"악천후 (Rain/Weather)\",\n    \"BREAKDOWN_SHIP\": \"선박 장비 고장\",\n    \"BREAKDOWN_SHORE\": \"육상 장비 고장\",\n    \"STRIKE\": \"파업\",\n    \"STOPPAGE_OTHER\": \"기타 중단\",\n    \"OTHER\": \"기타 (정보)\",\n}\n\n# 구간(From~To) 이벤트 → 계약 예외 항목 키 (None = 계약 근거 없음, 검토 필요)\nINTERVAL_EVENTS: dict[str, str | None] = {\n    \"SHIFTING\": \"shifting\",\n    \"DRAFT_SURVEY\": \"draft_survey\",\n    \"WEATHER\": \"weather\",\n    \"BREAKDOWN_SHIP\": \"breakdown_ship\",\n    \"BREAKDOWN_SHORE\": \"breakdown_shore\",\n    \"STRIKE\": \"strike\",\n    \"STOPPAGE_OTHER\": None,\n}\n\n# 시점 이벤트 (시작 일시만 사용, 종료 없음)\nPOINT_EVENTS: tuple[str, ...] = tuple(c for c in EVENT_TYPES if c not in INTERVAL_EVENTS)\n\nEXCEPTION_LABELS: dict[str, str] = {\n    \"shifting\": \"Shifting (앵커리지→부두 이동 등)\",\n    \"draft_survey\": \"Draft survey\",\n    \"weather\": \"악천후 (WWD)\",\n    \"breakdown_ship\": \"선박 장비 고장\",\n    \"breakdown_shore\": \"육상 장비 고장\",\n    \"strike\": \"파업\",\n}\n\n# 정산 기준 (내부 코드 \"SPA\" 는 기존 템플릿 호환을 위해 유지, 화면 표기는 '구매계약')\nBASIS_LABELS = {\"CP\": \"Charter Party\", \"SPA\": \"구매계약\"}\nBASIS_LABELS_EN = {\"CP\": \"Charter Party\", \"SPA\": \"Purchase Contract\"}\n\n# 정산 기준별 정산 대상\n# Charter Party 선사 → 선박 (선사를 고르면 선박 목록이 연동됨). SPOT 은 선박을 직접 입력.\nSPOT = \"SPOT\"\nOWNER_VESSELS: dict[str, list[str]] = {\n    \"팬오션\": [\"PAN ESPERANZA\", \"PAN DELIGHT\", \"PAN HOPE\"],\n    \"H-LINE\": [\"HL OCEANIC\", \"HL SUNNY\"],\n    \"K-LINE\": [\"HYUNDAI DANGJIN\"],\n    \"대한해운\": [\"SM GUARDIAN\"],\n    \"폴라리스\": [\"SOLAR MAJESTY\"],\n    \"HMM\": [\"GLOBAL ENTERPRISE\", \"GLOBAL PIONEER\"],\n    SPOT: [],\n}\nOWNER_ALIASES = {\"PAN OCEAN\": \"팬오션\", \"PANOCEAN\": \"팬오션\", \"H LINE\": \"H-LINE\", \"HLINE\": \"H-LINE\", \"K LINE\": \"K-LINE\",\n                 \"KLINE\": \"K-LINE\", \"KAWASAKI\": \"K-LINE\", \"KOREA LINE\": \"대한해운\", \"SM\": \"대한해운\", \"POLARIS\": \"폴라리스\",\n                 \"HYUNDAI MERCHANT MARINE\": \"HMM\"}\n\n# 화물 (목록 외 화물은 직접 입력 = 기타)\nCARGO_LABELS = {\"IRON ORE\": \"철광석 (IRON ORE)\", \"COAL\": \"석탄 (COAL)\"}\nCARGO_ALIASES = {\"철광석\": \"IRON ORE\", \"IRON ORE FINES\": \"IRON ORE\", \"IRON ORE LUMP\": \"IRON ORE\", \"석탄\": \"COAL\",\n                 \"COKING COAL\": \"COAL\", \"THERMAL COAL\": \"COAL\", \"STEAM COAL\": \"COAL\"}\n\n# 화물별 하역률 선택 목록 (MT/day) — 목록 외 값은 직접 입력\nCARGO_RATES: dict[str, list[float]] = {\n    \"IRON ORE\": [60000.0, 45000.0, 30000.0, 15000.0],\n    \"COAL\": [45000.0, 30000.0, 15000.0, 8000.0],\n}\n\n\ndef parse_rate(value) -> float | None:\n    \"\"\"하역률 선택/직접 입력값 → 숫자 ('60,000', '45000 MT', 30000.0). 0 이하·해석 불가 → None.\"\"\"\n    if value is None or isinstance(value, bool):\n        return None\n    try:\n        n = float(value) if isinstance(value, (int, float)) else float(str(value).upper().replace(\",\", \"\").replace(\"MT\", \"\").replace(\"/DAY\", \"\").strip())\n    except ValueError:\n        return None\n    return n if n > 0 else None\n\n\n# 화물별 주요 선적항 추천 (이름은 회사 LTC 표기 'PORT HEDLAND, AUS' 형식) → 휴일 캘린더 국가 코드\nLOAD_PORTS: dict[str, dict[str, str]] = {\n    \"IRON ORE\": {\n        \"PORT HEDLAND, AUS\": \"AU\", \"CAPE LAMBERT, AUS\": \"AU\", \"DAMPIER, AUS\": \"AU\", \"PONTA DA MADEIRA, BRAZIL\": \"BR\",\n        \"TUBARAO, BRAZIL\": \"BR\", \"SALDANHA BAY, SOUTH AFRICA\": \"ZA\", \"PORT CARTIER, CANADA\": \"CA\", \"SEPT-ILES, CANADA\": \"CA\",\n    },\n    \"COAL\": {\n        \"NEWCASTLE, AUS\": \"AU\", \"HAY POINT, AUS\": \"AU\", \"DALRYMPLE BAY, AUS\": \"AU\", \"GLADSTONE, AUS\": \"AU\",\n        \"ABBOT POINT, AUS\": \"AU\", \"RICHARDS BAY, SOUTH AFRICA\": \"ZA\", \"ROBERTS BANK, CANADA\": \"CA\",\n        \"VOSTOCHNY, RUSSIA\": \"RU\", \"TABONEO, INDONESIA\": \"ID\",\n    },\n}\nDISCH_PORTS: dict[str, str] = {\"PYEONGTAEK-DANGJIN, KOREA\": \"KR\", \"GWANGYANG, KOREA\": \"KR\", \"POHANG, KOREA\": \"KR\"}\nPORT_COUNTRY: dict[str, str] = {**DISCH_PORTS, **{p: cc for ports in LOAD_PORTS.values() for p, cc in ports.items()}}\n\n\ndef norm_cargo(value) -> str | None:\n    \"\"\"'철광석', 'iron ore fines' → 'IRON ORE'. 목록 외 화물은 입력값 그대로 (대문자).\"\"\"\n    if not value or not str(value).strip():\n        return None\n    v = \" \".join(str(value).strip().upper().split())\n    return v if v in CARGO_LABELS else CARGO_ALIASES.get(v) or CARGO_ALIASES.get(str(value).strip()) or v\n\n\n# 목록에 없는 선사·공급사도 화면에서 직접 입력할 수 있다 (selectbox accept_new_options)\nCOUNTERPARTIES: dict[str, list[str]] = {\n    \"CP\": list(OWNER_VESSELS),\n    \"SPA\": [\"BHP\", \"VALE\", \"RIO TINTO\", \"FMG\", \"KUMBA\", \"ASSMANG\", \"SAMARCO\"],\n}\n\n\ndef _norm(value) -> str:\n    return \" \".join(str(value).upper().replace(\"-\", \" \").replace(\"_\", \" \").split())\n\n\ndef owner_of_vessel(vessel) -> str | None:\n    \"\"\"선박명 → 선사 (목록에 있을 때만).\"\"\"\n    if not vessel:\n        return None\n    n = _norm(vessel).replace(\"M/V \", \"\").replace(\"MV \", \"\").strip('\" ')\n    for owner, vessels in OWNER_VESSELS.items():\n        if any(_norm(v) == n for v in vessels):\n            return owner\n    return None\n\n\ndef match_counterparty(value, basis: str) -> str | None:\n    \"\"\"입력값(템플릿·AI 결과)을 해당 정산 기준의 정산 대상 목록 항목으로 맞춘다. 없으면 None (화면에서 직접 입력 값으로 유지).\"\"\"\n    if not value:\n        return None\n    norm = _norm(value)\n    options = COUNTERPARTIES.get(basis, [])\n    for opt in options:\n        if norm == _norm(opt):\n            return opt\n    if basis == \"CP\":\n        for alias, owner in OWNER_ALIASES.items():\n            if norm == alias or norm.startswith(alias + \" \"):\n                return owner\n        owner = owner_of_vessel(value)  # 예전 템플릿은 선박명(PAN HOPE 등)을 정산 대상으로 저장했음\n        if owner:\n            return owner\n    for opt in options:  # \"BHP Billiton\", \"Vale S.A.\", \"Rio Tinto Shipping\" 등\n        if len(_norm(opt)) >= 3 and (_norm(opt) in norm or norm in _norm(opt)):\n            return opt\n    return None\n\n\nLAYTIME_TERMS = {\n    \"SHINC\": \"SHINC (일요일·휴일 포함)\",\n    \"SHEX\": \"SHEX (일요일·휴일 제외)\",\n    \"SSHEX\": \"SSHEX (토·일요일·휴일 제외)\",\n}\nEXCEPTED_USED = {\"EIU\": \"EIU (사용해도 미반영)\", \"UU\": \"UU (사용 시 반영)\"}\nBERTH_TERMS = {\n    \"WIBON\": \"WIBON\",\n    \"WIPON\": \"WIPON\",\n    \"WIFPON\": \"WIFPON\",\n    \"WCCON\": \"WCCON\",\n    \"PORT\": \"Port charter\",\n    \"BERTH\": \"Berth charter (접안 후 NOR 유효)\",\n}\nLAYTIME_END_EVENTS = {\"COMPLETED\": \"하역 완료\", \"DOCS_ON_BOARD\": \"서류 선적 완료\"}\nNOR_EARLY_MODES = {\n    \"NOT_BEFORE_LAYCAN\": \"NOR+Notice 와 Laycan 시작 중 늦은 시점 (laytime not to commence before laycan)\",\n    \"DEEMED_AT_LAYCAN\": \"Laycan 시작에 NOR 제출 간주 → + Notice time\",\n}\nDESPATCH_BASIS = {\"WTS\": \"Working time saved\", \"ATS\": \"All time saved\"}\nALLOWED_ROUNDING = {\n    \"ROUND\": \"분 단위 반올림\",\n    \"DOWN\": \"분 단위 절사\",\n    \"UP\": \"분 단위 올림\",\n    \"EXACT\": \"반올림 없음 (소수 분 유지)\",\n}\nDOW_KR = [\"월\", \"화\", \"수\", \"목\", \"금\", \"토\", \"일\"]\n\n_LABEL_RE = re.compile(r\"\\[([A-Z_]+)\\]\\s*$\")\n\n\ndef event_label(code: str) -> str:\n    return f\"{EVENT_TYPES.get(code, code)} [{code}]\"\n\n\nEVENT_LABELS = [event_label(c) for c in EVENT_TYPES]\n\n\ndef code_from_label(value) -> str | None:\n    if value is None or (isinstance(value, float) and value != value):\n        return None\n    s = str(value).strip()\n    m = _LABEL_RE.search(s)\n    if m:\n        return m.group(1)\n    return s if s in EVENT_TYPES else None\n", "core/contract.py": "\"\"\"계약 조건(체크리스트) 기본값 및 필수 항목 검증.\n\n계약 조건은 JSON 직렬화 가능한 dict 로 관리한다 (템플릿 저장/불러오기 용이).\n\"\"\"\nimport copy\n\nfrom .constants import EXCEPTION_LABELS\nfrom .timeutil import parse_dt\n\nDEFAULT_EXCEPTIONS = {\n    \"shifting\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"\"},\n    \"draft_survey\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"\"},\n    \"weather\": {\"applies\": False, \"counted_pct\": 0.0, \"clause\": \"\"},\n    \"breakdown_ship\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"\"},\n    \"breakdown_shore\": {\"applies\": False, \"counted_pct\": 0.0, \"clause\": \"\"},\n    \"strike\": {\"applies\": False, \"counted_pct\": 0.0, \"clause\": \"\"},\n}\n\nDEFAULT_CONTRACT = {\n    # 기본\n    \"basis\": \"CP\",  # CP / SPA\n    \"port_type\": \"LOAD\",  # LOAD / DISCH\n    \"vessel\": \"\",\n    \"voyage\": \"\",  # 항차 (회사 LTC 양식 'NAME OF VESSEL' = 선박명 + 항차)\n    \"load_port\": \"\",  # 선적항 — 화면·LTC 모두 항상 선적항이 먼저, 양하항이 뒤\n    \"disch_port\": \"\",  # 양하항\n    \"port\": \"\",  # 정산 항구 (port_type 이 가리키는 항) — load_port/disch_port 에서 자동 계산 (이전 템플릿 호환)\n    \"other_port\": \"\",  # 상대 항구 — 자동 계산\n    \"cargo_name\": \"\",  # 화물명 (IRON ORE, COAL …)\n    \"country\": \"KR\",\n    \"counterparty\": \"\",\n    \"laycan_start\": None,  # \"YYYY-MM-DD HH:MM\"\n    \"laycan_end\": None,\n    # 물량·Laytime\n    \"cargo_qty\": 0.0,\n    \"laytime_mode\": \"RATE\",  # RATE / FIXED\n    \"rate_mt_day\": 0.0,\n    \"fixed_laytime_hours\": 0.0,\n    \"allowed_rounding\": \"ROUND\",\n    \"laytime_terms\": \"SHINC\",  # SHINC / SHEX / SSHEX\n    \"excepted_used\": \"EIU\",  # EIU / UU\n    \"weekend_start_dow\": 6,  # 0=월 … 6=일\n    \"weekend_start_time\": \"00:00\",\n    \"weekend_end_dow\": 0,\n    \"weekend_end_time\": \"00:00\",\n    # 요율\n    \"demurrage_rate\": 0.0,\n    \"despatch_mode\": \"RATIO\",  # RATIO / AMOUNT\n    \"despatch_ratio\": 0.5,\n    \"despatch_rate\": 0.0,\n    \"despatch_basis\": \"WTS\",  # WTS / ATS\n    # NOR\n    \"nor_condition\": \"\",\n    \"notice_hours\": 6.0,\n    \"commence_if_sooner\": True,\n    \"nor_before_laycan_counts\": False,\n    \"nor_early_mode\": \"NOT_BEFORE_LAYCAN\",  # Laycan 이전 NOR 처리 (NOR_EARLY_MODES)\n    # Berth / 종료\n    \"berth_terms\": \"WIBON\",\n    \"laytime_end_event\": \"COMPLETED\",\n    \"oodaod\": True,\n    # 조항 번호 (근거 표시용)\n    \"clause_laytime\": \"\",\n    \"clause_nor\": \"\",\n    \"clause_demurrage\": \"\",\n    # 예외\n    \"exceptions\": DEFAULT_EXCEPTIONS,\n    # 휴일 [{\"date\": \"YYYY-MM-DD\", \"name\": \"...\"}]\n    \"holidays\": [],\n}\n\n\ndef default_contract() -> dict:\n    return copy.deepcopy(DEFAULT_CONTRACT)\n\n\ndef normalize_contract(c: dict) -> dict:\n    \"\"\"누락 키를 기본값으로 채운다 (템플릿/AI 결과 호환).\"\"\"\n    out = default_contract()\n    for k, v in (c or {}).items():\n        if k == \"exceptions\" and isinstance(v, dict):\n            for ek, ev in v.items():\n                if ek in out[\"exceptions\"] and isinstance(ev, dict):\n                    out[\"exceptions\"][ek].update(ev)\n        elif k in out:\n            out[k] = v\n    # 선적항·양하항이 정본. 예전 템플릿(port/other_port 만 있음)은 항 구분에 따라 옮긴다.\n    load = out[\"port_type\"] == \"LOAD\"\n    if not out[\"load_port\"] and not out[\"disch_port\"] and (out[\"port\"] or out[\"other_port\"]):\n        out[\"load_port\"], out[\"disch_port\"] = (out[\"port\"], out[\"other_port\"]) if load else (out[\"other_port\"], out[\"port\"])\n    out[\"port\"], out[\"other_port\"] = (out[\"load_port\"], out[\"disch_port\"]) if load else (out[\"disch_port\"], out[\"load_port\"])\n    return out\n\n\ndef required_status(c: dict) -> tuple[int, int, list[str]]:\n    \"\"\"(입력된 필수 항목 수, 필수 항목 총수, 누락 라벨).\"\"\"\n    # 화물량·하역률(또는 고정 Laytime) + Demurrage + Despatch + Notice + Laycan 시작·종료\n    total = (2 if c[\"laytime_mode\"] == \"RATE\" else 1) + 5\n    total += sum(1 for r in c[\"exceptions\"].values() if r.get(\"applies\"))\n    missing = missing_fields(c)\n    return total - len(missing), total, missing\n\n\ndef missing_fields(c: dict) -> list[str]:\n    \"\"\"계산에 필요한 필수 항목 중 누락된 것의 라벨 목록.\"\"\"\n    missing = []\n    if c[\"laytime_mode\"] == \"RATE\":\n        if not c.get(\"cargo_qty\") or float(c[\"cargo_qty\"]) <= 0:\n            missing.append(\"화물량 (B/L MT)\")\n        if not c.get(\"rate_mt_day\") or float(c[\"rate_mt_day\"]) <= 0:\n            missing.append(\"하역률 (MT/day)\")\n    else:\n        if not c.get(\"fixed_laytime_hours\") or float(c[\"fixed_laytime_hours\"]) <= 0:\n            missing.append(\"고정 Laytime (시간)\")\n    if not c.get(\"demurrage_rate\") or float(c[\"demurrage_rate\"]) <= 0:\n        missing.append(\"Demurrage 요율 (USD/day)\")\n    if c[\"despatch_mode\"] == \"RATIO\":\n        if c.get(\"despatch_ratio\") is None or float(c[\"despatch_ratio\"]) < 0:\n            missing.append(\"Despatch 비율\")\n    elif c.get(\"despatch_rate\") is None or float(c[\"despatch_rate\"]) < 0:\n        missing.append(\"Despatch 요율 (USD/day)\")\n    if c.get(\"notice_hours\") is None:\n        missing.append(\"Notice time\")\n    if not parse_dt(c.get(\"laycan_start\")):\n        missing.append(\"Laycan 시작\")\n    if not parse_dt(c.get(\"laycan_end\")):\n        missing.append(\"Laycan 종료\")\n    for ek, rule in c[\"exceptions\"].items():\n        if rule.get(\"applies\") and rule.get(\"counted_pct\") is None:\n            missing.append(f\"예외 반영률: {EXCEPTION_LABELS[ek]}\")\n    return missing\n", "core/engine.py": "\"\"\"Laytime 계산 엔진 (규칙 기반, AI 의존성 없음).\n\n- 시간 단위: 분. 1일 = 1,440분.\n- 금액: 요율 × 분 / 1,440 (pro rata), 최종 금액에서 1회 USD 0.01 단위 ROUND_HALF_UP.\n- 같은 입력 → 항상 같은 결과 (결정적).\n\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date, datetime, timedelta\nfrom decimal import ROUND_CEILING, ROUND_FLOOR, ROUND_HALF_UP, Decimal\n\nfrom .constants import EVENT_TYPES, EXCEPTION_LABELS, INTERVAL_EVENTS, LAYTIME_TERMS\nfrom .timeutil import fmt_dt, parse_dt, parse_hm\n\nD0 = Decimal(0)\nD100 = Decimal(100)\nD1440 = Decimal(1440)\nCENT = Decimal(\"0.01\")\n\nSTATUS_OK = \"정상\"\nSTATUS_REVIEW = \"검토 필요\"\nSTATUS_USER = \"사용자 판단\"\nSTATUS_INFO = \"정보\"\n\n\ndef _dec(x) -> Decimal:\n    return Decimal(str(x or 0))\n\n\ndef _minutes(a: datetime, b: datetime) -> int:\n    return int((b - a).total_seconds() // 60)\n\n\ndef segment_key(s: datetime, e: datetime) -> str:\n    return f\"{s:%Y%m%d%H%M}_{e:%Y%m%d%H%M}\"\n\n\ndef allowed_minutes(c: dict) -> Decimal:\n    if c[\"laytime_mode\"] == \"FIXED\":\n        raw = _dec(c[\"fixed_laytime_hours\"]) * 60\n    else:\n        raw = _dec(c[\"cargo_qty\"]) / _dec(c[\"rate_mt_day\"]) * D1440\n    mode = c.get(\"allowed_rounding\", \"ROUND\")\n    if mode == \"EXACT\":\n        return raw\n    rounding = {\"ROUND\": ROUND_HALF_UP, \"DOWN\": ROUND_FLOOR, \"UP\": ROUND_CEILING}[mode]\n    return raw.quantize(Decimal(1), rounding)\n\n\ndef despatch_rate(c: dict) -> Decimal:\n    if c[\"despatch_mode\"] == \"RATIO\":\n        return _dec(c[\"demurrage_rate\"]) * _dec(c[\"despatch_ratio\"])\n    return _dec(c[\"despatch_rate\"])\n\n\ndef excepted_periods(c: dict, start: datetime, end: datetime) -> list[tuple[datetime, datetime, str]]:\n    \"\"\"주말·휴일 제외 구간 (SHINC 이면 없음).\"\"\"\n    if c[\"laytime_terms\"] == \"SHINC\":\n        return []\n    periods: list[tuple[datetime, datetime, str]] = []\n    sd, st_ = int(c[\"weekend_start_dow\"]), parse_hm(c[\"weekend_start_time\"])\n    ed, et = int(c[\"weekend_end_dow\"]), parse_hm(c[\"weekend_end_time\"])\n    day = (start - timedelta(days=8)).date()\n    last = end.date() + timedelta(days=1)\n    while day <= last:\n        if day.weekday() == sd:\n            ps = datetime.combine(day, st_)\n            pe = datetime.combine(day + timedelta(days=(ed - sd) % 7), et)\n            if pe <= ps:\n                pe += timedelta(days=7)\n            periods.append((ps, pe, \"주말\"))\n        day += timedelta(days=1)\n    for h in c.get(\"holidays\") or []:\n        try:\n            d = date.fromisoformat(str(h[\"date\"])[:10])\n        except (KeyError, ValueError):\n            continue\n        ps = datetime.combine(d, datetime.min.time())\n        periods.append((ps, ps + timedelta(days=1), f\"휴일({h.get('name', '')})\"))\n    return sorted(p for p in periods if p[1] > start and p[0] < end)\n\n\ndef _ats_saved(c: dict, end: datetime, remaining: Decimal) -> Decimal:\n    \"\"\"All time saved: Laytime 종료부터 (남은 Laytime 이 소진되었을) 만료 예정 시점까지의 달력 시간.\"\"\"\n    horizon = end + timedelta(minutes=float(remaining) * 3 + 60 * 24 * 60)\n    periods = excepted_periods(c, end, horizon)\n    points = sorted({p for per in periods for p in per[:2] if p > end})\n    t, rem = end, remaining\n    while rem > 0:\n        in_exc = any(ps <= t < pe for ps, pe, _ in periods)\n        nxt = next((p for p in points if p > t), None)\n        if in_exc:\n            t = nxt\n            continue\n        span = Decimal(_minutes(t, nxt)) if nxt else None\n        if span is None or span >= rem:\n            t = t + timedelta(minutes=float(rem))\n            rem = D0\n        else:\n            rem -= span\n            t = nxt\n    return Decimal(str((t - end).total_seconds() / 60))\n\n\ndef _first(events, code):\n    return next((e for e in events if e[\"event_type\"] == code), None)\n\n\ndef _last(events, code):\n    hits = [e for e in events if e[\"event_type\"] == code]\n    return hits[-1] if hits else None\n\n\ndef calculate(c: dict, events: list[dict], overrides: dict | None = None) -> dict:\n    \"\"\"Laytime 계산.\n\n    events: [{\"start\": datetime, \"end\": datetime|None, \"event_type\": str, \"description\": str, \"remarks\": str}]\n    overrides: {segment_key: {\"pct\": float, \"reason\": str}}  — \"검토 필요\" 행에 대한 사용자 판단\n    \"\"\"\n    overrides = overrides or {}\n    notes: list[tuple[str, str]] = []  # (level: info|warning|error, message)\n    evs = sorted((e for e in events if e.get(\"start\")), key=lambda e: e[\"start\"])\n    allowed = allowed_minutes(c)\n    terms_label = LAYTIME_TERMS.get(c[\"laytime_terms\"], c[\"laytime_terms\"])\n    cl_laytime = c.get(\"clause_laytime\") or \"\"\n    cl_nor = c.get(\"clause_nor\") or \"\"\n    cl_dem = c.get(\"clause_demurrage\") or \"\"\n\n    def ref(clause: str, text: str) -> str:\n        return f\"{clause} {text}\".strip()\n\n    laycan_start = parse_dt(c.get(\"laycan_start\"))\n    laycan_end = parse_dt(c.get(\"laycan_end\"))\n\n    # 1) Laytime 개시 ---------------------------------------------------------\n    nor = _first(evs, \"NOR_TENDERED\")[\"start\"]\n    extra_review = 0\n    nors = [e[\"start\"] for e in evs if e[\"event_type\"] == \"NOR_TENDERED\"]\n    if len(nors) > 1:\n        extra_review += 1\n        notes.append((\"warning\", f\"NOR 제출이 {len(nors)}건({', '.join(fmt_dt(n) for n in nors)})입니다 — 첫 NOR 기준으로 계산했습니다. \"\n                                 \"재제출 NOR 이 유효한 경우 무효 NOR 행을 표에서 삭제하세요. [검토 필요]\"))\n    eff_nor = nor\n    commence_basis = ref(cl_nor, \"NOR 제출\")\n    early_nor = bool(laycan_start and nor < laycan_start and not c.get(\"nor_before_laycan_counts\"))\n    early_mode = c.get(\"nor_early_mode\", \"NOT_BEFORE_LAYCAN\")\n    if early_nor and early_mode == \"DEEMED_AT_LAYCAN\":\n        eff_nor = laycan_start\n        commence_basis = ref(cl_nor, \"NOR 은 Laycan 개시 시점에 제출된 것으로 간주\")\n        notes.append((\"warning\", f\"NOR({fmt_dt(nor)})이 Laycan 시작({fmt_dt(laycan_start)}) 이전 제출 → Laycan 시작 시점에 제출된 것으로 보고 Notice time 을 적용했습니다.\"))\n    if laycan_end and nor > laycan_end:\n        notes.append((\"warning\", f\"NOR({fmt_dt(nor)})이 Laycan 종료({fmt_dt(laycan_end)}) 이후입니다. 계약 해제/수리 여부를 검토하세요.\"))\n    if c[\"berth_terms\"] == \"BERTH\":\n        af = _first(evs, \"ALL_FAST\")\n        if af and af[\"start\"] > eff_nor:\n            eff_nor = af[\"start\"]\n            commence_basis = ref(cl_nor, \"Berth charter — 접안 완료 시점에 NOR 유효\")\n            notes.append((\"info\", \"Berth charter 조건으로 접안 완료(All fast) 시점부터 NOR 유효로 처리했습니다.\"))\n        elif not af:\n            notes.append((\"warning\", \"Berth charter 조건이나 접안 완료(All fast) 이벤트가 없습니다.\"))\n    if c[\"berth_terms\"] == \"WIFPON\":\n        fp = _first(evs, \"FREE_PRATIQUE\")\n        if fp and fp[\"start\"] > nor:\n            notes.append((\"warning\", \"WIFPON 조건: 검역 완료가 NOR 이후입니다. NOR 유효성(검역 조건)을 검토하세요.\"))\n\n    notice_min = int((_dec(c.get(\"notice_hours\")) * 60).quantize(Decimal(1), ROUND_HALF_UP))\n    commence = eff_nor + timedelta(minutes=notice_min)\n    commence_basis += f\" + Notice time {c.get('notice_hours')}h\"\n    if early_nor and early_mode == \"NOT_BEFORE_LAYCAN\":\n        if commence < laycan_start:\n            commence = laycan_start\n            commence_basis = ref(cl_nor, \"Laytime 은 Laycan 개시 전 기산 불가 → Laycan 시작\")\n        notes.append((\"warning\", f\"NOR({fmt_dt(nor)})이 Laycan 시작({fmt_dt(laycan_start)}) 이전 제출 → NOR+Notice time 과 Laycan 시작 중 늦은 시점({fmt_dt(commence)})부터 기산했습니다.\"))\n    ops_start = _first(evs, \"COMMENCED\")[\"start\"]\n    ops_end = _last(evs, \"COMPLETED\")[\"start\"]\n    if c.get(\"commence_if_sooner\") and ops_start < commence:\n        floor = laycan_start if (laycan_start and not c.get(\"nor_before_laycan_counts\")) else None\n        sooner = max(ops_start, floor) if floor else ops_start\n        if sooner < commence:\n            commence = sooner\n            commence_basis = ref(cl_nor, \"Notice time 만료 전 하역 개시 → 실제 개시 시점\")\n            notes.append((\"info\", \"Notice time 만료 전에 하역이 개시되어 실제 개시 시점부터 기산했습니다 (unless sooner commenced).\"))\n\n    # 2) Laytime 종료 ---------------------------------------------------------\n    end_ev = _last(evs, c[\"laytime_end_event\"])\n    if not end_ev:\n        end_ev = _last(evs, \"COMPLETED\")\n        notes.append((\"warning\", \"Laytime 종료 이벤트가 없어 하역 완료 시점으로 종료했습니다.\"))\n    end = end_ev[\"start\"]\n\n    rows: list[dict] = []\n    if nor < commence:\n        rows.append(_row(nor, commence, Decimal(_minutes(nor, commence)), D0, D0, commence_basis, \"Laytime 개시 전 (미반영)\", STATUS_INFO))\n\n    intervals = [e for e in evs if e[\"event_type\"] in INTERVAL_EVENTS and e.get(\"end\") and e[\"end\"] > e[\"start\"]]\n    periods = excepted_periods(c, commence, end) if end > commence else []\n\n    if end <= commence:\n        extra_review += 1\n        notes.append((\"warning\", f\"Laytime 종료({fmt_dt(end)})가 Laytime 개시({fmt_dt(commence)}) 이전/동시입니다 — \"\n                                 \"Time used 0 으로 계산했습니다. 계약상 처리(전량 Despatch 여부)를 검토하세요. [검토 필요]\"))\n    points = {commence, end, ops_start, ops_end}\n    for iv in intervals:\n        points.update((iv[\"start\"], iv[\"end\"]))\n    for ps, pe, _ in periods:\n        points.update((ps, pe))\n    bounds = sorted(p for p in points if commence <= p <= end)\n    segments = list(zip(bounds[:-1], bounds[1:]))\n\n    def is_working(s, e):\n        return ops_start <= s and e <= ops_end and not any(iv[\"start\"] <= s and iv[\"end\"] >= e for iv in intervals)\n\n    cum = D0\n    expiry: datetime | None = None\n    expire_at: datetime | None = None  # 만료 시점으로 분할한 경계\n    # 만료 경계는 화면·Excel 표시를 위해 분 단위로 자르지만, 실제 만료는 소수 분일 수 있다\n    # (Allowed 가 정수 분이 아니거나 비정수 반영률). 잘린 차이(분)를 다음 구간에 넘겨 총 사용시간이 실제와 같게 한다.\n    carry = D0\n    i = 0\n    while i < len(segments):\n        s, e = segments[i]\n        dur = _minutes(s, e)\n        if dur <= 0:\n            i += 1\n            continue\n        on_dem = cum >= allowed\n        active = [iv for iv in intervals if iv[\"start\"] <= s and iv[\"end\"] >= e]\n        in_exc = [p for p in periods if p[0] <= s and p[1] >= e]\n\n        cands: list[tuple[Decimal, str, str, bool]] = []  # (pct, 조항, 비고, 검토필요)\n        for iv in active:\n            code = iv[\"event_type\"]\n            key = INTERVAL_EVENTS[code]\n            desc = iv.get(\"description\") or EVENT_TYPES[code]\n            if key is None:\n                cands.append((D100, \"\", f\"{desc} — 계약 근거 없음, 반영 여부 판단 필요\", True))\n                continue\n            rule = c[\"exceptions\"][key]\n            label = EXCEPTION_LABELS[key]\n            if rule.get(\"applies\"):\n                cands.append((_dec(rule.get(\"counted_pct\")), rule.get(\"clause\") or label, f\"{desc} (예외: {label})\", False))\n            else:\n                cands.append((D100, ref(cl_laytime, terms_label), f\"{desc} — 계약상 예외 아님 (계속 반영)\", False))\n        for ps, pe, plabel in in_exc:\n            if c[\"excepted_used\"] == \"UU\" and is_working(s, e):\n                cands.append((D100, ref(cl_laytime, f\"{c['laytime_terms']} UU\"), f\"{plabel} 중 하역 (UU)\", False))\n            else:\n                tag = \"EIU\" if c[\"excepted_used\"] == \"EIU\" else \"미사용\"\n                cands.append((D0, ref(cl_laytime, f\"{c['laytime_terms']} {tag}\"), f\"{plabel} 제외\", False))\n\n        if cands:\n            pct = min(x[0] for x in cands)\n            clause = \" / \".join(dict.fromkeys(x[1] for x in cands if x[1]))\n            remark = \" / \".join(x[2] for x in cands)\n            review = any(x[3] for x in cands)\n            if len(active) > 1:\n                review = True\n                remark += \" — 예외 중복 (이중 공제 방지: 최저 반영률 1회 적용)\"\n        else:\n            pct, clause, remark, review = D100, ref(cl_laytime, terms_label), \"\", False\n\n        if on_dem and c.get(\"oodaod\"):\n            if pct < D100:\n                remark = f\"OODAOD — 체선 중 예외 미적용 (원래: {remark})\"\n                if any(iv[\"event_type\"] == \"BREAKDOWN_SHIP\" for iv in active):\n                    review = True\n                    remark += \" — 선박 귀책 고장은 체선 중에도 제외될 수 있음\"\n            pct = D100\n            clause = ref(cl_dem, \"Once on demurrage, always on demurrage\")\n\n        auto_pct = pct\n        status = STATUS_REVIEW if review else STATUS_OK\n        key = segment_key(s, e)\n        if key in overrides and overrides[key].get(\"pct\") is not None:\n            pct = _dec(overrides[key][\"pct\"])\n            status = STATUS_USER\n            reason = overrides[key].get(\"reason\") or \"\"\n            remark = f\"{remark} — 사용자 판단 {pct}%\" + (f\": {reason}\" if reason else \"\")\n\n        counted = Decimal(dur) * pct / D100\n        if on_dem and carry:\n            # 표시 경계(분)와 실제 만료(소수 분)의 차이만큼 이 구간의 실제 체선 시간을 보정\n            counted = max(D0, Decimal(dur) + carry) * pct / D100\n            carry = D0\n        # Laytime 만료 시점에서 구간 분할 (체선 진입 시점 표시 + OODAOD 적용 경계).\n        # 만료 시점은 분 단위로 맞추고, 만료까지의 반영시간은 Allowed 와 정확히 같게 한다\n        # (비정수 반영률의 반올림 잔차 때문에 체선 진입이 누락되지 않도록). 잘린 소수 분은 carry 로 다음 구간에 넘긴다.\n        if not on_dem and pct > 0 and cum + counted >= allowed:\n            exact = (allowed - cum) * D100 / pct\n            split = int(exact.quantize(Decimal(1), ROUND_HALF_UP))\n            if split <= 0:  # 잔여 Laytime 이 1분 미만 → 이 구간 시작 시점에 만료\n                cum, expiry, carry = allowed, s, -exact\n                continue\n            if split < dur:\n                mid = s + timedelta(minutes=split)\n                segments[i : i + 1] = [(s, mid), (mid, e)]\n                expire_at, carry = mid, Decimal(split) - exact\n                continue\n            expire_at, carry = e, Decimal(dur) - exact\n        if expire_at is not None and e == expire_at and not on_dem:\n            counted = allowed - cum\n\n        cum += counted\n        if expiry is None and cum >= allowed:\n            expiry = s if on_dem else e\n        row = _row(s, e, Decimal(dur), pct, counted, clause, remark, status, cum=cum, auto_pct=auto_pct)\n        row[\"on_demurrage\"] = on_dem\n        rows.append(row)\n        i += 1\n\n    # 3) 결과 ----------------------------------------------------------------\n    used = cum\n    dem_rate = _dec(c[\"demurrage_rate\"])\n    des_rate = despatch_rate(c)\n    if used > allowed:\n        kind, diff, rate = \"DEMURRAGE\", used - allowed, dem_rate\n    elif used < allowed:\n        kind, rate = \"DESPATCH\", des_rate\n        if c[\"despatch_basis\"] == \"ATS\":\n            diff = _ats_saved(c, end, allowed - used)\n        else:\n            diff = allowed - used\n    else:\n        kind, diff, rate = \"NIL\", D0, D0\n    amount = (rate * diff / D1440).quantize(CENT, ROUND_HALF_UP)\n    if kind == \"DESPATCH\" and rate == 0:\n        notes.append((\"warning\", \"Despatch 요율이 0 이라 조출료가 USD 0.00 입니다. 계약(free despatch 여부)을 확인하세요.\"))\n\n    review_count = sum(1 for r in rows if r[\"status\"] == STATUS_REVIEW) + extra_review\n    if review_count:\n        notes.append((\"warning\", f\"'검토 필요' 항목 {review_count}건 — 사용자 판단 입력 후 확정하세요.\"))\n\n    return {\n        \"allowed\": allowed,\n        \"used\": used,\n        \"diff\": diff,\n        \"kind\": kind,\n        \"rate\": rate,\n        \"demurrage_rate\": dem_rate,\n        \"despatch_rate\": des_rate,\n        \"amount\": amount,\n        \"nor\": nor,\n        \"eff_nor\": eff_nor,\n        \"commence\": commence,\n        \"commence_basis\": commence_basis,\n        \"end\": end,\n        \"expiry\": expiry,\n        \"rows\": rows,\n        \"notes\": notes,\n        \"review_count\": review_count,\n    }\n\n\ndef _row(s, e, dur, pct, counted, clause, remark, status, cum=None, auto_pct=None) -> dict:\n    return {\n        \"from\": s,\n        \"to\": e,\n        \"duration\": dur,\n        \"pct\": pct,\n        \"auto_pct\": pct if auto_pct is None else auto_pct,\n        \"counted\": counted,\n        \"cumulative\": cum,\n        \"clause\": clause,\n        \"remarks\": remark,\n        \"status\": status,\n        \"key\": segment_key(s, e),\n        \"on_demurrage\": False,\n    }\n", "core/sample.py": "\"\"\"데모/테스트용 샘플 계약 및 SOF.\"\"\"\nfrom datetime import datetime\n\nfrom .contract import normalize_contract\n\n\ndef sample_contract() -> dict:\n    return normalize_contract(\n        {\n            \"basis\": \"CP\",\n            \"port_type\": \"LOAD\",\n            \"vessel\": \"MV SAMPLE STAR\",\n            \"port\": \"Port Hedland\",\n            \"country\": \"AU\",\n            \"counterparty\": \"\",\n            \"laycan_start\": \"2026-03-01 00:00\",\n            \"laycan_end\": \"2026-03-10 23:59\",\n            \"cargo_qty\": 150000.0,\n            \"laytime_mode\": \"RATE\",\n            \"rate_mt_day\": 32000.0,\n            \"laytime_terms\": \"SHINC\",\n            \"demurrage_rate\": 20000.0,\n            \"despatch_mode\": \"RATIO\",\n            \"despatch_ratio\": 0.5,\n            \"despatch_basis\": \"WTS\",\n            \"notice_hours\": 6.0,\n            \"commence_if_sooner\": True,\n            \"berth_terms\": \"WIBON\",\n            \"laytime_end_event\": \"COMPLETED\",\n            \"oodaod\": True,\n            \"clause_laytime\": \"Cl.5\",\n            \"clause_nor\": \"Cl.6\",\n            \"clause_demurrage\": \"Cl.7\",\n            \"exceptions\": {\n                \"shifting\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"Cl.8 Shifting\"},\n                \"draft_survey\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"Cl.9 Draft survey\"},\n                \"weather\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"Cl.10 WWD\"},\n                \"breakdown_ship\": {\"applies\": True, \"counted_pct\": 0.0, \"clause\": \"Cl.11\"},\n                \"breakdown_shore\": {\"applies\": False, \"counted_pct\": 0.0, \"clause\": \"\"},\n                \"strike
